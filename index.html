<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Soyin</title>
    
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carga de React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Carga de Babel para leer JSX directamente en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap');
        
        /* ¡Quitamos el overflow hidden para que haga scroll natural! */
        body { margin: 0; background-color: #020205; }
        
        .font-name { font-family: 'Dancing Script', cursive; }
        .font-timer { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        @keyframes heartbeat-large {
          0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          15% { transform: scale(1.25); filter: drop-shadow(0 0 30px rgba(225, 29, 72, 0.8)); }
          30% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          45% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(225, 29, 72, 0.6)); }
          100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
        }

        .heart-beat { animation: heartbeat-large 1.5s infinite ease-in-out; }

        @keyframes float-up {
          0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
          100% { transform: translateY(-150px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .animate-float-up { animation: float-up 1s ease-out forwards; }

        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }
        .animate-twinkle { animation: twinkle infinite ease-in-out; }

        @keyframes pulse-slow {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 4s infinite ease-in-out; }

        .moon-glow {
          box-shadow: 0 0 60px rgba(255, 255, 255, 0.1), inset -10px -10px 20px rgba(0,0,0,0.5);
        }
        
        /* Animaciones para la carta interior */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 1s ease-in forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG REEMPLAZANDO LUCIDE-REACT ---
        const HeartIcon = ({ size = 24, className = "", fill = "none" }) => (
            <svg width={size} height={size} className={className} fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        );
        const PlayIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        );
        const PauseIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
        );
        const SparklesIcon = ({ size = 24, className = "", style = {} }) => (
            <svg width={size} height={size} className={className} style={style} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        );
        const ChevronRightIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        );
        const BookIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        );
        const ArrowLeftIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        );

        /* =========================================
           BASE DE DATOS: DIARIO DE NUESTRO AMOR
           ========================================= */
        const entradasDiario = [
            { 
                fecha: "2026-05-02", 
                texto: "He creado este espacio pensando en todo lo que siento por ti. Cada día lo alimentaré con aquellas cosas que solamente sienten mi pecho y mi alma. Será tu elección si deseas descubrirlo, pero me encargaré de cuidar este rincón para ti, por lo mucho que me importas y lo infinito que te amo..." 
            },
            { 
                fecha: "2026-05-03", 
                texto: "Si alguna vez ya pasaste por aquí… me alegra que hoy vuelvas.\n\nY si es la primera vez, entonces déjame decirte algo:\neste rincón no nació en un solo día…\n\nAquí guardo todo… incluso lo que a veces no sé cómo decirte.\n\nY si algún día dudas, recuerda esto:\nsi tú no lo recuerdas… yo me encargué de guardar cada detalle." 
            }
        ];

        const App = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [showDiario, setShowDiario] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [msgIndex, setMsgIndex] = useState(0);
            const [timeElapsed, setTimeElapsed] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });
            const [clickEffect, setClickEffect] = useState(0);
            const audioRef = useRef(null);

            // Audio desde Dropbox
            const musicUrl = "https://www.dropbox.com/scl/fi/gu9nc2hzwrdwe4j6juirr/WhatsApp-Audio-2026-05-02-at-12.41.30-AM.mpeg?rlkey=jk1xoc5fack3iz1895116zsdb&st=8vzi5jfn&raw=1"; 

            // ¡AQUÍ ESTABAN LOS ERRORES DE LAS COMAS! Ya están corregidos.
            const thoughts = [
                { texto: "Hoy mi corazón late un poco más fuerte al pensar en tu sonrisa.", fecha: "2026-05-02" },
                { texto: "En este rincón, cada suspiro lleva tu nombre tatuado.", fecha: "2026-05-02" },
                { texto: "Eres el refugio donde mi alma encuentra paz.", fecha: "2026-05-02" },
                { texto: "Si pudieras escuchar mis latidos, oirías una canción dedicada a ti.", fecha: "2026-05-02" },
                { texto: "Cada día a tu lado es un regalo que guardo en este espacio secreto.", fecha: "2026-05-02" },
                { texto: "No importa la distancia, mi alma siempre encuentra el camino de regreso a ti.", fecha: "2026-05-02" },
                { texto: "Eres la luz que ilumina incluso mis días más oscuros.", fecha: "2026-05-02" },
                { texto: "En cada detalle de este rincón, hay un trocito de mi amor por ti.", fecha: "2026-05-02" },
                { texto: "A veces me falta el aire, y solo tu recuerdo me devuelve la vida.", fecha: "2026-05-02" },
                { texto: "Eres mi pensamiento favorito al despertar y mi último deseo al dormir.", fecha: "2026-05-02" },
                { texto: "Aquí, el tiempo se detiene para que solo existamos tú y yo.", fecha: "2026-05-02" },
                { texto: "Tu amor es el pulso que mantiene vivo este rincón.", fecha: "2026-05-02" },
                { texto: "Gracias por ser la razón de mis latidos más profundos.", fecha: "2026-05-02" },
                { texto: "Cada mensaje aquí es una promesa de que siempre estaré contigo.", fecha: "2026-05-02" },
                { texto: "Eres la melodía que mi alma no deja de tararear.", fecha: "2026-05-02" },
                { texto: "En la calma de este espacio, te digo: te amo más que ayer.", fecha: "2026-05-02" },
                { texto: "Tu esencia está impregnada en cada letra que escribo aquí.", fecha: "2026-05-02" },
                { texto: "Eres mi hogar, mi paz y mi mayor alegría.", fecha: "2026-05-02" },
                { texto: "Mirar este rincón es recordarme lo afortunado que soy de tenerte.", fecha: "2026-05-02" },
                { texto: "Eres la respuesta a todas las preguntas de mi corazón.", fecha: "2026-05-02" },
                { texto: "No sé en qué momento dejé de entenderme, pero sé exactamente por qué: porque sentirte a ti me cambió por dentro.", fecha: "2026-05-03" },
                { texto: "Hay algo en ti que desordena mi mente, pero le da sentido a todo lo que soy.", fecha: "2026-05-03" },
                { texto: "Quisiera estar a tu lado no para decirte lo que siento, sino para que lo veas en cada gesto mío.", fecha: "2026-05-03" },
                { texto: "No es solo que te quiera, es que contigo descubrí una forma más real de sentir la vida.", fecha: "2026-05-03" },
                { texto: "Si sigo aquí es porque lo que siento por ti no es impulso, es una decisión que tomo todos los días.", fecha: "2026-05-03" },
                { texto: "A veces me cuesta controlarme, no por debilidad, sino porque lo que provocas en mí es demasiado verdadero.", fecha: "2026-05-03" },
                { texto: "No quiero a nadie más, no por falta de opciones, sino porque ya encontré en ti lo que vale la pena.", fecha: "2026-05-03" },
                { texto: "No te necesito para existir, pero sí te elijo para construir algo que tenga sentido.", fecha: "2026-05-03" },
                { texto: "Me haces querer ser mejor, no por miedo a perderte, sino por el deseo de merecerte.", fecha: "2026-05-03" },
                { texto: "Hay una calma en pensar en ti que supera cualquier caos dentro de mí.", fecha: "2026-05-03" },
                { texto: "No es obsesión… es que mi mundo encontró dirección cuando apareciste tú.", fecha: "2026-05-03" },
                { texto: "Quiero cuidarte, pero no desde la necesidad, sino desde el compromiso de estar realmente presente.", fecha: "2026-05-03" },
                { texto: "No prometo perfección, pero sí una verdad constante: quedarme cuando todo se vuelva difícil.", fecha: "2026-05-03" },
                { texto: "Aunque no respondas, aunque el silencio pese, aquí sigo… no por costumbre, sino por convicción.", fecha: "2026-05-03" },
                { texto: "No busco que siempre estés, pero sí que sepas que yo no me voy cuando las cosas se vuelven reales.", fecha: "2026-05-03" },
                { texto: "Lo que siento por ti no es ruido, es algo profundo que incluso en silencio sigue creciendo.", fecha: "2026-05-03" },
                { texto: "Si alguna vez dudas, recuerda esto: no estoy aquí por impulso, estoy aquí porque te elegí.", fecha: "2026-05-03" },
                { texto: "Quiero avanzar contigo, no rápido… pero sí seguro, firme y sin mirar atrás.", fecha: "2026-05-03" },
                { texto: "No eres todo mi mundo… pero sí la parte más importante de él.", fecha: "2026-05-03" },
                { texto: "Si me quedo, no es porque no pueda irme… es porque contigo encontré un lugar donde quiero estar.", fecha: "2026-05-03" }
            ];

            // Obtener el mensaje del día (el último guardado en el arreglo)
            const mensajeDelDia = entradasDiario[entradasDiario.length - 1];

            const formatearFecha = (fechaString) => {
                const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                // Asegurar que la fecha se lea correctamente reemplazando guiones
                const fecha = new Date(fechaString + "T00:00:00");
                return fecha.toLocaleDateString('es-ES', opciones);
            };

            useEffect(() => {
                const startDate = new Date('2025-12-17T00:00:00');
                
                const timer = setInterval(() => {
                const now = new Date();
                const diff = now - startDate;

                if (diff > 0) {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const mins = Math.floor((diff / 1000 / 60) % 60);
                    const secs = Math.floor((diff / 1000) % 60);
                    setTimeElapsed({ days, hours, mins, secs });
                }
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                setMsgIndex(Math.floor(Math.random() * thoughts.length));
            }, []);

            const nextMessage = () => {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * thoughts.length);
                } while (nextIdx === msgIndex && thoughts.length > 1);
                
                setMsgIndex(nextIdx);
                setClickEffect((prev) => prev + 1);
            };

            const toggleMusic = () => {
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play().catch(e => console.log("Audio play blocked"));
                }
                setIsPlaying(!isPlaying);
            };

            // Generar estrellas una sola vez
            const [stars] = useState(() => Array.from({ length: 60 }).map((_, i) => ({
                id: i,
                width: `${Math.random() * 3 + 1}px`,
                height: `${Math.random() * 3 + 1}px`,
                left: `${Math.random() * 100}%`,
                top: `${Math.random() * 100}%`,
                animationDuration: `${2 + Math.random() * 4}s`,
                animationDelay: `${Math.random() * 5}s`,
                opacity: Math.random()
            })));

            return (
                <div className="min-h-screen text-rose-50 flex flex-col items-center justify-center relative font-sans w-full">
                    
                    {/* Fondo de Estrellas */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map((star) => (
                        <div
                            key={star.id}
                            className="absolute bg-white rounded-full animate-twinkle"
                            style={star}
                        />
                        ))}
                    </div>

                    {/* El Sol - Decoración de fondo */}
                    <div className="absolute top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                        <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                        <div className="absolute top-8 left-8 md:top-16 md:left-16 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-tr from-amber-200 to-yellow-50 rounded-full shadow-[0_0_80px_rgba(251,191,36,0.4)] animate-pulse-slow flex items-center justify-center opacity-80">
                            <div className="w-full h-full bg-white rounded-full blur-[8px] absolute opacity-40"></div>
                        </div>
                    </div>

                    {/* ============================================
                        PANTALLA 1: MENSAJE DE ENTRADA DEL DÍA
                        ============================================ */}
                    {!isOpen ? (
                        <div className="z-20 flex flex-col items-center animate-in max-w-2xl px-6 py-12 text-center min-h-screen justify-center">
                            
                            <p className="font-timer tracking-[0.3em] text-rose-500 text-xs md:text-sm uppercase mb-4 opacity-80">
                                {formatearFecha(mensajeDelDia.fecha)}
                            </p>
                            
                            <h2 className="font-name text-4xl md:text-5xl text-rose-200 mb-8 drop-shadow-md">
                                Pensamiento de Hoy
                            </h2>

                            <div className="font-body text-base md:text-lg text-rose-100/90 mb-12 leading-relaxed italic drop-shadow-md whitespace-pre-wrap px-4">
                                "{mensajeDelDia.texto}"
                            </div>

                            <div 
                                onClick={() => setIsOpen(true)}
                                className="relative w-72 h-48 bg-[#1a1a2e] rounded-lg shadow-2xl cursor-pointer group hover:scale-105 transition-transform"
                            >
                                <div className="absolute inset-0 border-2 border-rose-900/30 rounded-lg m-1"></div>
                                <div className="absolute top-0 left-0 w-full h-full" style={{ clipPath: 'polygon(0 0, 50% 50%, 100% 0)', background: '#16213e' }}></div>
                                <div className="absolute inset-0 m-auto w-12 h-12 bg-rose-600 rounded-full flex items-center justify-center shadow-lg z-10 heart-beat">
                                    <HeartIcon fill="white" size={24} className="text-white" />
                                </div>
                                <div className="absolute bottom-4 w-full text-center">
                                    <p className="text-[10px] tracking-[0.4em] uppercase text-rose-300/60 font-bold">Entrar a mi corazón</p>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="z-10 w-full max-w-4xl px-4 flex flex-col items-center relative animate-in py-10 min-h-screen">
                        
                            {/* BOTÓN PARA ABRIR/CERRAR EL DIARIO */}
                            <div className="absolute top-4 right-4 md:top-8 md:right-8 z-30">
                                <button 
                                    onClick={() => setShowDiario(!showDiario)}
                                    className="flex items-center gap-2 px-4 py-2 bg-white/[0.05] hover:bg-white/[0.1] border border-white/10 rounded-full transition-colors text-[10px] md:text-xs font-timer tracking-widest uppercase text-rose-300 backdrop-blur-md"
                                >
                                    {showDiario ? (
                                        <><ArrowLeftIcon size={16}/> Volver a latidos</>
                                    ) : (
                                        <><BookIcon size={16}/> Ver nuestro diario</>
                                    )}
                                </button>
                            </div>

                            {/* CABECERA (Luna y Título) */}
                            <div className={`relative mb-8 flex flex-col items-center mt-8 md:mt-4 transition-all duration-500 ${showDiario ? 'scale-90 opacity-80' : 'scale-100'}`}>
                                <div className="w-40 h-40 md:w-56 md:h-56 bg-neutral-100 rounded-full moon-glow flex flex-col items-center justify-center text-neutral-900 overflow-hidden border border-white/20">
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
                                    <p className="text-[10px] md:text-xs font-bold tracking-widest text-rose-600 mb-1">AMÁNDOTE</p>
                                    <div className="flex flex-col items-center space-y-1 font-timer">
                                        <span className="text-2xl md:text-3xl font-bold">{timeElapsed.days}d</span>
                                        <span className="text-xs md:text-sm font-medium tracking-tighter">
                                        {String(timeElapsed.hours).padStart(2, '0')}h : {String(timeElapsed.mins).padStart(2, '0')}m : {String(timeElapsed.secs).padStart(2, '0')}s
                                        </span>
                                    </div>
                                    <p className="text-[8px] md:text-[10px] mt-2 opacity-60">Desde Dic 17, 2025</p>
                                </div>
                            </div>

                            <h1 className={`text-8xl md:text-[10rem] font-name text-rose-100 mb-6 drop-shadow-[0_0_20px_rgba(244,63,94,0.6)] leading-none text-center transition-all duration-500 ${showDiario ? 'hidden' : 'block'}`}>
                                Soyin
                            </h1>

                            {/* ============================================
                                VISTA 2A: EL DIARIO DE ENTRADAS
                                ============================================ */}
                            {showDiario ? (
                                <div className="w-full max-w-2xl bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-[3rem] p-6 md:p-12 shadow-2xl relative animate-in mx-auto mt-4">
                                    <h2 className="font-name text-4xl text-rose-300 text-center mb-2">Nuestro Diario</h2>
                                    <p className="text-center text-rose-200/50 text-xs font-timer tracking-widest uppercase mb-10">Donde guardo lo que siento</p>
                                    
                                    <div className="relative border-l-2 border-rose-900/40 ml-2 md:ml-4 space-y-12 pb-6">
                                        {/* Invertimos el array para que el más nuevo salga primero */}
                                        {[...entradasDiario].reverse().map((entrada, idx) => (
                                            <div key={idx} className="relative pl-6 md:pl-8">
                                                {/* Punto en la línea de tiempo */}
                                                <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-rose-600 ring-4 ring-[#020205]"></div>
                                                
                                                <p className="text-rose-400 text-[10px] md:text-xs font-timer tracking-widest uppercase mb-3">
                                                    {formatearFecha(entrada.fecha)}
                                                </p>
                                                
                                                <div className="bg-white/[0.03] border border-white/[0.05] p-5 rounded-2xl text-rose-50/90 font-body text-sm md:text-base leading-relaxed whitespace-pre-wrap hover:bg-white/[0.06] transition-colors">
                                                    {entrada.texto}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                            /* ============================================
                                VISTA 2B: LOS LATIDOS ALEATORIOS (Original)
                                ============================================ */
                                <div className="w-full max-w-2xl bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-[3.5rem] p-8 md:p-16 shadow-2xl relative text-center mx-auto animate-in">
                                    
                                    <div className="mb-10 flex justify-center">
                                        <div className="heart-beat">
                                            <HeartIcon size={80} className="text-rose-500 transition-all duration-500" fill="currentColor" />
                                        </div>
                                    </div>

                                    <div key={msgIndex} className="animate-in">
                                        <p className="text-rose-400/40 text-[10px] font-bold tracking-[0.6em] mb-6 uppercase">Un latido para ti</p>
                                        <p className="text-2xl md:text-4xl font-body font-light leading-relaxed text-rose-50/90 tracking-wide">
                                            "{thoughts[msgIndex].texto}"
                                        </p>
                                        <p className="text-[9px] md:text-[10px] font-timer text-rose-300/40 mt-6 tracking-widest uppercase">
                                            Guardado el: {formatearFecha(thoughts[msgIndex].fecha)}
                                        </p>
                                    </div>

                                    {/* Efecto de partículas al cambiar latido */}
                                    <div key={`effect-${clickEffect}`} className="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden rounded-[3.5rem] z-0">
                                        {clickEffect > 0 && Array.from({ length: 12 }).map((_, i) => {
                                            const isHeart = i % 2 === 0;
                                            return isHeart ? (
                                                <HeartIcon
                                                    key={i}
                                                    size={16 + Math.random() * 24}
                                                    className="absolute animate-float-up text-rose-500"
                                                    style={{
                                                        left: `${20 + Math.random() * 60}%`,
                                                        top: '70%',
                                                        animationDuration: `${0.8 + Math.random() * 0.7}s`,
                                                        animationDelay: `${Math.random() * 0.2}s`,
                                                        opacity: 0,
                                                    }}
                                                    fill="currentColor"
                                                />
                                            ) : (
                                                <SparklesIcon
                                                    key={i}
                                                    size={12 + Math.random() * 16}
                                                    className="absolute animate-float-up text-amber-300"
                                                    style={{
                                                        left: `${20 + Math.random() * 60}%`,
                                                        top: '70%',
                                                        animationDuration: `${0.8 + Math.random() * 0.7}s`,
                                                        animationDelay: `${Math.random() * 0.2}s`,
                                                        opacity: 0,
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>

                                    <button 
                                        onClick={nextMessage}
                                        className="mt-12 flex items-center space-x-3 mx-auto text-rose-400/60 hover:text-rose-200 transition-all group px-6 py-2 rounded-full border border-rose-900/20 bg-rose-900/5 relative overflow-hidden z-10"
                                    >
                                        <span className="text-[10px] uppercase tracking-[0.4em] font-bold">Ver otro latido</span>
                                        <ChevronRightIcon size={16} className="group-hover:translate-x-1 transition-transform" />
                                    </button>
                                </div>
                            )}

                            {/* REPRODUCTOR DE MÚSICA (Siempre visible abajo) */}
                            <div className="mt-10 flex flex-col items-center pb-8 z-20">
                                <button 
                                    onClick={toggleMusic}
                                    className={`w-16 h-16 rounded-full flex items-center justify-center transition-all border-2 ${isPlaying ? 'bg-rose-600/20 border-rose-500 scale-110 shadow-[0_0_30px_rgba(244,63,94,0.3)]' : 'bg-transparent border-rose-500/30 hover:border-rose-400'}`}
                                >
                                    {isPlaying ? <PauseIcon size={28} /> : <PlayIcon size={28} className="ml-1" />}
                                </button>
                                <p className="mt-4 text-[10px] uppercase tracking-[0.5em] text-rose-400/60 font-bold text-center">
                                    {isPlaying ? "Nuestra melodía suena..." : "Dale vida a mi rincón"}
                                </p>
                            </div>

                            <footer className="mt-8 mb-16 text-center opacity-30 group hover:opacity-100 transition-opacity z-20">
                                <p className="font-body text-xs italic tracking-widest mb-2">
                                    "En este infinito, tú eres mi estrella más brillante"
                                </p>
                                <p className="text-[10px] font-bold uppercase tracking-[0.8em]">Anthony</p>
                            </footer>

                            <audio ref={audioRef} src={musicUrl} loop />
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
