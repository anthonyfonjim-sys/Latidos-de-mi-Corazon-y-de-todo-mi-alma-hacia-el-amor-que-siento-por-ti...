<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Soyin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap');
        
        body { margin: 0; background-color: #020205; color: white; }
        
        .font-name { font-family: 'Dancing Script', cursive; }
        .font-timer { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        @keyframes heartbeat-large {
          0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          15% { transform: scale(1.25); filter: drop-shadow(0 0 30px rgba(225, 29, 72, 0.8)); }
          30% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          45% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(225, 29, 72, 0.6)); }
          100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
        }
        .heart-beat { animation: heartbeat-large 1.5s infinite ease-in-out; }

        @keyframes float-up {
          0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
          100% { transform: translateY(-100px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .animate-float-up { animation: float-up 1s ease-out forwards; }

        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }
        .animate-twinkle { animation: twinkle infinite ease-in-out; }

        @keyframes pulse-slow {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 4s infinite ease-in-out; }

        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(244,63,94,0.3), 0 0 40px rgba(244,63,94,0.1); }
            50% { text-shadow: 0 0 30px rgba(244,63,94,0.7), 0 0 60px rgba(244,63,94,0.3); }
        }
        .animate-text-glow { animation: text-glow 4s infinite ease-in-out; }

        .moon-glow { box-shadow: 0 0 60px rgba(255, 255, 255, 0.1), inset -10px -10px 20px rgba(0,0,0,0.5); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS ---
        const HeartIcon = ({ size=24, className="", fill="none", style={} }) => <svg width={size} height={size} className={className} fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={style}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const PlayIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>;
        const PauseIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>;
        const BookIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
        const ArrowLeftIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>;
        const TrashIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const EditIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        const ListIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
        const SparklesIcon = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const EyeIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
        const EyeOffIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>;

        // ==========================================
        // CONFIGURACIÓN FIREBASE
        // ==========================================
        const CORREO_ANTHONY = "anthonyfonjim@gmail.com"; 
        const CORREO_SOYIN = "florsoyincastillo@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyC1s7lLrsC_bRgnCKg2ckBvvykiMvMLC5Q",
            authDomain: "los-latidos-de-mi-corazon.firebaseapp.com",
            projectId: "los-latidos-de-mi-corazon",
            storageBucket: "los-latidos-de-mi-corazon.firebasestorage.app",
            messagingSenderId: "850451293804",
            appId: "1:850451293804:web:9c662b62ad10e68a241a49"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==========================================
        // COMPONENTE: EFECTO MAGICO
        // ==========================================
        const ContenedorMagico = ({ children, color = "text-rose-500" }) => {
            const [particulas, setParticulas] = useState([]);
            
            const manejarClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const id = Date.now();
                setParticulas(prev => [...prev, {id, x, y}]);
                setTimeout(() => setParticulas(prev => prev.filter(p => p.id !== id)), 1000);
            };

            return (
                <div onClick={manejarClick} className="relative cursor-pointer transition-transform hover:scale-[1.01] w-full">
                    {children}
                    {particulas.map(p => (
                        <div key={p.id} className="absolute pointer-events-none z-50" style={{ left: p.x, top: p.y }}>
                            {Array.from({length: 6}).map((_, i) => (
                                <HeartIcon key={i} size={10 + Math.random()*15} className={`absolute animate-float-up ${color}`} fill="currentColor" 
                                    style={{ 
                                        left: `${(Math.random() - 0.5) * 60}px`, top: `${(Math.random() - 0.5) * 60}px`, animationDelay: `${Math.random() * 0.1}s`
                                    }} 
                                />
                            ))}
                        </div>
                    ))}
                </div>
            );
        };

        // ==========================================
        // APLICACIÓN PRINCIPAL
        // ==========================================
        const App = () => {
            // DB States
            const [diario, setDiario] = useState([]);
            const [latidos, setLatidos] = useState([]);
            const [mensajesSoyin, setMensajesSoyin] = useState([]);
            const [musicUrl, setMusicUrl] = useState("");
            const [fechaInicioRelacion, setFechaInicioRelacion] = useState("2025-12-17");
            const [bienvenidaAnthony, setBienvenidaAnthony] = useState({});
            const [bienvenidaSoyin, setBienvenidaSoyin] = useState({});
            
            // Navegación Limpia y Blindada
            const [vistaActual, setVistaActual] = useState('portada'); 
            
            // Interfaz
            const [isPlaying, setIsPlaying] = useState(false);
            const [idxLatidoHoy, setIdxLatidoHoy] = useState(0);
            const [idxSoyinHoy, setIdxSoyinHoy] = useState(0);
            const [timeElapsed, setTimeElapsed] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });
            const audioRef = useRef(null);
            
            // Login & Reset
            const [showLogin, setShowLogin] = useState(false);
            const [loginTarget, setLoginTarget] = useState(""); 
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPass, setShowPass] = useState(false); 
            const [isResettingPassword, setIsResettingPassword] = useState(false);
            const [resetEmail, setResetEmail] = useState("");
            
            // Forms Anthony
            const [nuevoTexto, setNuevoTexto] = useState("");
            const [nuevaFecha, setNuevaFecha] = useState("");
            const [nuevaHora, setNuevaHora] = useState("");
            const [tipoMensaje, setTipoMensaje] = useState("latidos"); 
            const [nuevaMusica, setNuevaMusica] = useState("");
            const [nuevaFechaRelacion, setNuevaFechaRelacion] = useState("");
            const [formBienvenidaAnthony, setFormBienvenidaAnthony] = useState("");
            const [nuevaPassAnthony, setNuevaPassAnthony] = useState("");
            const [confPassAnthony, setConfPassAnthony] = useState("");
            const [showPassAnth, setShowPassAnth] = useState(false);

            // Forms Soyin
            const [nuevoTextoSoyin, setNuevoTextoSoyin] = useState("");
            const [fechaMensajeSoyin, setFechaMensajeSoyin] = useState("");
            const [horaMensajeSoyin, setHoraMensajeSoyin] = useState("");
            const [nuevoDiarioSoyin, setNuevoDiarioSoyin] = useState("");
            const [fechaDiarioSoyin, setFechaDiarioSoyin] = useState("");
            const [horaDiarioSoyin, setHoraDiarioSoyin] = useState("");
            const [formBienvenidaSoyin, setFormBienvenidaSoyin] = useState("");
            const [nuevaPassSoyin, setNuevaPassSoyin] = useState("");
            const [confPassSoyin, setConfPassSoyin] = useState("");
            const [showPassSoyin, setShowPassSoyin] = useState(false);

            const isAnthony = user?.email === CORREO_ANTHONY;
            const isSoyin = user?.email === CORREO_SOYIN;

            // Funciones Mágicas de Fechas y Segundos
            const obtenerFechaHoyLocal = () => {
                const hoy = new Date();
                const year = hoy.getFullYear();
                const month = String(hoy.getMonth() + 1).padStart(2, '0');
                const day = String(hoy.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const obtenerHoraExacta = () => {
                const hoy = new Date();
                return hoy.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            };

            const formatearFechaHora = (fecha, hora) => {
                if(!fecha) return "Fecha no registrada";
                try {
                    const d = new Date(`${fecha}T00:00:00`);
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return `${d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} a las ${hora || '12:00'}`;
                } catch(e) { return "Fecha inválida"; }
            };

            const formatearFechaSimple = (fechaString) => {
                if(!fechaString) return "Fecha no registrada";
                try {
                    const d = new Date(fechaString + "T00:00:00");
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                } catch(e) { return "Fecha inválida"; }
            };

            const formatearFechaHoraBaseDatos = (ts) => {
                if(!ts) return "Publicado hoy";
                try {
                    const d = ts.toDate ? ts.toDate() : new Date(ts);
                    if(isNaN(d.getTime())) return "Publicado hoy";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                } catch(e) { return "Publicado hoy"; }
            };

            // Cronómetro
            useEffect(() => {
                const startDate = new Date(fechaInicioRelacion + 'T00:00:00');
                const timer = setInterval(() => {
                    const diff = new Date() - startDate;
                    if (diff > 0) {
                        setTimeElapsed({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            mins: Math.floor((diff / 1000 / 60) % 60),
                            secs: Math.floor((diff / 1000) % 60)
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [fechaInicioRelacion]);

            // Base de Datos Listener
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                
                const unsubLatidos = db.collection("latidos").orderBy("timestamp", "desc").onSnapshot(snap => {
                    setLatidos(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                
                const unsubDiario = db.collection("diario").orderBy("timestamp", "desc").onSnapshot(snap => {
                    setDiario(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubSoyinMsgs = db.collection("mensajes_soyin").orderBy("timestamp", "desc").onSnapshot(snap => {
                    setMensajesSoyin(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubConfig = db.collection("configuracion").doc("general").onSnapshot(doc => {
                    if (doc.exists) { 
                        setMusicUrl(doc.data().musicUrl); setNuevaMusica(doc.data().musicUrl); 
                        if(doc.data().fechaInicioRelacion) {
                            setFechaInicioRelacion(doc.data().fechaInicioRelacion);
                            setNuevaFechaRelacion(doc.data().fechaInicioRelacion);
                        }
                    }
                });

                const unsubBienvenidaAnth = db.collection("bienvenida").doc("anthony").onSnapshot(doc => {
                    if (doc.exists) { setBienvenidaAnthony(doc.data()); setFormBienvenidaAnthony(doc.data().texto || ""); }
                });

                const unsubBienvenidaSoy = db.collection("bienvenida").doc("soyin").onSnapshot(doc => {
                    if (doc.exists) { setBienvenidaSoyin(doc.data()); setFormBienvenidaSoyin(doc.data().texto || ""); }
                });

                return () => { unsubAuth(); unsubLatidos(); unsubDiario(); unsubSoyinMsgs(); unsubConfig(); unsubBienvenidaAnth(); unsubBienvenidaSoy(); };
            }, []);

            // Filtros Estrictos de HOY
            const hoyStr = obtenerFechaHoyLocal();
            const latidosHoy = latidos.filter(l => l.fecha === hoyStr);
            const mensajesSoyinHoy = mensajesSoyin.filter(m => m.fecha === hoyStr);

            const toggleMusic = () => {
                if (isPlaying) audioRef.current.pause();
                else audioRef.current.play().catch(e => console.log(e));
                setIsPlaying(!isPlaying);
            };

            const abrirPanelLogin = (quien) => {
                setLoginTarget(quien);
                setIsResettingPassword(false);
                if (user) {
                    if ((quien === 'anthony' && !isAnthony) || (quien === 'soyin' && !isSoyin)) {
                        auth.signOut();
                    }
                }
                setShowLogin(true);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (error) {
                    alert("Error: Verifica tus credenciales. (" + error.message + ")");
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                if(!resetEmail) return alert("Por favor ingresa tu correo.");
                try {
                    await auth.sendPasswordResetEmail(resetEmail);
                    alert("✅ Te hemos enviado un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada o la carpeta de Spam.");
                    setIsResettingPassword(false);
                } catch (error) {
                    alert("❌ Error: " + error.message);
                }
            };

            const cerrarSesion = () => {
                auth.signOut();
                setShowLogin(false);
            };

            const cambiarPassword = async (e, nuevaPass, confPass, setNuevaPass, setConfPass) => {
                e.preventDefault();
                if(!auth.currentUser) return alert("Sesión expirada");
                if(nuevaPass !== confPass) return alert("❌ Error: Las contraseñas no coinciden. Revisa que ambas sean idénticas.");
                if(nuevaPass.length < 6) return alert("❌ Error: La contraseña debe tener al menos 6 caracteres.");
                try {
                    await auth.currentUser.updatePassword(nuevaPass);
                    alert("✅ ¡Contraseña actualizada con éxito! Úsala la próxima vez que entres.");
                    setNuevaPass(""); setConfPass("");
                } catch (error) {
                    if (error.code === 'auth/requires-recent-login') {
                        alert("⚠️ Por seguridad, necesitas volver a Iniciar Sesión para cambiar la contraseña. Cierra sesión y vuelve a entrar.");
                    } else {
                        alert("Error: " + error.message);
                    }
                }
            };

            const editarDocumento = async (coleccion, id, textoActual) => {
                const nuevoTexto = window.prompt("Edita tu mensaje:", textoActual);
                if (nuevoTexto && nuevoTexto !== textoActual) {
                    await db.collection(coleccion).doc(id).update({ texto: nuevoTexto });
                }
            };

            const eliminarDocumento = async (coleccion, id) => {
                if(window.confirm("¿Seguro que quieres borrar este recuerdo?")) await db.collection(coleccion).doc(id).delete();
            };

            // FUNCIONES AUTOMÁTICAS DE GUARDADO (Anthony)
            const publicarMensajeAnthony = async(e) => {
                e.preventDefault(); 
                if(!nuevoTexto) return alert("Escribe un mensaje, por favor."); 
                const fechaFinal = nuevaFecha || obtenerFechaHoyLocal();
                const horaFinal = nuevaHora || obtenerHoraExacta();

                try {
                    await db.collection(tipoMensaje).add({
                        texto: nuevoTexto, 
                        fecha: fechaFinal, 
                        hora: horaFinal, 
                        autor: 'anthony', 
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }); 
                    setNuevoTexto(""); setNuevaFecha(""); setNuevaHora("");
                    alert("¡Publicado mágicamente!"); 
                } catch(error) {
                    alert("Hubo un error al guardar: " + error.message);
                }
            };

            const guardarBienvenidaAnthony = async (e) => {
                e.preventDefault();
                await db.collection("bienvenida").doc("anthony").set({texto: formBienvenidaAnthony, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                await db.collection("diario").add({
                    texto: `[Carta de Entrada]: ${formBienvenidaAnthony}`, fecha: obtenerFechaHoyLocal(), hora: obtenerHoraExacta(), autor: 'anthony', timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Mensaje de entrada actualizado y guardado en tu historia");
            };

            // FUNCIONES AUTOMÁTICAS DE GUARDADO (Soyin)
            const publicarDiarioSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoDiarioSoyin) return; 
                const fechaFinal = fechaDiarioSoyin || obtenerFechaHoyLocal();
                const horaFinal = horaDiarioSoyin || obtenerHoraExacta();
                await db.collection("diario").add({texto: nuevoDiarioSoyin, fecha: fechaFinal, hora: horaFinal, autor: 'soyin', timestamp: firebase.firestore.FieldValue.serverTimestamp()}); 
                setNuevoDiarioSoyin(""); setFechaDiarioSoyin(""); setHoraDiarioSoyin("");
                alert("¡Historia guardada en el Diario!"); 
            };

            const publicarMensajeCortoSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoTextoSoyin) return; 
                const fechaFinal = fechaMensajeSoyin || obtenerFechaHoyLocal();
                const horaFinal = horaMensajeSoyin || obtenerHoraExacta();
                await db.collection("mensajes_soyin").add({texto: nuevoTextoSoyin, fecha: fechaFinal, hora: horaFinal, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); 
                setNuevoTextoSoyin(""); setFechaMensajeSoyin(""); setHoraMensajeSoyin("");
                alert("¡Latido guardado en tu historial (y en portada si es de hoy)!"); 
            };

            const guardarBienvenidaSoyin = async (e) => {
                e.preventDefault();
                await db.collection("bienvenida").doc("soyin").set({texto: formBienvenidaSoyin, timestamp: firebase.firestore.FieldValue.serverTimestamp()});
                await db.collection("diario").add({
                    texto: `[Carta de Entrada]: ${formBienvenidaSoyin}`, fecha: obtenerFechaHoyLocal(), hora: obtenerHoraExacta(), autor: 'soyin', timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Mensaje de entrada actualizado y guardado en tu historia");
            };

            const [stars] = useState(() => Array.from({ length: 60 }).map((_, i) => ({
                id: i, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
                animationDuration: `${2 + Math.random() * 4}s`, animationDelay: `${Math.random() * 5}s`
            })));

            // ==========================================
            // VISTA: LOGIN Y PANELES ADMINISTRATIVOS
            // ==========================================
            if (showLogin) {
                if (!user || (loginTarget === 'anthony' && !isAnthony) || (loginTarget === 'soyin' && !isSoyin)) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4 relative z-50 bg-[#020205]">
                            <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                                <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                            </div>
                            
                            {isResettingPassword ? (
                                <form onSubmit={handleResetPassword} className="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-5 relative z-10 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                                    <h2 className={`font-name text-3xl text-center mb-2 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>Recuperar Contraseña</h2>
                                    <p className="text-[10px] text-gray-300 text-center uppercase tracking-widest mb-2">Ingresa tu correo para recibir el enlace seguro</p>
                                    <input type="email" placeholder="Correo electrónico" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={resetEmail} onChange={e => setResetEmail(e.target.value)} />
                                    <button type="submit" className={`mt-2 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Enviar enlace</button>
                                    <button type="button" onClick={() => setIsResettingPassword(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver atrás</button>
                                </form>
                            ) : (
                                <form onSubmit={handleLogin} className="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-5 relative z-10 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                                    <h2 className={`font-name text-4xl text-center mb-2 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>
                                        {loginTarget === 'soyin' ? 'Acceso Soyin' : 'Acceso Anthony'}
                                    </h2>
                                    <input type="email" placeholder="Correo" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={email} onChange={e => setEmail(e.target.value)} />
                                    <div className="flex flex-col">
                                        <div className="relative">
                                            <input type={showPass ? "text" : "password"} required placeholder="Contraseña" className={`w-full p-3 bg-black/50 border border-white/10 rounded-lg outline-none pr-10 ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={password} onChange={e => setPassword(e.target.value)} />
                                            <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute right-3 top-3.5 text-gray-400 hover:text-white transition-colors">
                                                {showPass ? <EyeOffIcon size={18}/> : <EyeIcon size={18}/>}
                                            </button>
                                        </div>
                                        <button type="button" onClick={() => {setIsResettingPassword(true); setResetEmail(email);}} className="text-[10px] text-gray-400 hover:text-white uppercase tracking-widest transition-colors text-right mt-2">¿Olvidaste tu contraseña?</button>
                                    </div>
                                    <button type="submit" className={`mt-2 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Entrar</button>
                                    <button type="button" onClick={() => setShowLogin(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver al rincón</button>
                                </form>
                            )}
                        </div>
                    );
                }

                // PANEL ANTHONY MÁSTER
                if (isAnthony) {
                    return (
                        <div className="min-h-screen p-4 md:p-8 font-body bg-[#020205] relative z-50">
                            <div className="max-w-5xl mx-auto glass-panel p-6 md:p-8 rounded-3xl animate-in">
                                <div className="flex flex-wrap justify-between items-center mb-8 gap-4 border-b border-white/10 pb-6">
                                    <h2 className="font-name text-4xl text-rose-300">Panel Máster</h2>
                                    <div className="flex flex-wrap gap-4 items-center bg-black/20 p-2 px-4 rounded-2xl border border-white/5">
                                        <form onSubmit={(e) => cambiarPassword(e, nuevaPassAnthony, confPassAnthony, setNuevaPassAnthony, setConfPassAnthony)} className="flex items-center gap-2 mr-2 border-r border-white/10 pr-4">
                                            <div className="relative">
                                                <input type={showPassAnth ? "text" : "password"} placeholder="Nueva Contraseña" required className="p-2 pr-8 bg-black/40 border border-white/10 rounded text-[10px] outline-none focus:border-rose-500" value={nuevaPassAnthony} onChange={e=>setNuevaPassAnthony(e.target.value)} />
                                                <button type="button" onClick={()=>setShowPassAnth(!showPassAnth)} className="absolute right-2 top-2 text-gray-500 hover:text-white"><EyeIcon size={12}/></button>
                                            </div>
                                            <input type={showPassAnth ? "text" : "password"} placeholder="Confirmar..." required className="p-2 bg-black/40 border border-white/10 rounded text-[10px] outline-none focus:border-rose-500" value={confPassAnthony} onChange={e=>setConfPassAnthony(e.target.value)} />
                                            <button type="submit" className="text-[9px] bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded uppercase tracking-widest font-bold shadow-lg">Actualizar</button>
                                        </form>
                                        <button onClick={() => setShowLogin(false)} className="text-[10px] text-rose-300 border border-rose-500/30 px-4 py-2 rounded-full hover:bg-white/5 uppercase tracking-widest transition-colors">Cerrar Panel</button>
                                        <button onClick={cerrarSesion} className="text-[10px] text-gray-400 border border-white/10 hover:text-white px-4 py-2 rounded-full uppercase tracking-widest transition-colors">Salir de Sesión</button>
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <form onSubmit={guardarBienvenidaAnthony} className="bg-black/20 p-5 rounded-2xl border border-white/5 flex flex-col gap-3 shadow-lg">
                                            <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-[0.2em]">Tu carta en la Entrada principal</h3>
                                            <textarea className="p-3 bg-black/30 border border-white/10 rounded-xl text-sm outline-none focus:border-rose-500" value={formBienvenidaAnthony} onChange={e=>setFormBienvenidaAnthony(e.target.value)} rows="3"></textarea>
                                            <button type="submit" className="bg-rose-900/50 hover:bg-rose-800 text-rose-200 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors">Actualizar Carta</button>
                                        </form>

                                        <form onSubmit={publicarMensajeAnthony} className="bg-black/20 p-6 rounded-2xl border border-white/5 flex flex-col gap-4 shadow-lg">
                                            <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center justify-between">
                                                <span>Agregar Pensamiento o Diario</span>
                                                <span className="text-[8px] text-gray-500 lowercase normal-case">(Déjalo en blanco para usar la hora exacta actual)</span>
                                            </h3>
                                            <select className="p-3 bg-black/30 border border-white/10 rounded-xl text-rose-300 outline-none text-sm focus:border-rose-500 cursor-pointer" value={tipoMensaje} onChange={e=>setTipoMensaje(e.target.value)}>
                                                <option value="latidos">Latido (Mensaje Corto)</option>
                                                <option value="diario">Entrada del Diario (Historia Larga)</option>
                                            </select>
                                            <textarea required placeholder="Escribe aquí tu pensamiento..." className="p-4 bg-black/30 border border-white/10 rounded-xl h-24 outline-none focus:border-rose-500 text-sm" value={nuevoTexto} onChange={e => setNuevoTexto(e.target.value)}></textarea>
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="date" className="p-3 bg-black/30 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-rose-500" value={nuevaFecha} onChange={e => setNuevaFecha(e.target.value)} />
                                                <input type="time" className="p-3 bg-black/30 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-rose-500" value={nuevaHora} onChange={e => setNuevaHora(e.target.value)} />
                                            </div>
                                            <button type="submit" className="bg-rose-600 hover:bg-rose-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(225,29,72,0.3)] mt-2">Publicar Mágicamente</button>
                                        </form>

                                        <form onSubmit={async (e) => { e.preventDefault(); await db.collection("configuracion").doc("general").set({musicUrl: nuevaMusica, fechaInicioRelacion: nuevaFechaRelacion}, {merge:true}); alert("Ajustes guardados"); }} className="bg-black/20 p-5 rounded-2xl border border-white/5 flex flex-col gap-3 shadow-lg">
                                            <h3 className="text-blue-400 font-bold text-[10px] uppercase tracking-[0.2em]">Ajustes de Sistema</h3>
                                            <label className="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Enlace de Música:</label>
                                            <input required type="url" placeholder="Link de Dropbox" className="p-2 px-3 bg-black/30 border border-white/10 rounded-lg outline-none text-xs focus:border-blue-500" value={nuevaMusica} onChange={e => setNuevaMusica(e.target.value)} />
                                            <label className="text-[10px] text-gray-400 uppercase tracking-widest mt-2">Fecha Inicio Relación (Para la Luna):</label>
                                            <input required type="date" className="p-2 px-3 bg-black/30 border border-white/10 rounded-lg outline-none text-xs [color-scheme:dark] focus:border-blue-500" value={nuevaFechaRelacion} onChange={e => setNuevaFechaRelacion(e.target.value)} />
                                            <button type="submit" className="bg-blue-600/50 hover:bg-blue-700 text-white p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors mt-2">Guardar Ajustes</button>
                                        </form>
                                    </div>

                                    <div className="bg-black/20 p-6 rounded-2xl border border-white/5 h-[800px] overflow-y-auto shadow-lg">
                                        <h3 className="text-rose-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><ListIcon size={16}/> Tu Historial Total</h3>
                                        
                                        <p className="text-gray-400 text-[10px] uppercase tracking-widest mb-3 border-b border-white/10 pb-2 mt-4 text-center">Tus Entradas en el Diario</p>
                                        {diario.filter(d => d.autor !== 'soyin').map(d => (
                                            <div key={d.id} className="p-4 bg-white/5 mb-3 rounded-xl border border-white/10 flex justify-between items-center group hover:bg-white/10 transition-colors">
                                                <div className="truncate w-3/4 text-sm text-rose-100">{d.texto}</div>
                                                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                    <button onClick={()=>editarDocumento('diario', d.id, d.texto)} className="text-blue-400 hover:text-blue-300 p-1"><EditIcon size={16}/></button>
                                                    <button onClick={()=>eliminarDocumento('diario', d.id)} className="text-red-500 hover:text-red-400 p-1"><TrashIcon size={16}/></button>
                                                </div>
                                            </div>
                                        ))}

                                        <p className="text-gray-400 text-[10px] uppercase tracking-widest mt-8 mb-3 border-b border-white/10 pb-2 text-center">Todos Tus Latidos Cortos</p>
                                        {latidos.map(l => (
                                            <div key={l.id} className="p-4 bg-white/5 mb-3 rounded-xl border border-white/10 flex flex-col group hover:bg-white/10 transition-colors">
                                                <div className="flex justify-between items-center w-full">
                                                    <div className="truncate w-3/4 text-sm text-rose-100">{l.texto}</div>
                                                    <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                        <button onClick={()=>editarDocumento('latidos', l.id, l.texto)} className="text-blue-400 hover:text-blue-300 p-1"><EditIcon size={16}/></button>
                                                        <button onClick={()=>eliminarDocumento('latidos', l.id)} className="text-red-500 hover:text-red-400 p-1"><TrashIcon size={16}/></button>
                                                    </div>
                                                </div>
                                                <span className="text-[9px] text-gray-500 mt-2 tracking-widest uppercase">{formatearFechaHora(l.fecha, l.hora)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                // PANEL DE SOYIN
                if (isSoyin) {
                    return (
                        <div className="min-h-screen p-4 md:p-8 font-body bg-[#020205] relative z-50">
                            <div className="max-w-5xl mx-auto glass-panel p-6 md:p-10 rounded-3xl animate-in relative border border-purple-500/30">
                                <div className="flex flex-wrap justify-between items-center mb-8 gap-4 border-b border-purple-500/20 pb-6">
                                    <div>
                                        <h2 className="font-name text-4xl text-purple-300">Hola, mi amor</h2>
                                        <p className="text-purple-200/60 text-[10px] tracking-widest uppercase mt-1">Tu espacio para dejar huella en nuestro mundo</p>
                                    </div>
                                    <div className="flex flex-wrap gap-4 items-center bg-purple-900/10 p-2 px-4 rounded-2xl border border-purple-500/20">
                                        <form onSubmit={(e) => cambiarPassword(e, nuevaPassSoyin, confPassSoyin, setNuevaPassSoyin, setConfPassSoyin)} className="flex items-center gap-2 mr-2 border-r border-purple-500/20 pr-4">
                                            <div className="relative">
                                                <input type={showPassSoyin ? "text" : "password"} placeholder="Nueva Contraseña" required className="p-2 pr-8 bg-black/40 border border-purple-500/30 rounded text-[10px] outline-none focus:border-purple-400 text-purple-100" value={nuevaPassSoyin} onChange={e=>setNuevaPassSoyin(e.target.value)} />
                                                <button type="button" onClick={()=>setShowPassSoyin(!showPassSoyin)} className="absolute right-2 top-2 text-purple-400/50 hover:text-purple-300"><EyeIcon size={12}/></button>
                                            </div>
                                            <input type={showPassSoyin ? "text" : "password"} placeholder="Confirmar..." required className="p-2 bg-black/40 border border-purple-500/30 rounded text-[10px] outline-none focus:border-purple-400 text-purple-100" value={confPassSoyin} onChange={e=>setConfPassSoyin(e.target.value)} />
                                            <button type="submit" className="text-[9px] bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded uppercase tracking-widest font-bold shadow-lg shadow-purple-500/20">Actualizar</button>
                                        </form>
                                        <button onClick={() => setShowLogin(false)} className="text-[10px] text-purple-300 border border-purple-500/30 px-4 py-2 rounded-full hover:bg-purple-900/30 uppercase tracking-widest transition-colors">Cerrar Panel</button>
                                        <button onClick={cerrarSesion} className="text-[10px] text-gray-400 border border-white/10 hover:text-white px-4 py-2 rounded-full uppercase tracking-widest transition-colors">Cerrar Sesión</button>
                                    </div>
                                </div>
                                
                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        <form onSubmit={guardarBienvenidaSoyin} className="bg-purple-900/10 p-5 rounded-2xl border border-purple-500/20 flex flex-col gap-3 shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                            <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em]">Tus palabras en la Entrada principal</h3>
                                            <textarea className="p-3 bg-black/40 border border-purple-500/30 rounded-xl text-sm outline-none text-purple-100 focus:border-purple-400" value={formBienvenidaSoyin} onChange={e=>setFormBienvenidaSoyin(e.target.value)} rows="3"></textarea>
                                            <button type="submit" className="bg-purple-900/50 hover:bg-purple-800 text-purple-200 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors">Actualizar Carta</button>
                                        </form>

                                        <form onSubmit={publicarDiarioSoyin} className="bg-purple-900/10 p-6 rounded-2xl border border-purple-500/20 flex flex-col gap-4 shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                            <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em] flex justify-between">
                                                <span>Escribir en nuestro Diario</span>
                                                <span className="text-[8px] text-gray-500 normal-case">(Vacío = Exactamente ahora)</span>
                                            </h3>
                                            <textarea required placeholder="Cuenta una historia, un recuerdo, lo que sientes..." className="p-4 bg-black/40 border border-purple-500/30 rounded-xl h-20 outline-none focus:border-purple-400 text-purple-50 text-sm" value={nuevoDiarioSoyin} onChange={e => setNuevoDiarioSoyin(e.target.value)}></textarea>
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="date" className="p-3 bg-black/40 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm text-purple-100 focus:border-purple-400" value={fechaDiarioSoyin} onChange={e => setFechaDiarioSoyin(e.target.value)} />
                                                <input type="time" className="p-3 bg-black/40 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm text-purple-100 focus:border-purple-400" value={horaDiarioSoyin} onChange={e => setHoraDiarioSoyin(e.target.value)} />
                                            </div>
                                            <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold shadow-[0_0_15px_rgba(147,51,234,0.3)] transition-colors mt-2">Guardar Mágicamente</button>
                                        </form>

                                        <form onSubmit={publicarMensajeCortoSoyin} className="flex flex-col gap-4 mt-8">
                                            <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em] flex justify-between items-center">
                                                <span className="flex items-center gap-2"><SparklesIcon size={14}/> Un latido corto para él</span>
                                                <span className="text-[8px] text-gray-500 normal-case">(Vacío = Exactamente ahora)</span>
                                            </h3>
                                            <textarea required placeholder="De ti, para él..." className="p-4 bg-purple-900/20 border border-purple-500/40 rounded-xl h-24 outline-none focus:border-purple-400 text-purple-50 text-sm shadow-[inset_0_0_20px_rgba(147,51,234,0.1)]" value={nuevoTextoSoyin} onChange={e => setNuevoTextoSoyin(e.target.value)}></textarea>
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="date" className="p-3 bg-black/40 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm text-purple-100 focus:border-purple-400" value={fechaMensajeSoyin} onChange={e => setFechaMensajeSoyin(e.target.value)} />
                                                <input type="time" className="p-3 bg-black/40 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm text-purple-100 focus:border-purple-400" value={horaMensajeSoyin} onChange={e => setHoraMensajeSoyin(e.target.value)} />
                                            </div>
                                            <button type="submit" className="bg-fuchsia-600 hover:bg-fuchsia-700 text-white p-3 rounded-xl text-xs uppercase tracking-[0.2em] font-bold shadow-[0_0_20px_rgba(192,38,211,0.5)] transition-colors transform hover:scale-[1.02]">Dejar Latido</button>
                                        </form>
                                    </div>

                                    <div className="bg-purple-900/5 p-6 rounded-2xl border border-purple-500/20 h-[800px] overflow-y-auto shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                        <h3 className="text-purple-300 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><ListIcon size={16}/> Tu Historial Total</h3>
                                        
                                        <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-4 text-center border-b border-purple-500/20 pb-2">En el Diario Compartido:</p>
                                        {diario.filter(d => d.autor === 'soyin').map(d => (
                                            <div key={d.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex justify-between items-center group hover:bg-purple-900/40 transition-colors">
                                                <div className="truncate w-3/4 text-sm text-purple-100">{d.texto}</div>
                                                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                    <button onClick={()=>editarDocumento('diario', d.id, d.texto)} className="text-blue-400 hover:text-blue-300 p-1"><EditIcon size={16}/></button>
                                                    <button onClick={()=>eliminarDocumento('diario', d.id)} className="text-red-400 hover:text-red-300 p-1"><TrashIcon size={16}/></button>
                                                </div>
                                            </div>
                                        ))}

                                        <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-8 text-center border-b border-purple-500/20 pb-2">Tus Latidos Cortos:</p>
                                        {mensajesSoyin.map(msg => (
                                            <div key={msg.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex flex-col group hover:bg-purple-900/40 transition-colors">
                                                <div className="flex justify-between items-center w-full">
                                                    <div className="truncate w-3/4 text-sm text-purple-100">{msg.texto}</div>
                                                    <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                        <button onClick={()=>editarDocumento('mensajes_soyin', msg.id, msg.texto)} className="text-blue-400 hover:text-blue-300 p-1"><EditIcon size={16}/></button>
                                                        <button onClick={()=>eliminarDocumento('mensajes_soyin', msg.id)} className="text-red-400 hover:text-red-300 p-1"><TrashIcon size={16}/></button>
                                                    </div>
                                                </div>
                                                <span className="text-[8px] text-purple-300/50 mt-2 tracking-widest uppercase">{formatearFechaHora(msg.fecha, msg.hora)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
