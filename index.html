<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Soyin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap');
        
        body { margin: 0; background-color: #020205; color: white; }
        
        .font-name { font-family: 'Dancing Script', cursive; }
        .font-timer { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        @keyframes heartbeat-large {
          0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          15% { transform: scale(1.25); filter: drop-shadow(0 0 30px rgba(225, 29, 72, 0.8)); }
          30% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          45% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(225, 29, 72, 0.6)); }
          100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
        }
        .heart-beat { animation: heartbeat-large 1.5s infinite ease-in-out; }

        @keyframes float-up {
          0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
          100% { transform: translateY(-100px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .animate-float-up { animation: float-up 1s ease-out forwards; }

        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }
        .animate-twinkle { animation: twinkle infinite ease-in-out; }

        @keyframes pulse-slow {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 4s infinite ease-in-out; }

        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(244,63,94,0.3), 0 0 40px rgba(244,63,94,0.1); }
            50% { text-shadow: 0 0 30px rgba(244,63,94,0.7), 0 0 60px rgba(244,63,94,0.3); }
        }
        .animate-text-glow { animation: text-glow 4s infinite ease-in-out; }
        
        @keyframes glow-infinity {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(225,29,72,0.6)) drop-shadow(0 0 15px rgba(168,85,247,0.6)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 15px rgba(225,29,72,1)) drop-shadow(0 0 30px rgba(168,85,247,1)); transform: scale(1.15); }
        }
        .animate-infinity { animation: glow-infinity 3s infinite ease-in-out; display: inline-block; }

        @keyframes alarm-shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        .animate-alarm { animation: alarm-shake 0.5s ease-in-out infinite; }

        .moon-glow { box-shadow: 0 0 60px rgba(255, 255, 255, 0.1), inset -10px -10px 20px rgba(0,0,0,0.5); }
        .event-glow { box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); border: 1px solid rgba(251, 191, 36, 0.4); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS ---
        const HeartIcon = ({ size=24, className="", fill="none", style={} }) => <svg width={size} height={size} className={className} fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={style}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const PlayIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>;
        const PauseIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>;
        const BookIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
        const ArrowLeftIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>;
        const TrashIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const EditIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        const ListIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
        const SparklesIcon = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const EyeIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
        const EyeOffIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>;
        const CalendarIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const BellIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
        const UserIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const MessageCircleIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>;
        const LockIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
        const ChevronLeftIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const ChevronRightIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const SendIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;

        // ==========================================
        // CONFIGURACIÓN FIREBASE
        // ==========================================
        const CORREO_ANTHONY = "anthonyfonjim@gmail.com"; 
        const CORREO_SOYIN = "florsoyincastillo@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyC1s7lLrsC_bRgnCKg2ckBvvykiMvMLC5Q",
            authDomain: "los-latidos-de-mi-corazon.firebaseapp.com",
            projectId: "los-latidos-de-mi-corazon",
            storageBucket: "los-latidos-de-mi-corazon.firebasestorage.app",
            messagingSenderId: "850451293804",
            appId: "1:850451293804:web:9c662b62ad10e68a241a49"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==========================================
        // NUEVOS COMPONENTES: REACCIONES Y NOTAS
        // ==========================================
        const IndicadorNuevaNota = ({ ultimaNota }) => {
            if (!ultimaNota) return null;
            return (
                <span className="ml-2 flex items-center gap-1 text-[8px] font-bold text-white bg-white/20 px-2 py-[2px] rounded-full drop-shadow-[0_0_5px_rgba(255,255,255,0.5)] animate-pulse-slow border border-white/20">
                    ✨ De {ultimaNota.autor}
                </span>
            );
        };

        const VistaPreviaNotas = ({ item, colorTheme = 'rose' }) => {
            if (!item.notasCount || item.notasCount === 0) return null;
            const bgHover = colorTheme === 'purple' ? 'hover:bg-purple-900/40 border-purple-500/20' : 'hover:bg-rose-900/40 border-rose-500/20';
            const textAccent = colorTheme === 'purple' ? 'text-purple-300' : 'text-rose-300';
            
            return (
                <div className={`mt-3 w-full bg-black/40 border rounded-xl p-3 cursor-pointer transition-colors ${bgHover}`}>
                    <div className="flex justify-between items-center mb-1">
                        <span className={`text-[9px] uppercase tracking-widest font-bold ${textAccent}`}>{item.notasCount} {item.notasCount === 1 ? 'Nota' : 'Notas'}</span>
                        <span className="text-[8px] text-gray-500 uppercase">{new Date(item.ultimaNota?.timestamp).toLocaleDateString('es-ES')}</span>
                    </div>
                    {item.ultimaNotaTexto && (
                        <p className="text-xs text-white/70 italic truncate">"{item.ultimaNotaTexto}"</p>
                    )}
                </div>
            );
        };

        const SelectorReacciones = ({ coleccion, docId, reaccionesActuales = {}, currentUser, showAlert }) => {
            const emojis = ['❤️', '🥺', '😢', '💔'];
            const miReaccion = currentUser ? reaccionesActuales[currentUser] : null;

            if(!currentUser) return null; // Oculta las reacciones flotantes si no está logueado

            const manejarReaccion = async (emoji) => {
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para reaccionar.");
                const docRef = db.collection(coleccion).doc(docId);
                const nuevaReaccion = miReaccion === emoji ? firebase.firestore.FieldValue.delete() : emoji;
                await docRef.set({ reacciones: { [currentUser]: nuevaReaccion } }, { merge: true });
            };

            return (
                <div className="absolute right-4 bottom-14 flex flex-row gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all duration-300 z-30 translate-y-2 group-hover:translate-y-0">
                    <div className="bg-black/80 backdrop-blur-md border border-white/10 py-1.5 px-3 rounded-full flex flex-row gap-2 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
                        {emojis.map(emoji => (
                            <button 
                                key={emoji} 
                                onClick={(e) => { e.stopPropagation(); manejarReaccion(emoji); }} 
                                className={`text-base md:text-lg transition-all duration-200 ${miReaccion === emoji ? 'scale-125 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]' : 'opacity-60 hover:opacity-100 hover:scale-110'}`}
                            >
                                {emoji}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const ModalNotas = ({ coleccion, docId, onClose, currentUser, showAlert, showConfirm }) => {
            const [notas, setNotas] = useState([]);
            const [nuevaNota, setNuevaNota] = useState('');
            const [notaRespondiendo, setNotaRespondiendo] = useState(null);
            const [textoRespuesta, setTextoRespuesta] = useState('');
            
            const [editNotaId, setEditNotaId] = useState(null);
            const [textoEditNota, setTextoEditNota] = useState('');
            const [editResp, setEditResp] = useState(null);

            const notesEndRef = useRef(null);

            useEffect(() => {
                const unsubscribe = db.collection(coleccion).doc(docId).collection('notas')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot(snap => setNotas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubscribe();
            }, [coleccion, docId]);

            useEffect(() => {
                notesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [notas]);

            const actualizarMetaNota = async (autor, texto) => {
                try {
                    await db.collection(coleccion).doc(docId).set({
                        ultimaNota: { autor, timestamp: new Date().toISOString() },
                        ultimaNotaTexto: texto,
                        notasCount: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true });
                } catch(e) { console.error(e); }
            };

            const enviarNota = async (e) => {
                e.preventDefault();
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para dejar una nota.");
                if (!nuevaNota.trim()) return;
                
                const textoGuardado = nuevaNota;
                setNuevaNota(''); // Limpiar UI instantáneo
                
                await db.collection(coleccion).doc(docId).collection('notas').add({
                    texto: textoGuardado, autor: currentUser,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(), respuestas: []
                });
                await actualizarMetaNota(currentUser, textoGuardado);
            };
            
            const enviarRespuesta = async (notaId) => {
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para responder.");
                if (!textoRespuesta.trim()) return;
                
                const textoGuardado = textoRespuesta;
                setNotaRespondiendo(null); 
                setTextoRespuesta('');
                
                try {
                    const notaRef = db.collection(coleccion).doc(docId).collection('notas').doc(notaId);
                    await notaRef.update({
                        respuestas: firebase.firestore.FieldValue.arrayUnion({
                            texto: textoGuardado, autor: currentUser,
                            timestamp: new Date().toISOString()
                        })
                    });
                    await actualizarMetaNota(currentUser, textoGuardado);
                } catch (e) {
                    console.error(e);
                    showAlert("Error", "No se pudo guardar la respuesta.");
                }
            };

            const borrarNota = (notaId) => {
                if(showConfirm) {
                    showConfirm("Borrar Nota", "¿Seguro que quieres borrar esta nota?", async () => {
                        await db.collection(coleccion).doc(docId).collection('notas').doc(notaId).delete();
                        
                        // Verificamos si quedaron notas después de borrar esta
                        const restantesSnap = await db.collection(coleccion).doc(docId).collection('notas').limit(1).get();
                        
                        if (restantesSnap.empty) {
                            // Si ya no quedan notas, limpiamos por completo el indicador "De [Autor]"
                            await db.collection(coleccion).doc(docId).update({ 
                                notasCount: 0,
                                ultimaNota: firebase.firestore.FieldValue.delete(),
                                ultimaNotaTexto: firebase.firestore.FieldValue.delete()
                            });
                        } else {
                            // Si aún quedan notas, solo restamos el contador
                            await db.collection(coleccion).doc(docId).update({ 
                                notasCount: firebase.firestore.FieldValue.increment(-1) 
                            });
                        }
                    });
                }
            };

            const guardarEdicionNota = async (notaId) => {
                if (!textoEditNota.trim()) return;
                await db.collection(coleccion).doc(docId).collection('notas').doc(notaId).update({ texto: textoEditNota });
                setEditNotaId(null);
            };

            const borrarResp = (nota, respToRemove) => {
                if(showConfirm) {
                    showConfirm("Borrar Respuesta", "¿Seguro que quieres borrar esta respuesta?", async () => {
                        await db.collection(coleccion).doc(docId).collection('notas').doc(nota.id).update({
                            respuestas: firebase.firestore.FieldValue.arrayRemove(respToRemove)
                        });
                        
                        // Al borrar una respuesta, regresamos el indicador al autor de la nota principal
                        await db.collection(coleccion).doc(docId).update({
                            ultimaNota: { autor: nota.autor, timestamp: nota.timestamp || new Date().toISOString() },
                            ultimaNotaTexto: nota.texto
                        });
                    });
                }
            };

            const guardarEdicionResp = async (nota) => {
                if (!editResp.texto.trim()) return;
                const nuevasRespuestas = [...nota.respuestas];
                nuevasRespuestas[editResp.index].texto = editResp.texto;
                await db.collection(coleccion).doc(docId).collection('notas').doc(nota.id).update({ respuestas: nuevasRespuestas });
                setEditResp(null);
            };

            return (
                <div className="fixed inset-0 bg-black/80 z-[150] flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-md animate-in" onClick={onClose}>
                    <div className="glass-panel w-full max-w-lg h-[85vh] md:h-[600px] rounded-t-3xl md:rounded-3xl flex flex-col shadow-[0_0_50px_rgba(255,255,255,0.05)] border-white/10" onClick={e => e.stopPropagation()}>
                        <div className="p-5 border-b border-white/10 flex justify-between items-center bg-black/20 rounded-t-3xl">
                            <h3 className="font-name text-2xl text-white flex items-center gap-2"><MessageCircleIcon size={20}/> Notas Compartidas</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white transition-colors">✕</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-6 hide-scrollbar">
                            {notas.length === 0 && <p className="text-center text-white/30 italic text-sm mt-10">Aún no hay notas aquí...</p>}
                            {notas.map(nota => (
                                <div key={nota.id} className="space-y-3">
                                    {nota.id === editNotaId ? (
                                        <div className="bg-white/5 p-4 rounded-2xl border border-white/10 mb-2">
                                            <input autoFocus type="text" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-xs text-white outline-none focus:border-rose-500 mb-2" value={textoEditNota} onChange={e => setTextoEditNota(e.target.value)} onKeyDown={e => e.key === 'Enter' && guardarEdicionNota(nota.id)} />
                                            <div className="flex gap-2">
                                                <button onClick={() => guardarEdicionNota(nota.id)} className="text-[9px] bg-rose-600 px-3 py-1 rounded text-white font-bold uppercase tracking-widest">Guardar</button>
                                                <button onClick={() => setEditNotaId(null)} className="text-[9px] text-gray-400 px-3 py-1 uppercase tracking-widest border border-white/10 rounded">Cancelar</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-white/5 p-4 rounded-2xl rounded-tl-none border border-white/5 relative group">
                                            <div className="flex justify-between items-start mb-1">
                                                <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">{nota.autor}</p>
                                                {nota.autor === currentUser && (
                                                    <div className="flex gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">

        // ==========================================

        const MiniCalendarioVisual = ({ eventos = [], selectedDate, onSelectDate, theme = 'yellow' }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month); 
            
            const adjustFirstDay = firstDay === 0 ? 6 : firstDay - 1; 
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

            const handleDayClick = (day) => {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                if(selectedDate === dateStr) onSelectDate(""); 
                else onSelectDate(dateStr);
            };

            const eventosDelMes = {};
            eventos.forEach(ev => {
                if(!ev.fecha) return;
                const [y, m, d] = ev.fecha.split('-');
                if (parseInt(y) === year && parseInt(m) === month + 1) {
                    const dayInt = parseInt(d);
                    if (!eventosDelMes[dayInt]) eventosDelMes[dayInt] = [];
                    eventosDelMes[dayInt].push(ev);
                }
            });

            const bgColor = theme === 'yellow' ? 'bg-yellow-500' : (theme === 'purple' ? 'bg-purple-500' : 'bg-rose-500');
            const textColor = theme === 'yellow' ? 'text-yellow-400' : (theme === 'purple' ? 'text-purple-400' : 'text-rose-400');
            const borderColor = theme === 'yellow' ? 'border-yellow-500/30' : (theme === 'purple' ? 'border-purple-500/30' : 'border-rose-500/30');

            return (
                <div className={`bg-black/40 border ${borderColor} rounded-3xl p-5 mb-8 shadow-lg`}>
                    <div className="flex justify-between items-center mb-4">
                        <button type="button" onClick={handlePrevMonth} className="text-gray-400 hover:text-white p-2 bg-white/5 rounded-full"><ChevronLeftIcon size={16}/></button>
                        <h3 className={`font-name text-2xl ${textColor}`}>{monthNames[month]} {year}</h3>

                            const day = i + 1;
                            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                            const hasEvents = eventosDelMes[day]?.length > 0;
                            const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;
                            const isSelected = selectedDate === dateStr;
                            
                            return (

                const rect = e.currentTarget.getBoundingClientRect();

                const y = e.clientY - rect.top;
                const id = Date.now();
                setParticulas(prev => [...prev, {id, x, y}]);
                setTimeout(() => setParticulas(prev => prev.filter(p => p.id !== id)), 1000);

        const calcularEdad = (fechaNacimiento) => {
            const hoy = new Date();
            const cumple = new Date(fechaNacimiento);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            const m = hoy.getMonth() - cumple.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < cumple.getDate())) {
                edad--;
            }
            return edad;
        };

        // Lógica de Ocultamiento de Cápsulas de Tiempo (ESTRICTO A LA HORA LOCAL)
        const esVisibleAlPublico = (item) => {
            if (!item.esCapsula) return true;
            if (!item.fecha) return true;
            try {
                const now = new Date();
                const [y, m, d] = item.fecha.split('-').map(Number);
                const hourStr = item.hora || item.horaInicio || '00:00';
                const [hr, min] = hourStr.split(':').map(Number);
                const itemDate = new Date(y, m - 1, d, hr, min, 0);
                return now.getTime() >= itemDate.getTime();
            } catch(e) { return true; }

                return `${year}-${month}-${day}`;

            const obtenerHoraExacta = () => new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
            const formatearFechaHora = (fecha, hora) => {
                if(!fecha) return "Fecha no registrada";
                try {
                    const d = new Date(`${fecha}T00:00:00`);
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return `${d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} a las ${hora || '12:00'}`;
                } catch(e) { return "Fecha inválida"; }
            };
            const formatearFechaSimple = (fechaString) => {
                if(!fechaString) return "Fecha no registrada";
                try {
                    const d = new Date(fechaString + "T00:00:00");
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                } catch(e) { return "Fecha inválida"; }
            };
            const formatearFechaHoraBaseDatos = (ts) => {
                if(!ts) return "Publicado hoy";
                try {
                    const d = ts.toDate ? ts.toDate() : new Date(ts);
                    if(isNaN(d.getTime())) return "Publicado hoy";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                } catch(e) { return "Publicado hoy"; }
            };
            const ordenarCronologicamente = (arr, ascendente = false) => {
                return [...arr].sort((a, b) => {
                    const dateA = new Date(`${a.fecha}T${a.hora || '00:00'}`).getTime();
                    const dateB = new Date(`${b.fecha}T${b.hora || '00:00'}`).getTime();
                    if (isNaN(dateA) || isNaN(dateB)) return 0;
                    return ascendente ? dateA - dateB : dateB - dateA;
                });
            };
            const getNextBirthday = (month, day) => {
                const currentYear = new Date().getFullYear();
                let bday = new Date(currentYear, month - 1, day);
                const today = new Date();
                today.setHours(0,0,0,0);
                if (bday < today) bday.setFullYear(currentYear + 1);
                return `${bday.getFullYear()}-${String(bday.getMonth()+1).padStart(2,'0')}-${String(bday.getDate()).padStart(2,'0')}`;

            // Cronómetro Relación y Eventos Próximos
