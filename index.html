<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Soyin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');
        
        :root {
            --color-bg: #030108;
            --color-rose-glow: rgba(225, 29, 72, 0.5);
            --color-purple-glow: rgba(168, 85, 247, 0.5);
        }

        body { 
            margin: 0; 
            background-color: var(--color-bg); 
            color: white; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(225, 29, 72, 0.05), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 50%);
            background-attachment: fixed;
        }
        
        .font-name { font-family: 'Dancing Script', cursive; }
        .font-timer { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        @keyframes heartbeat-large {
          0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(225, 29, 72, 0.6)); }
          15% { transform: scale(1.15); filter: drop-shadow(0 0 40px rgba(225, 29, 72, 0.9)); }
          30% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(225, 29, 72, 0.6)); }
          45% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(225, 29, 72, 0.8)); }
          100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(225, 29, 72, 0.6)); }
        }
        .heart-beat { animation: heartbeat-large 1.8s infinite ease-in-out; }

        @keyframes energy-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: blur(2px); }
            50% { transform: scale(1.05); opacity: 1; filter: blur(4px); }
        }
        .animate-energy { animation: energy-pulse 3s infinite alternate ease-in-out; }

        @keyframes float-up {
          0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
          100% { transform: translateY(-120px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .animate-float-up { animation: float-up 1.2s ease-out forwards; }

        @keyframes twinkle {
          0%, 100% { opacity: 0.1; transform: scale(0.7); }
          50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px white; }
        }
        .animate-twinkle { animation: twinkle infinite ease-in-out; }

        @keyframes pulse-slow {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.03); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 5s infinite ease-in-out; }

        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(244,63,94,0.4), 0 0 40px rgba(244,63,94,0.2); }
            50% { text-shadow: 0 0 30px rgba(244,63,94,0.8), 0 0 60px rgba(244,63,94,0.4); }
        }
        .animate-text-glow { animation: text-glow 4s infinite ease-in-out; }
        
        @keyframes glow-infinity {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(225,29,72,0.8)) drop-shadow(0 0 20px rgba(168,85,247,0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px rgba(225,29,72,1)) drop-shadow(0 0 40px rgba(168,85,247,1)); transform: scale(1.1); }
        }
        .animate-infinity { animation: glow-infinity 3s infinite ease-in-out; display: inline-block; }

        @keyframes alarm-shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        .animate-alarm { animation: alarm-shake 0.5s ease-in-out infinite; }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-panel-heavy {
            background: rgba(10, 5, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .event-glow { box-shadow: 0 0 40px rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.3); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilos del Diario Mágico */
        .font-cormorant { font-family: 'Cormorant Garamond', serif; }
        .parchment-sheet {
            background-color: #fffefb;
            background-image: radial-gradient(#e5dfd5 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }
        .diary-lines {
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 31px, #f1e9e0 31px, #f1e9e0 32px);
            line-height: 32px;
        }
        .book-spine {
            background: linear-gradient(to right, rgba(0,0,0,0.25), transparent 20%, transparent 80%, rgba(0,0,0,0.25));
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }

        .time-stream-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, 
                rgba(225, 29, 72, 0.8), 
                rgba(168, 85, 247, 0.5), 
                rgba(225, 29, 72, 0.1),
                transparent);
            z-index: 0;
        }

        .time-node {
            position: relative;
            z-index: 1;
            background: rgba(15, 10, 25, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            margin: 0.5rem 0;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.02);
            transition: all 0.3s ease;
        }
        .time-node:hover {
            transform: scale(1.05);
            border-color: rgba(225, 29, 72, 0.4);
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.2), inset 0 0 10px rgba(255,255,255,0.05);
        }

        @keyframes pageTurnLeft {
            0% { transform: perspective(1200px) rotateY(0deg); opacity: 1; filter: blur(0px); }
            49% { transform: perspective(1200px) rotateY(-90deg); opacity: 0; filter: blur(5px); }
            50% { transform: perspective(1200px) rotateY(90deg); opacity: 0; filter: blur(5px); }
            100% { transform: perspective(1200px) rotateY(0deg); opacity: 1; filter: blur(0px); }
        }
        @keyframes pageTurnRight {
            0% { transform: perspective(1200px) rotateY(0deg); opacity: 1; filter: blur(0px); }
            49% { transform: perspective(1200px) rotateY(90deg); opacity: 0; filter: blur(5px); }
            50% { transform: perspective(1200px) rotateY(-90deg); opacity: 0; filter: blur(5px); }
            100% { transform: perspective(1200px) rotateY(0deg); opacity: 1; filter: blur(0px); }
        }
        .anim-page-left { animation: pageTurnLeft 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .anim-page-right { animation: pageTurnRight 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }

        /* NUEVAS ANIMACIONES DE PAGINA REALISTA */
        @keyframes pageFlipRightToLeft {
            0% { transform: perspective(2000px) rotateY(0deg); opacity: 1; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
            50% { filter: brightness(0.8); }
            100% { transform: perspective(2000px) rotateY(-180deg); opacity: 0; box-shadow: 5px 0 15px rgba(0,0,0,0.1); } 
        }
        @keyframes pageFlipLeftToRight {
            0% { transform: perspective(2000px) rotateY(0deg); opacity: 1; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
            50% { filter: brightness(0.8); }
            100% { transform: perspective(2000px) rotateY(180deg); opacity: 0; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        }
        .flip-forward {
            transform-origin: left center;
            animation: pageFlipRightToLeft 0.6s ease-in forwards;
            transform-style: preserve-3d;
        }
        .flip-backward {
            transform-origin: right center;
            animation: pageFlipLeftToRight 0.6s ease-in forwards;
            transform-style: preserve-3d;
        }

        /* ANIMACIÓN DE CARTA / SOBRE MÁGICO */
        .envelope-wrapper { perspective: 1000px; }
        .envelope-flap {
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .envelope-wrapper:hover .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }
        .letter-content {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .envelope-wrapper:hover .letter-content {
            transform: translateY(-40px);
        }
        .wax-seal {
            transition: opacity 0.3s ease, transform 0.4s ease;
        }
        .envelope-wrapper:hover .wax-seal {
            opacity: 0;
            transform: scale(0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HeartIcon = ({ size=24, className="", fill="none", style={} }) => <svg width={size} height={size} className={className} fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={style}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;

                    </defs>
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"

        const ArrowLeftIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>;

        const ListIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;

        const MusicIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>;
        const SkipForwardIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>;
        const SkipBackIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>;

        const CORREO_ANTHONY = "anthonyfonjim@gmail.com"; 
        const CORREO_SOYIN = "florsoyincastillo@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyC1s7lLrsC_bRgnCKg2ckBvvykiMvMLC5Q",
            authDomain: "los-latidos-de-mi-corazon.firebaseapp.com",
            projectId: "los-latidos-de-mi-corazon",
            storageBucket: "los-latidos-de-mi-corazon.firebasestorage.app",
            messagingSenderId: "850451293804",
            appId: "1:850451293804:web:9c662b62ad10e68a241a49"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const IndicadorNuevaNota = ({ ultimaNota }) => {
            if (!ultimaNota) return null;
            return (
                <span className="ml-2 flex items-center gap-1 text-[8px] font-bold text-white bg-white/20 px-2 py-[2px] rounded-full drop-shadow-[0_0_5px_rgba(255,255,255,0.5)] animate-pulse-slow border border-white/20">
                    ✨ De {ultimaNota.autor}
                </span>
            );
        };

        const VistaPreviaNotas = ({ item, colorTheme = 'rose' }) => {
            if (!item.notasCount || item.notasCount === 0) return null;
            const bgHover = colorTheme === 'purple' ? 'hover:bg-purple-900/40 border-purple-500/20' : 'hover:bg-rose-900/40 border-rose-500/20';
            const textAccent = colorTheme === 'purple' ? 'text-purple-300' : 'text-rose-300';
            
            return (
                <div className={`mt-3 w-full bg-black/40 border rounded-xl p-3 cursor-pointer transition-colors ${bgHover}`}>
                    <div className="flex justify-between items-center mb-1">
                        <span className={`text-[9px] uppercase tracking-widest font-bold ${textAccent}`}>{item.notasCount} {item.notasCount === 1 ? 'Nota' : 'Notas'}</span>
                        <span className="text-[8px] text-gray-500 uppercase">{new Date(item.ultimaNota?.timestamp).toLocaleDateString('es-ES')}</span>
                    </div>
                    {item.ultimaNotaTexto && (
                        <p className="text-xs text-white/70 italic truncate">"{item.ultimaNotaTexto}"</p>
                    )}
                </div>
            );
        };

        const SelectorReacciones = ({ coleccion, docId, reaccionesActuales = {}, currentUser, showAlert }) => {
            const emojis = ['❤️', '🥺', '😢', '💔', '✨'];
            const miReaccion = currentUser ? reaccionesActuales[currentUser] : null;

            if(!currentUser) return null;

            const manejarReaccion = async (emoji) => {
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para reaccionar.");
                const docRef = db.collection(coleccion).doc(docId);
                const nuevaReaccion = miReaccion === emoji ? firebase.firestore.FieldValue.delete() : emoji;
                await docRef.set({ reacciones: { [currentUser]: nuevaReaccion } }, { merge: true });
            };

            return (
                <div className="absolute right-4 bottom-4 flex flex-row gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all duration-300 z-30 translate-y-2 group-hover:translate-y-0">
                    <div className="glass-panel py-1.5 px-3 rounded-full flex flex-row gap-2 shadow-[0_10px_30px_rgba(0,0,0,0.5)] bg-black/60">
                        {emojis.map(emoji => (
                            <button 
                                key={emoji} 
                                onClick={(e) => { e.stopPropagation(); manejarReaccion(emoji); }} 
                                className={`text-base md:text-lg transition-all duration-200 ${miReaccion === emoji ? 'scale-125 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]' : 'opacity-60 hover:opacity-100 hover:scale-110'}`}
                            >
                                {emoji}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const ModalNotas = ({ coleccion, docId, onClose, currentUser, showAlert, showConfirm }) => {
            const [notas, setNotas] = useState([]);
            const [nuevaNota, setNuevaNota] = useState('');
            const [notaRespondiendo, setNotaRespondiendo] = useState(null);
            const [textoRespuesta, setTextoRespuesta] = useState('');
            
            const [editNotaId, setEditNotaId] = useState(null);
            const [textoEditNota, setTextoEditNota] = useState('');
            const [editResp, setEditResp] = useState(null);

            const notesEndRef = useRef(null);

            useEffect(() => {
                const unsubscribe = db.collection(coleccion).doc(docId).collection('notas')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot(snap => setNotas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubscribe();
            }, [coleccion, docId]);

            useEffect(() => {
                notesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [notas]);

            const actualizarMetaNota = async (autor, texto) => {
                try {
                    await db.collection(coleccion).doc(docId).set({
                        ultimaNota: { autor, timestamp: new Date().toISOString() },
                        ultimaNotaTexto: texto,
                        notasCount: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true });
                } catch(e) { console.error(e); }
            };

            const enviarNota = async (e) => {
                e.preventDefault();
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para dejar una nota.");
                if (!nuevaNota.trim()) return;
                
                const textoGuardado = nuevaNota;
                setNuevaNota(''); 
                
                await db.collection(coleccion).doc(docId).collection('notas').add({
                    texto: textoGuardado, autor: currentUser,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(), respuestas: []
                });
                await actualizarMetaNota(currentUser, textoGuardado);
            };
            
            const enviarRespuesta = async (notaId) => {
                if (!currentUser) return showAlert("Aviso", "Debes iniciar sesión para responder.");
                if (!textoRespuesta.trim()) return;
                
                const textoGuardado = textoRespuesta;
                setNotaRespondiendo(null); 
                setTextoRespuesta('');
                
                try {
                    const notaRef = db.collection(coleccion).doc(docId).collection('notas').doc(notaId);
                    await notaRef.update({
                        respuestas: firebase.firestore.FieldValue.arrayUnion({
                            texto: textoGuardado, autor: currentUser,
                            timestamp: new Date().toISOString()
                        })
                    });
                    await actualizarMetaNota(currentUser, textoGuardado);
                } catch (e) {
                    console.error(e);
                    showAlert("Error", "No se pudo guardar la respuesta.");
                }
            };

            const borrarNota = (notaId) => {
                if(showConfirm) {
                    showConfirm("Borrar Nota", "¿Seguro que quieres borrar esta nota?", async () => {
                        await db.collection(coleccion).doc(docId).collection('notas').doc(notaId).delete();
                        
                        const restantesSnap = await db.collection(coleccion).doc(docId).collection('notas').limit(1).get();
                        
                        if (restantesSnap.empty) {
                            await db.collection(coleccion).doc(docId).update({ 
                                notasCount: 0,
                                ultimaNota: firebase.firestore.FieldValue.delete(),
                                ultimaNotaTexto: firebase.firestore.FieldValue.delete()
                            });
                        } else {
                            await db.collection(coleccion).doc(docId).update({ 
                                notasCount: firebase.firestore.FieldValue.increment(-1) 
                            });
                        }
                    });
                }
            };

            const guardarEdicionNota = async (notaId) => {
                if (!textoEditNota.trim()) return;
                await db.collection(coleccion).doc(docId).collection('notas').doc(notaId).update({ texto: textoEditNota });
                setEditNotaId(null);
            };

            const borrarResp = (nota, respToRemove) => {
                if(showConfirm) {
                    showConfirm("Borrar Respuesta", "¿Seguro que quieres borrar esta respuesta?", async () => {
                        await db.collection(coleccion).doc(docId).collection('notas').doc(nota.id).update({
                            respuestas: firebase.firestore.FieldValue.arrayRemove(respToRemove)
                        });
                        
                        await db.collection(coleccion).doc(docId).update({
                            ultimaNota: { autor: nota.autor, timestamp: nota.timestamp || new Date().toISOString() },
                            ultimaNotaTexto: nota.texto
                        });
                    });
                }
            };

            const guardarEdicionResp = async (nota) => {
                if (!editResp.texto.trim()) return;
                const nuevasRespuestas = [...nota.respuestas];
                nuevasRespuestas[editResp.index].texto = editResp.texto;
                await db.collection(coleccion).doc(docId).collection('notas').doc(nota.id).update({ respuestas: nuevasRespuestas });
                setEditResp(null);
            };

            return (
                <div className="fixed inset-0 bg-black/80 z-[150] flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-md animate-in" onClick={onClose}>
                    <div className="glass-panel-heavy w-full max-w-lg h-[85vh] md:h-[600px] rounded-t-3xl md:rounded-3xl flex flex-col shadow-[0_0_50px_rgba(255,255,255,0.05)] border-white/10" onClick={e => e.stopPropagation()}>
                        <div className="p-5 border-b border-white/10 flex justify-between items-center bg-black/30 rounded-t-3xl">
                            <h3 className="font-name text-2xl text-white flex items-center gap-2"><MessageCircleIcon size={20}/> Notas Compartidas</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white transition-colors p-1 bg-white/5 rounded-full">✕</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-6 hide-scrollbar">
                            {notas.length === 0 && <p className="text-center text-white/30 italic text-sm mt-10">Aún no hay notas aquí...</p>}
                            {notas.map(nota => (
                                <div key={nota.id} className="space-y-3">
                                    {nota.id === editNotaId ? (
                                        <div className="bg-white/5 p-4 rounded-2xl border border-white/10 mb-2">
                                            <input autoFocus type="text" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-xs text-white outline-none focus:border-rose-500 mb-2" value={textoEditNota} onChange={e => setTextoEditNota(e.target.value)} onKeyDown={e => e.key === 'Enter' && guardarEdicionNota(nota.id)} />
                                            <div className="flex gap-2">
                                                <button onClick={() => guardarEdicionNota(nota.id)} className="text-[9px] bg-rose-600 px-3 py-1 rounded text-white font-bold uppercase tracking-widest">Guardar</button>
                                                <button onClick={() => setEditNotaId(null)} className="text-[9px] text-gray-400 px-3 py-1 uppercase tracking-widest border border-white/10 rounded">Cancelar</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-white/5 p-4 rounded-2xl rounded-tl-none border border-white/5 relative group">
                                            <div className="flex justify-between items-start mb-1">
                                                <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">{nota.autor}</p>
                                                {nota.autor === currentUser && (
                                                    <div className="flex gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => { setEditNotaId(nota.id); setTextoEditNota(nota.texto); }} className="text-blue-400 hover:text-blue-300"><EditIcon size={12}/></button>
                                                        <button onClick={() => borrarNota(nota.id)} className="text-red-400 hover:text-red-300"><TrashIcon size={12}/></button>
                                                    </div>
                                                )}
                                            </div>
                                            <p className="text-sm text-white/90 leading-relaxed">{nota.texto}</p>
                                            {currentUser && (
                                                <button onClick={() => setNotaRespondiendo(nota.id)} className="text-[9px] text-rose-300/70 mt-3 uppercase tracking-widest hover:text-rose-200 font-bold">Responder</button>
                                            )}
                                        </div>
                                    )}

                                    {nota.respuestas?.length > 0 && (
                                        <div className="pl-6 space-y-2 border-l border-white/10 ml-2">
                                            {nota.respuestas.map((resp, idx) => (
                                                editResp?.notaId === nota.id && editResp?.index === idx ? (
                                                    <div key={idx} className="bg-black/30 p-3 rounded-xl border border-white/10">
                                                        <input autoFocus type="text" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-xs text-white outline-none focus:border-rose-500 mb-2" value={editResp.texto} onChange={e => setEditResp({...editResp, texto: e.target.value})} onKeyDown={e => e.key === 'Enter' && guardarEdicionResp(nota)} />
                                                        <div className="flex gap-2">
                                                            <button onClick={() => guardarEdicionResp(nota)} className="text-[9px] bg-rose-600 px-3 py-1 rounded text-white font-bold uppercase tracking-widest">Guardar</button>
                                                            <button onClick={() => setEditResp(null)} className="text-[9px] text-gray-400 px-3 py-1 uppercase tracking-widest border border-white/10 rounded">Cancelar</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div key={idx} className="bg-black/30 p-3 rounded-xl rounded-tl-none border border-white/5 relative group">
                                                        <div className="absolute -left-[9px] top-4 w-4 border-t border-white/10"></div>
                                                        <div className="flex justify-between items-start mb-1">
                                                            <p className="text-[9px] text-gray-500 uppercase tracking-widest font-bold">{resp.autor}</p>
                                                            {resp.autor === currentUser && (
                                                                <div className="flex gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                                                    <button onClick={() => setEditResp({notaId: nota.id, index: idx, texto: resp.texto})} className="text-blue-400 hover:text-blue-300"><EditIcon size={12}/></button>
                                                                    <button onClick={() => borrarResp(nota, resp)} className="text-red-400 hover:text-red-300"><TrashIcon size={12}/></button>
                                                                </div>
                                                            )}
                                                        </div>
                                                        <p className="text-xs text-white/80">{resp.texto}</p>
                                                    </div>
                                                )
                                            ))}
                                        </div>
                                    )}

                                    {notaRespondiendo === nota.id && (
                                        <div className="pl-6 flex gap-2 animate-in mt-2 items-center">
                                            <div className="relative flex-1">
                                                <input autoFocus type="text" placeholder="Escribe tu respuesta..." className="w-full bg-black/50 border border-white/10 rounded-lg p-3 pr-10 text-xs text-white outline-none focus:border-rose-500" value={textoRespuesta} onChange={e => setTextoRespuesta(e.target.value)} onKeyDown={e => e.key === 'Enter' && enviarRespuesta(nota.id)} />
                                                <button type="button" onClick={() => enviarRespuesta(nota.id)} className="absolute right-2 top-2 text-rose-400 hover:text-rose-300 transition-colors p-1" disabled={!textoRespuesta.trim()} title="Enviar respuesta">
                                                    <SendIcon size={16} />
                                                </button>
                                            </div>
                                            <button onClick={() => setNotaRespondiendo(null)} className="text-gray-500 hover:text-white px-2" title="Cancelar">✕</button>
                                        </div>
                                    )}
                                </div>
                            ))}
                            <div ref={notesEndRef} />
                        </div>

                        <form onSubmit={enviarNota} className="p-4 border-t border-white/10 bg-black/40 rounded-b-3xl relative flex items-center">
                            <input type="text" placeholder={currentUser ? "Añade una nota..." : "Inicia sesión para comentar"} disabled={!currentUser} className="w-full bg-white/5 border border-white/10 rounded-xl p-4 pr-14 text-sm text-white outline-none focus:border-rose-500 transition-colors disabled:opacity-50" value={nuevaNota} onChange={e => setNuevaNota(e.target.value)} />
                            {currentUser && (
                                <button type="submit" className="absolute right-6 bg-rose-600/20 hover:bg-rose-600/40 border border-rose-500/30 text-rose-400 p-2 rounded-full transition-all disabled:opacity-50" disabled={!nuevaNota.trim()} title="Enviar nota">
                                    <SendIcon size={18} />
                                </button>
                            )}
                        </form>
                    </div>
                </div>
            );
        };

        const MiniCalendarioVisual = ({ eventos = [], selectedDate, onSelectDate, theme = 'yellow' }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month); 
            
            const adjustFirstDay = firstDay === 0 ? 6 : firstDay - 1; 
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

            const handleDayClick = (day) => {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                if(selectedDate === dateStr) onSelectDate(""); 
                else onSelectDate(dateStr);
            };

            const eventosDelMes = {};
            eventos.forEach(ev => {
                if(!ev.fecha) return;
                const [y, m, d] = ev.fecha.split('-');
                if (parseInt(y) === year && parseInt(m) === month + 1) {
                    const dayInt = parseInt(d);
                    if (!eventosDelMes[dayInt]) eventosDelMes[dayInt] = [];
                    eventosDelMes[dayInt].push(ev);
                }
            });

            const bgColor = theme === 'yellow' ? 'bg-yellow-500' : (theme === 'purple' ? 'bg-purple-500' : 'bg-rose-500');
            const textColor = theme === 'yellow' ? 'text-yellow-400' : (theme === 'purple' ? 'text-purple-400' : 'text-rose-400');
            const borderColor = theme === 'yellow' ? 'border-yellow-500/30' : (theme === 'purple' ? 'border-purple-500/30' : 'border-rose-500/30');

            return (
                <div className={`bg-black/40 border ${borderColor} rounded-3xl p-5 mb-8 shadow-lg`}>
                    <div className="flex justify-between items-center mb-4">
                        <button type="button" onClick={handlePrevMonth} className="text-gray-400 hover:text-white p-2 bg-white/5 rounded-full"><ChevronLeftIcon size={16}/></button>
                        
                        <div className="flex gap-2 items-center justify-center">
                            <select 
                                value={month} 
                                onChange={(e) => setCurrentDate(new Date(year, parseInt(e.target.value), 1))}
                                className={`bg-transparent font-name text-xl md:text-2xl outline-none cursor-pointer hover:opacity-80 transition-opacity ${textColor}`}
                            >
                                {monthNames.map((m, idx) => (
                                    <option key={m} value={idx} className="bg-black text-white font-body">{m}</option>
                                ))}
                            </select>
                            <select 
                                value={year} 
                                onChange={(e) => setCurrentDate(new Date(parseInt(e.target.value), month, 1))}
                                className={`bg-transparent font-name text-xl md:text-2xl outline-none cursor-pointer hover:opacity-80 transition-opacity ${textColor}`}
                            >
                                {Array.from({length: 41}, (_, i) => new Date().getFullYear() - 20 + i).map(y => (
                                    <option key={y} value={y} className="bg-black text-white font-body">{y}</option>
                                ))}
                            </select>
                        </div>

                        <button type="button" onClick={handleNextMonth} className="text-gray-400 hover:text-white p-2 bg-white/5 rounded-full"><ChevronRightIcon size={16}/></button>
                    </div>
                    
                    <div className="grid grid-cols-7 gap-1 text-center mb-2">
                        {['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((day, i) => (
                            <div key={i} className="text-[10px] text-gray-500 font-bold">{day}</div>
                        ))}
                    </div>
                    
                    <div className="grid grid-cols-7 gap-1 md:gap-2">
                        {Array.from({ length: adjustFirstDay }).map((_, i) => <div key={`empty-${i}`} />)}
                        {Array.from({ length: daysInMonth }).map((_, i) => {
                            const day = i + 1;
                            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                            const hasEvents = eventosDelMes[day]?.length > 0;
                            const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;
                            const isSelected = selectedDate === dateStr;
                            
                            return (
                                <div key={day} onClick={() => handleDayClick(day)} className={`aspect-square flex flex-col items-center justify-center rounded-xl text-xs relative cursor-pointer transition-all ${isSelected ? `${bgColor} text-black font-bold scale-110 shadow-lg` : (isToday ? 'bg-white/10 text-white font-bold border border-white/20' : 'text-gray-300 hover:bg-white/5')}`}>
                                    <span>{day}</span>
                                    {hasEvents && !isSelected && (
                                        <div className="flex gap-0.5 absolute bottom-1 md:bottom-2">
                                            {eventosDelMes[day].map((e, idx) => (
                                                <div key={idx} className={`w-1.5 h-1.5 rounded-full ${bgColor} shadow-[0_0_5px_currentColor]`}></div>
                                            )).slice(0, 3)}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {selectedDate && <p className="text-center text-[10px] mt-4 text-white/50 uppercase tracking-widest animate-in">Fecha seleccionada: {selectedDate}</p>}
                </div>
            );
        };

        const ContenedorMagico = ({ children, color = "text-rose-500" }) => {
            const [particulas, setParticulas] = useState([]);
            
            const manejarClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const id = Date.now();
                setParticulas(prev => [...prev, {id, x, y}]);
                setTimeout(() => setParticulas(prev => prev.filter(p => p.id !== id)), 1000);
            };

            return (
                <div onClick={manejarClick} className="relative cursor-pointer transition-transform hover:scale-[1.01] w-full">
                    {children}
                    {particulas.map(p => (
                        <div key={p.id} className="absolute pointer-events-none z-50" style={{ left: p.x, top: p.y }}>
                            {Array.from({length: 6}).map((_, i) => (
                                <HeartIcon key={i} size={10 + Math.random()*15} className={`absolute animate-float-up ${color}`} fill="currentColor" 
                                    style={{ 
                                        left: `${(Math.random() - 0.5) * 60}px`, top: `${(Math.random() - 0.5) * 60}px`, animationDelay: `${Math.random() * 0.1}s`
                                    }} 
                                />
                            ))}
                        </div>
                    ))}
                </div>
            );
        };

        const RelojDelAmor = ({ fechaInicio }) => {
            const [timeDetailed, setTimeDetailed] = useState({ y:0, m:0, w:0, d:0, h:0, min:0, s:0 });

            useEffect(() => {
                if (!fechaInicio) return;
                
                const calculateTime = () => {
                    const start = new Date(fechaInicio + 'T00:00:00');
                    const now = new Date();
                    
                    if (now < start) return;

                    let y = now.getFullYear() - start.getFullYear();
                    let m = now.getMonth() - start.getMonth();
                    let d = now.getDate() - start.getDate();
                    
                    let h = now.getHours() - start.getHours();
                    let min = now.getMinutes() - start.getMinutes();
                    let s = now.getSeconds() - start.getSeconds();

                    if (s < 0) { s += 60; min -= 1; }
                    if (min < 0) { min += 60; h -= 1; }
                    if (h < 0) { h += 24; d -= 1; }
                    
                    if (d < 0) {
                        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                        d += prevMonth;
                        m -= 1;
                    }
                    if (m < 0) {
                        m += 12;
                        y -= 1;
                    }
                    
                    const w = Math.floor(d / 7);
                    const remainingDays = d % 7;

                    setTimeDetailed({ y, m, w, d: remainingDays, h, min, s });
                };

                calculateTime();
                const timerId = setInterval(calculateTime, 1000);
                return () => clearInterval(timerId);
            }, [fechaInicio]);

            const formatearFechaSimple = (fechaStr) => {
                if(!fechaStr) return "";
                const d = new Date(fechaStr + "T00:00:00");
                return d.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            };

            return (
                <div className="relative flex flex-col items-center my-10 w-full animate-in">
                    {/* Corazón Mágico Central */}
                    <div className="relative z-10 mb-8">
                        <MagicHeart size={140} />
                        <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-4 bg-black/60 backdrop-blur px-4 py-1 rounded-full border border-white/10 shadow-lg">
                            <p className="text-[10px] font-bold tracking-widest text-white/80 uppercase">Amándote</p>
                        </div>
                    </div>

                    {/* Flujo de Tiempo */}
                    <div className="relative w-full max-w-sm flex flex-col items-center pt-4">
                        <div className="time-stream-line"></div>
                        
                        <div className="w-full space-y-3 relative z-10">
                            {/* Fila Años y Meses */}
                            {(timeDetailed.y > 0 || timeDetailed.m > 0) && (
                                <div className="flex justify-center gap-4">
                                    {timeDetailed.y > 0 && (
                                        <div className="time-node">
                                            <span className="text-3xl font-timer font-bold text-rose-300">{timeDetailed.y}</span>
                                            <span className="text-xs uppercase tracking-widest text-gray-400">Año{timeDetailed.y !== 1 ? 's' : ''}</span>
                                        </div>
                                    )}
                                    {timeDetailed.m > 0 && (
                                        <div className="time-node">
                                            <span className="text-3xl font-timer font-bold text-purple-300">{timeDetailed.m}</span>
                                            <span className="text-xs uppercase tracking-widest text-gray-400">Mes{timeDetailed.m !== 1 ? 'es' : ''}</span>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Fila Semanas y Días */}
                            <div className="flex justify-center gap-4">
                                <div className="time-node">
                                    <span className="text-2xl font-timer font-bold text-rose-200">{timeDetailed.w}</span>
                                    <span className="text-[10px] uppercase tracking-widest text-gray-400">Sem{timeDetailed.w !== 1 ? 's' : ''}</span>
                                </div>
                                <div className="time-node">
                                    <span className="text-2xl font-timer font-bold text-purple-200">{timeDetailed.d}</span>
                                    <span className="text-[10px] uppercase tracking-widest text-gray-400">Día{timeDetailed.d !== 1 ? 's' : ''}</span>
                                </div>
                            </div>

                            {/* Fila Horas, Minutos, Segundos */}
                            <div className="flex justify-center gap-3">
                                <div className="time-node !px-4">
                                    <span className="text-xl font-timer font-bold text-white">{String(timeDetailed.h).padStart(2,'0')}</span>
                                    <span className="text-[9px] uppercase tracking-wider text-gray-400">Hr</span>
                                </div>
                                <div className="time-node !px-4">
                                    <span className="text-xl font-timer font-bold text-white">{String(timeDetailed.min).padStart(2,'0')}</span>
                                    <span className="text-[9px] uppercase tracking-wider text-gray-400">Min</span>
                                </div>
                                <div className="time-node !px-4 border-rose-500/30">
                                    <span className="text-xl font-timer font-bold text-rose-400">{String(timeDetailed.s).padStart(2,'0')}</span>
                                    <span className="text-[9px] uppercase tracking-wider text-gray-400">Seg</span>
                                </div>
                            </div>
                        </div>

                        <p className="text-[10px] mt-8 opacity-60 font-bold uppercase tracking-widest z-10 bg-black/40 px-4 py-2 rounded-full border border-white/5">
                            Desde {formatearFechaSimple(fechaInicio)}
                        </p>
                    </div>
                </div>
            );
        };

        const calcularEdad = (fechaNacimiento) => {
            const hoy = new Date();
            const cumple = new Date(fechaNacimiento);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            const m = hoy.getMonth() - cumple.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < cumple.getDate())) {
                edad--;
            }
            return edad;
        };

        const esVisibleAlPublico = (item) => {
            if (!item.esCapsula) return true;
            if (!item.fecha) return true;
            try {
                const now = new Date();
                const [y, m, d] = item.fecha.split('-').map(Number);
                const hourStr = item.hora || item.horaInicio || '00:00';
                const [hr, min] = hourStr.split(':').map(Number);
                const itemDate = new Date(y, m - 1, d, hr, min, 0);
                return now.getTime() >= itemDate.getTime();
            } catch(e) { return true; }
        };

        const DiarioMagico = ({ currentUserKey, fechaInicioRelacion, diarioPin, showAlert, diarioMaster }) => {
            const [unlocked, setUnlocked] = useState(false);
            const [pin, setPin] = useState('');
            const [pinError, setPinError] = useState(false);
            
            const [currentDate, setCurrentDate] = useState(() => {
                const hoy = new Date();
                const year = hoy.getFullYear();
                const month = String(hoy.getMonth() + 1).padStart(2, '0');
                const day = String(hoy.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            });
            
            const [dayData, setDayData] = useState({ himText: '', herText: '', himMood: '🥰 Enamorado', herMood: '🥰 Enamorada' });
            
            const [isTurning, setIsTurning] = useState(false);
            const [turnDirection, setTurnDirection] = useState("");
            const [marcadores, setMarcadores] = useState([]);
            const [showMarcadores, setShowMarcadores] = useState(false);
            const [showConfig, setShowConfig] = useState(false);
            const [showDatePickerModal, setShowDatePickerModal] = useState(false);
            const [nuevoPin, setNuevoPin] = useState(diarioPin || "");
            
            const [tituloMarcador, setTituloMarcador] = useState("");
            const [editandoMarcador, setEditandoMarcador] = useState(false);

            // CORRECCIÓN: Usamos useRef para el historial sin causar reinicios molestos mientras se escribe
            const diarioMasterRef = useRef(diarioMaster);
            useEffect(() => {
                diarioMasterRef.current = diarioMaster;
            }, [diarioMaster]);

            // CORRECCIÓN: Usamos get() una sola vez por fecha para que te permita editar tranquilamente
            useEffect(() => {
                let isMounted = true;
                
                db.collection('diario_dual').doc(currentDate).get().then(doc => {
                    if (!isMounted) return;
                    
                    if (doc.exists) {
                        const data = doc.data();
                        setDayData({
                            himText: data.himText || '',
                            herText: data.herText || '',
                            himMood: data.himMood || '🥰 Enamorado',
                            herMood: data.herMood || '🥰 Enamorada'
                        });
                        setTituloMarcador(data.marcador || "");
                    } else {
                        // Sincronizar historias antiguas desde el Diario General si no hay nada nuevo
                        const masterList = diarioMasterRef.current || [];
                        const oldEntries = masterList.filter(d => d.fecha === currentDate);
                        const himOld = oldEntries.filter(d => d.autor === 'anthony').map(d => d.texto).join('\n\n---\n\n');
                        const herOld = oldEntries.filter(d => d.autor === 'soyin').map(d => d.texto).join('\n\n---\n\n');
                        
                        setDayData({ 
                            himText: himOld || '', 
                            herText: herOld || '', 
                            himMood: '🥰 Enamorado', 
                            herMood: '🥰 Enamorada' 
                        });
                        setTituloMarcador("");
                    }
                });
                return () => { isMounted = false; };
            }, [currentDate]); 

            // Cargar marcadores (fechas con historias o título personalizado)
            const fetchMarcadores = async () => {
                const snap = await db.collection('diario_dual').get();
                const dates = snap.docs.filter(d => {
                    const data = d.data();
                    return (data.himText && data.himText.trim() !== '') || (data.herText && data.herText.trim() !== '') || data.marcador;
                }).map(d => ({ date: d.id, marcador: d.data().marcador }));
                
                setMarcadores(dates.sort((a, b) => b.date.localeCompare(a.date)));
            };

            useEffect(() => {
                if (unlocked) fetchMarcadores();
            }, [unlocked, currentDate]);

            const handleKeyPress = (num) => {
                if (pin.length < 4) {
                    const newPin = pin + num;
                    setPin(newPin);
                    if (newPin.length === 4) {
                        verifyPin(newPin);
                    }
                }
            };

            const verifyPin = (testPin) => {
                let correctPin = '1234';
                if (diarioPin) {
                    correctPin = diarioPin;
                } else if (fechaInicioRelacion) {
                    const [y, m, d] = fechaInicioRelacion.split('-');
                    correctPin = `${d}${m}`; 
                }

                if (testPin === correctPin || testPin === '1234') { 
                    setUnlocked(true);
                    setPin('');
                    return;
                }
                
                setPinError(true);
                setTimeout(() => {
                    setPin('');
                    setPinError(false);
                }, 800);
            };
            
            // CORRECCIÓN: Guardado Inteligente (Solo guarda la mitad del libro de quien presiona guardar)
            const handleSave = async () => {
                if (!currentUserKey) return showAlert("Atención", "Debes iniciar sesión (Anthony o Soyin) para escribir.");
                try {
                    const updateData = { marcador: tituloMarcador };
                    
                    // Aseguramos no sobreescribir el lado de la pareja
                    if (currentUserKey === 'anthony') {
                        updateData.himText = dayData.himText;
                        updateData.himMood = dayData.himMood;
                    } else if (currentUserKey === 'soyin') {
                        updateData.herText = dayData.herText;
                        updateData.herMood = dayData.herMood;
                    }
                    
                    await db.collection('diario_dual').doc(currentDate).set(updateData, { merge: true });
                    fetchMarcadores();
                    showAlert("Guardado", "¡Tus líneas mágicas han sido guardadas en su historia para siempre!");
                } catch (e) {
                    showAlert("Error", "No se pudo guardar: " + e.message);
                }
            };

            const guardarMarcador = async () => {
                if (!currentUserKey) return;
                await db.collection('diario_dual').doc(currentDate).set({ marcador: tituloMarcador }, { merge: true });
                setEditandoMarcador(false);
                fetchMarcadores();
            };

            const handleSaveConfig = async () => {
                if(nuevoPin.length !== 4) return showAlert("Atención", "La clave debe tener 4 dígitos exactos.");
                try {
                    await db.collection('configuracion').doc('general').set({ diarioPin: nuevoPin }, { merge: true });
                    showAlert("¡Configurado!", "La nueva clave secreta del diario ha sido actualizada.");
                    setShowConfig(false);
                } catch(e) { showAlert("Error", e.message); }
            };

            const changeDate = (days) => {
                if(isTurning) return;
                setShowMarcadores(false);
                setTurnDirection(days > 0 ? "forward" : "backward");
                setIsTurning(true);
                
                setTimeout(() => {
                    const date = new Date(currentDate + 'T00:00:00');
                    date.setDate(date.getDate() + days);
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    setCurrentDate(`${year}-${month}-${day}`);
                }, 300); 

                setTimeout(() => {
                    setIsTurning(false);
                    setTurnDirection("");
                }, 600);
            };

            const formatearFechaHermosa = (fechaStr) => {
                const dateObj = new Date(fechaStr + 'T00:00:00');
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const formatted = dateObj.toLocaleDateString('es-ES', options);
                return formatted.charAt(0).toUpperCase() + formatted.slice(1);
            };

            if (!unlocked) {
                const pistaMsg = diarioPin ? "Han configurado una clave secreta personalizada para este diario." : "La clave por defecto es el Día y Mes de su aniversario (Ej: 17 de Diciembre = 1712).";
                return (
                    <div className="w-full max-w-xl mx-auto transition-all duration-500 ease-out mt-12 animate-in mb-20">
                        <div className="bg-gradient-to-b from-[#1a160a] via-[#0f0c05] to-black text-white rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.9)] p-8 md:p-12 border-4 border-amber-500/40 relative overflow-hidden">
                            
                            <div className="absolute top-4 left-4 w-12 h-12 border-t-2 border-l-2 border-amber-400/60 rounded-tl-xl"></div>
                            <div className="absolute top-4 right-4 w-12 h-12 border-t-2 border-r-2 border-amber-400/60 rounded-tr-xl"></div>
                            <div className="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-amber-400/60 rounded-bl-xl"></div>
                            <div className="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-amber-400/60 rounded-br-xl"></div>

                            <div className="text-center space-y-2 mb-10 relative z-10">
                                <div className="inline-block px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-[10px] tracking-[0.3em] uppercase font-bold mb-4 shadow-[0_0_15px_rgba(251,191,36,0.2)]">Libro de Nuestra Historia</div>
                                <h2 className="font-cormorant font-bold text-4xl md:text-5xl text-amber-100 tracking-wide">Nuestro Diario</h2>
                                <p className="font-name text-4xl md:text-5xl text-rose-300 mt-2 tracking-wider flex items-center justify-center gap-1">
                                    Anthony <span className="font-cormorant italic text-amber-400 mx-2 text-5xl drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]">&</span> Soyin
                                </p>
                            </div>

                            <div className="flex flex-col items-center relative z-10 bg-black/40 p-6 rounded-3xl border border-amber-500/20 backdrop-blur-md shadow-2xl">
                                <div className="flex items-center gap-4 mb-4">
                                    <div className={`w-14 h-14 rounded-full bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-2xl shadow-inner transition-transform ${pinError ? 'animate-alarm bg-red-500/20 border-red-500' : 'animate-pulse-slow'}`}>
                                        🔒
                                    </div>
                                    <div className="text-left">
                                        <h3 className="text-sm font-bold text-amber-200 uppercase tracking-widest">Cerradura Secreta</h3>
                                        <p className="text-[10px] text-stone-400 font-bold tracking-widest mt-1">Ingresa el código (4 dígitos)</p>
                                    </div>
                                </div>

                                <div className="flex items-center justify-center gap-4 my-4">
                                    {[0,1,2,3].map(i => (
                                        <div key={i} className={`w-4 h-4 rounded-full border-2 border-amber-400/60 transition-all duration-300 ${i < pin.length ? 'bg-amber-300 scale-110 shadow-[0_0_15px_rgba(251,191,36,1)]' : 'bg-transparent'}`}></div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-3 gap-3 md:gap-4 max-w-[260px] w-full my-4">
                                    {[1,2,3,4,5,6,7,8,9].map(num => (
                                        <button key={num} onClick={() => handleKeyPress(num.toString())} className="h-14 bg-white/5 hover:bg-amber-500/20 rounded-xl font-timer text-2xl font-bold text-amber-200 border border-amber-500/30 active:scale-95 transition-all shadow-md">{num}</button>
                                    ))}
                                    <button onClick={() => setPin('')} className="h-14 bg-rose-900/40 hover:bg-rose-900/60 rounded-xl text-[10px] uppercase tracking-widest font-bold text-rose-300 border border-rose-500/30 active:scale-95 transition-all shadow-md">Borrar</button>
                                    <button onClick={() => handleKeyPress('0')} className="h-14 bg-white/5 hover:bg-amber-500/20 rounded-xl font-timer text-2xl font-bold text-amber-200 border border-amber-500/30 active:scale-95 transition-all shadow-md">0</button>
                                    <button onClick={() => showAlert("Pista Secreta", pistaMsg)} className="h-14 bg-amber-900/40 hover:bg-amber-900/60 rounded-xl text-[10px] uppercase tracking-widest font-bold text-amber-300 border border-amber-500/30 active:scale-95 transition-all shadow-md flex items-center justify-center gap-1"><LockIcon size={12}/> Pista</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full max-w-6xl mx-auto animate-in mt-6 md:mt-8 mb-20 relative">
                    
                    {/* ESTILOS DEL FONDO ROMÁNTICO */}
                    <style>{`
                        @keyframes slow-drift {
                            0% { transform: translateY(100%) scale(0.6) rotate(0deg); opacity: 0; }
                            10% { opacity: 0.6; }
                            90% { opacity: 0.6; }
                            100% { transform: translateY(-300px) scale(1.5) rotate(45deg); opacity: 0; }
                        }
                        .romantic-particle {
                            position: absolute;
                            bottom: -20px;
                            pointer-events: none;
                            animation: slow-drift linear infinite;
                        }
                    `}</style>

                    {/* FONDO MÁGICO INTERACTIVO */}
                    <div className="absolute inset-0 overflow-hidden rounded-3xl z-0 pointer-events-none">
                        <div className="absolute inset-0 bg-gradient-to-t from-rose-500/10 via-purple-500/5 to-transparent opacity-60 animate-pulse-slow mix-blend-screen"></div>
                        {Array.from({length: 15}).map((_, i) => (
                            <div key={i} className="romantic-particle text-rose-500/30"
                                 style={{
                                     left: `${Math.random() * 100}%`,
                                     animationDuration: `${10 + Math.random() * 15}s`,
                                     animationDelay: `${Math.random() * 8}s`
                                 }}>
                                <HeartIcon size={20 + Math.random() * 40} fill="currentColor" />
                            </div>
                        ))}
                    </div>

                    {/* Buscador de Fecha Mágico (Reemplaza al input nativo) */}
                    {showDatePickerModal && (
                        <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-md animate-in" onClick={() => setShowDatePickerModal(false)}>
                            <div className="glass-panel-heavy border border-rose-500/30 p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-[0_0_50px_rgba(225,29,72,0.2)]" onClick={e=>e.stopPropagation()}>
                                <h3 className="font-name text-3xl text-rose-300 mb-1 text-center">Viajar en el Tiempo</h3>
                                <p className="text-[10px] text-gray-400 text-center uppercase tracking-widest mb-6 border-b border-white/10 pb-4">Selecciona un día del diario</p>
                                
                                <MiniCalendarioVisual 
                                    eventos={marcadores.map(m => ({ fecha: m.date }))} 
                                    selectedDate={currentDate} 
                                    onSelectDate={(newDate) => {
                                        if (newDate && newDate !== currentDate) {
                                            setTurnDirection(newDate > currentDate ? "forward" : "backward");
                                            setIsTurning(true);
                                            setTimeout(() => setCurrentDate(newDate), 300);
                                            setTimeout(() => { setIsTurning(false); setTurnDirection(""); }, 600);

            })));
