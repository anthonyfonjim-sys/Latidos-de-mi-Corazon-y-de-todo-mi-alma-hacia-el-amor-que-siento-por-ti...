                    if (!user) return; 
                    const now = new Date();
                    const currentHourMinute = now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
                    const hoyDateStr = obtenerFechaHoyLocal();
                    
                    const misRutinas = rutinas.filter(r => r.autor.toLowerCase() === (currentUserName ? currentUserName.toLowerCase() : ''));
                    const triggeredRoutine = misRutinas.find(r => {
                        const matchesDate = !r.fecha || r.fecha === hoyDateStr;
                        const matchesTime = r.hora === currentHourMinute;
                        return r.activa && matchesDate && matchesTime;
                    });
                    
                    if (triggeredRoutine && lastTriggeredTime !== currentHourMinute) {
                        setLastTriggeredTime(currentHourMinute);
                        setRutinaActivaModal(triggeredRoutine);
                        if(alarmAudioRef.current) {
                            alarmAudioRef.current.currentTime = 0;
                            alarmAudioRef.current.play().catch(e => console.log("Audio block", e));
                        }
                    }
                }, 5000); 
                return () => clearInterval(checkAlarms);
            }, [rutinas, lastTriggeredTime, currentUserName, user]);

            // Base de Datos Listeners
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                
                const unsubLatidos = db.collection("latidos").orderBy("timestamp", "desc").onSnapshot(snap => setLatidos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubDiario = db.collection("diario").orderBy("timestamp", "desc").onSnapshot(snap => setDiario(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSoyinMsgs = db.collection("mensajes_soyin").orderBy("timestamp", "desc").onSnapshot(snap => setMensajesSoyin(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubEventos = db.collection("calendario").orderBy("timestamp", "desc").onSnapshot(snap => setEventos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubRutinas = db.collection("rutinas").orderBy("timestamp", "desc").onSnapshot(snap => setRutinas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubPrivado = db.collection("diario_privado").orderBy("timestamp", "desc").onSnapshot(snap => setDiarioPrivado(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

                const unsubConfig = db.collection("configuracion").doc("general").onSnapshot(doc => {
                    if (doc.exists) { 
                        setMusicUrl(doc.data().musicUrl); setNuevaMusica(doc.data().musicUrl); 
                        setAlarmUrl(doc.data().alarmUrl); setNuevaAlarmaLink(doc.data().alarmUrl || "");
                        if(doc.data().fechaInicioRelacion) {
                            setFechaInicioRelacion(doc.data().fechaInicioRelacion);
                            setNuevaFechaRelacion(doc.data().fechaInicioRelacion);
                        }
                    }
                });

                const unsubBienvenidaAnth = db.collection("bienvenida").doc("anthony").onSnapshot(doc => {
                    if (doc.exists) { 
                        const data = doc.data();
                        setBienvenidaAnthony(data); setFormBienvenidaAnthony(data.texto || ""); 
                        if(data.fecha) { setCustomCartaAnth(true); setFechaCartaAnth(data.fecha); setHoraCartaAnth(data.hora || ""); setIsCapsulaCartaAnth(data.esCapsula || false); }
                    }
                });

                const unsubBienvenidaSoy = db.collection("bienvenida").doc("soyin").onSnapshot(doc => {
                    if (doc.exists) { 
                        const data = doc.data();
                        setBienvenidaSoyin(data); setFormBienvenidaSoyin(data.texto || ""); 
                        if(data.fecha) { setCustomCartaSoyin(true); setFechaCartaSoyin(data.fecha); setHoraCartaSoyin(data.hora || ""); setIsCapsulaCartaSoyin(data.esCapsula || false); }
                    }
                });

                return () => { unsubAuth(); unsubLatidos(); unsubDiario(); unsubSoyinMsgs(); unsubEventos(); unsubRutinas(); unsubPrivado(); unsubConfig(); unsubBienvenidaAnth(); unsubBienvenidaSoy(); };
            }, []);

            // Filtros de Arrays Públicos (Eliminando los "Cápsula" que aún no es tiempo)
            const diarioPublico = ordenarCronologicamente(diario).filter(esVisibleAlPublico);
            const latidosPublico = ordenarCronologicamente(latidos).filter(esVisibleAlPublico);
            const msgsSoyinPublico = ordenarCronologicamente(mensajesSoyin).filter(esVisibleAlPublico);

            const hoyStr = obtenerFechaHoyLocal();
            const latidosHoy = latidosPublico.filter(l => l.fecha === hoyStr);
            const mensajesSoyinHoy = msgsSoyinPublico.filter(m => m.fecha === hoyStr);

            const eventosOrdenados = ordenarCronologicamente(eventosConTiempo, true); 
            const eventosCercanos = eventosConTiempo.filter(ev => !ev.isPast && ev.timeLeft && ev.timeLeft.days <= 3);
            
            // Rutinas Privadas del Usuario Activo
            const misRutinasOrdenadas = rutinas.filter(r => r.autor.toLowerCase() === (currentUserName ? currentUserName.toLowerCase() : '')).sort((a, b) => a.hora.localeCompare(b.hora)); 
            
            // Diario Privado del Usuario Activo
            const miDiarioPrivado = diarioPrivado.filter(d => d.autor === currentUserKey);

            // Arrays completos para los paneles maestros (muestran todo, incluso cápsulas)
            const diarioMaster = ordenarCronologicamente(diario);
            const latidosMaster = ordenarCronologicamente(latidos);
            const msgsSoyinMaster = ordenarCronologicamente(mensajesSoyin);

            const toggleMusic = () => {
                if (isPlaying) audioRef.current.pause();
                else audioRef.current.play().catch(e => console.log(e));
                setIsPlaying(!isPlaying);
            };

            const cerrarAlarma = () => {
                setRutinaActivaModal(null);
                if(alarmAudioRef.current) alarmAudioRef.current.pause();
            };

            const abrirPanelLogin = (quien) => {
                setLoginTarget(quien);
                setIsResettingPassword(false);
                setLoginError("");
                setPassword("");
                if (user) {
                    if ((quien === 'anthony' && !isAnthony) || (quien === 'soyin' && !isSoyin)) {
                        auth.signOut();
                    }
                }
                setShowLogin(true);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                try { await auth.signInWithEmailAndPassword(email, password); } 
                catch (error) { 
                    setLoginError("Credenciales incorrectas. Verifica tu contraseña o utiliza la opción de restablecer."); 
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                if(!resetEmail) return showAlert("Atención", "Por favor ingresa tu correo.");
                try {
                    await auth.sendPasswordResetEmail(resetEmail);
                    showAlert("Correo Enviado", "Te hemos enviado un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada o la carpeta de Spam.");
                    setIsResettingPassword(false);
                } catch (error) { showAlert("Error", error.message); }
            };

            const cerrarSesion = () => { auth.signOut(); setShowLogin(false); };

            const cambiarPasswordModal = async (e) => {
                e.preventDefault();
                if(!auth.currentUser) return showAlert("Atención", "Sesión expirada");
                if(nuevaPass !== confPass) return showAlert("Error", "Las contraseñas no coinciden.");
                if(nuevaPass.length < 6) return showAlert("Error", "La contraseña debe tener al menos 6 caracteres.");
                try {
                    await auth.currentUser.updatePassword(nuevaPass);
                    showAlert("Éxito", "¡Contraseña actualizada con éxito!");
                    setNuevaPass(""); setConfPass("");
                    setShowChangePassModal(false);
                } catch (error) {
                    if (error.code === 'auth/requires-recent-login') {
                        showAlert("Seguridad", "Por seguridad, necesitas volver a Iniciar Sesión para cambiar la contraseña. Cierra sesión y vuelve a entrar.");
                        setShowChangePassModal(false);
                    } else showAlert("Error", error.message);
                }
            };

            const abrirEditor = (coleccion, item) => {
                setEditModal({
                    show: true, coleccion, id: item.id,
                    texto: item.texto || '',
                    fecha: item.fecha || obtenerFechaHoyLocal(),
                    hora: item.hora || item.horaInicio || obtenerHoraExacta(),
                    titulo: item.titulo || '',
                    horaFin: item.horaFin || '',
                    nota: item.nota || ''
                });
            };

            const guardarEdicion = async () => {
                try {
                    let dataToUpdate = {};
                    if (editModal.coleccion === 'rutinas') {
                        if(!editModal.titulo) return showAlert("Atención", "El título es requerido");
                        dataToUpdate = { titulo: editModal.titulo, fecha: editModal.fecha, hora: editModal.hora, horaFin: editModal.horaFin };
                    } else if (editModal.coleccion === 'calendario') {
                        if(!editModal.titulo) return showAlert("Atención", "El título es requerido");
                        dataToUpdate = { titulo: editModal.titulo, fecha: editModal.fecha, hora: editModal.hora, horaFin: editModal.horaFin, nota: editModal.nota };
                    } else {
                        if(!editModal.texto) return showAlert("Atención", "El texto es requerido");
                        dataToUpdate = { texto: editModal.texto, fecha: editModal.fecha, hora: editModal.hora };
                    }
                    
                    await db.collection(editModal.coleccion).doc(editModal.id).set(dataToUpdate, { merge: true });
                    
                    setEditModal({ show: false, coleccion: '', id: '', texto: '', fecha: '', hora: '', titulo: '', horaFin: '', nota: '' });
                    showAlert("Guardado", "¡Actualizado con éxito!");
                } catch (error) { showAlert("Error", "Hubo un error al editar: " + error.message); }
            };

            const eliminarDocumento = (coleccion, id, mensaje = "¿Seguro que quieres borrar esto?") => {
                showConfirm("Confirmar Borrado", mensaje, async () => {
                    await db.collection(coleccion).doc(id).delete();
                    showAlert("Eliminado", "El recuerdo ha sido borrado.");
                });
            };

            const toggleRutina = async (id, estadoActual) => {
                await db.collection("rutinas").doc(id).update({ activa: !estadoActual });
            };

            // FUNCIONES DE GUARDADO PUBLICO Y CAPSULAS
            const publicarMensajeAnthony = async(e) => {
                e.preventDefault(); 
                if(!nuevoTexto) return showAlert("Atención", "Escribe un mensaje, por favor."); 
                const fechaFinal = customDateAnth && nuevaFecha ? nuevaFecha : obtenerFechaHoyLocal();
                const horaFinal = customDateAnth && nuevaHora ? nuevaHora : obtenerHoraExacta();

                try {
                    await db.collection(tipoMensaje).add({ 
                        texto: nuevoTexto, fecha: fechaFinal, hora: horaFinal, 
                        autor: 'anthony', esCapsula: customDateAnth && isCapsulaAnth, 
                        timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                    }); 
                    setNuevoTexto(""); setNuevaFecha(""); setNuevaHora(""); setCustomDateAnth(false); setIsCapsulaAnth(false);
                    showAlert("Mágico", "¡Publicado mágicamente!"); 
                } catch(error) { showAlert("Error", "Hubo un error al guardar: " + error.message); }
            };

            const publicarDiarioSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoDiarioSoyin) return; 
                const fechaFinal = customDateSoyinDiario && fechaDiarioSoyin ? fechaDiarioSoyin : obtenerFechaHoyLocal();
                const horaFinal = customDateSoyinDiario && horaDiarioSoyin ? horaDiarioSoyin : obtenerHoraExacta();

                await db.collection("diario").add({
                    texto: nuevoDiarioSoyin, fecha: fechaFinal, hora: horaFinal, 
                    autor: 'soyin', esCapsula: customDateSoyinDiario && isCapsulaSoyinDiario,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }); 
                setNuevoDiarioSoyin(""); setFechaDiarioSoyin(""); setHoraDiarioSoyin(""); setCustomDateSoyinDiario(false); setIsCapsulaSoyinDiario(false);
                showAlert("Diario", "¡Historia guardada en el Diario!"); 
            };

            const publicarMensajeCortoSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoTextoSoyin) return; 
                const fechaFinal = customDateSoyinLatido && fechaMensajeSoyin ? fechaMensajeSoyin : obtenerFechaHoyLocal();
                const horaFinal = customDateSoyinLatido && horaMensajeSoyin ? horaMensajeSoyin : obtenerHoraExacta();

                await db.collection("mensajes_soyin").add({
                    texto: nuevoTextoSoyin, fecha: fechaFinal, hora: horaFinal, 
                    esCapsula: customDateSoyinLatido && isCapsulaSoyinLatido,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }); 
                setNuevoTextoSoyin(""); setFechaMensajeSoyin(""); setHoraMensajeSoyin(""); setCustomDateSoyinLatido(false); setIsCapsulaSoyinLatido(false);
                showAlert("Latido", "¡Latido guardado en tu historial!"); 
            };

            const agregarEvento = async (e, autor) => {
                e.preventDefault();
                if(!nuevoEventoTitulo || !nuevoEventoFecha) return showAlert("Atención", "Faltan datos.");
                await db.collection("calendario").add({
                    titulo: nuevoEventoTitulo, fecha: nuevoEventoFecha, 
                    hora: nuevoEventoHoraInicio, horaFin: nuevoEventoHoraFin,
                    nota: nuevoEventoNota, autor: autor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNuevoEventoTitulo(""); setNuevoEventoFecha(""); setNuevoEventoNota(""); setNuevoEventoHoraInicio(""); setNuevoEventoHoraFin("");
                showAlert("Calendario", "¡Fecha importante guardada en el calendario!");
            };

            const agregarRutina = async (e, autor) => {
                e.preventDefault();
                if(!nuevaRutinaTitulo || !nuevaRutinaHora) return showAlert("Atención", "Faltan datos de la rutina.");
                await db.collection("rutinas").add({
                    titulo: nuevaRutinaTitulo, 
                    hora: nuevaRutinaHora, 
                    horaFin: nuevaRutinaHoraFin,
                    fecha: nuevaRutinaFecha, // vacio si es todos los dias
                    activa: true, 
                    autor: autor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNuevaRutinaTitulo(""); setNuevaRutinaHora(""); setNuevaRutinaHoraFin(""); setNuevaRutinaFecha("");
                showAlert("Rutina", "¡Rutina programada exitosamente!");
            };

            const publicarDiarioPrivado = async(e) => {
                e.preventDefault();
                if(!nuevoTextoPrivado) return;
                await db.collection("diario_privado").add({
                    texto: nuevoTextoPrivado, autor: currentUserKey,
                    fecha: obtenerFechaHoyLocal(), hora: obtenerHoraExacta(),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNuevoTextoPrivado("");
                showAlert("Secreto", "Guardado en tu espacio secreto 🔒");
            };

            const guardarBienvenidaAnthony = async (e) => {
                e.preventDefault();
                const fechaFinal = customCartaAnth && fechaCartaAnth ? fechaCartaAnth : obtenerFechaHoyLocal();
                const horaFinal = customCartaAnth && horaCartaAnth ? horaCartaAnth : obtenerHoraExacta();
                const esCapsula = customCartaAnth && isCapsulaCartaAnth;

                await db.collection("bienvenida").doc("anthony").set({ texto: formBienvenidaAnthony, fecha: fechaFinal, hora: horaFinal, esCapsula, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("diario").add({ texto: `[Carta de Entrada]: ${formBienvenidaAnthony}`, fecha: fechaFinal, hora: horaFinal, autor: 'anthony', esCapsula, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                
                setFormBienvenidaAnthony(""); setCustomCartaAnth(false); setIsCapsulaCartaAnth(false);
                showAlert("Portada", "Mensaje de entrada actualizado y guardado en tu historia");
            };

            const guardarBienvenidaSoyin = async (e) => {
                e.preventDefault();
                const fechaFinal = customCartaSoyin && fechaCartaSoyin ? fechaCartaSoyin : obtenerFechaHoyLocal();
                const horaFinal = customCartaSoyin && horaCartaSoyin ? horaCartaSoyin : obtenerHoraExacta();
                const esCapsula = customCartaSoyin && isCapsulaCartaSoyin;

                await db.collection("bienvenida").doc("soyin").set({ texto: formBienvenidaSoyin, fecha: fechaFinal, hora: horaFinal, esCapsula, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("diario").add({ texto: `[Carta de Entrada]: ${formBienvenidaSoyin}`, fecha: fechaFinal, hora: horaFinal, autor: 'soyin', esCapsula, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                
                setFormBienvenidaSoyin(""); setCustomCartaSoyin(false); setIsCapsulaCartaSoyin(false);
                showAlert("Portada", "Mensaje de entrada actualizado y guardado en tu historia");
            };

            const borrarBienvenidaAnthony = async () => {
                showConfirm("Eliminar Carta", "¿Borrar tu mensaje de entrada actual?", async () => {
                    await db.collection("bienvenida").doc("anthony").delete();
                    setFormBienvenidaAnthony(""); setCustomCartaAnth(false); setIsCapsulaCartaAnth(false);
                    showAlert("Eliminado", "La carta de entrada ha sido borrada.");
                });
            };

            const borrarBienvenidaSoyin = async () => {
                showConfirm("Eliminar Carta", "¿Borrar tu mensaje de entrada actual?", async () => {
                    await db.collection("bienvenida").doc("soyin").delete();
                    setFormBienvenidaSoyin(""); setCustomCartaSoyin(false); setIsCapsulaCartaSoyin(false);
                    showAlert("Eliminado", "La carta de entrada ha sido borrada.");
                });
            };

            // EXTENSIÓN DEL SELECTOR DE FECHA (AÑADIDO CÁPSULA CHECKBOX)
            const renderDateSelectorExt = (isCustom, setIsCustom, fecha, setFecha, hora, setHora, isCapsula, setIsCapsula, colorTheme = "rose") => {
                const btnColor = colorTheme === "purple" ? "bg-purple-600/50 border-purple-500" : "bg-rose-600/50 border-rose-500";
                const focusColor = colorTheme === "purple" ? "focus:border-purple-500" : "focus:border-rose-500";
                const textColor = colorTheme === "purple" ? "text-purple-300" : "text-rose-300";

                const handleSetCustom = (val) => {
                    setIsCustom(val);
                    if(val && !fecha) setFecha(obtenerFechaHoyLocal());
                    if(val && !hora) setHora(obtenerHoraExacta());
                    if(!val) setIsCapsula(false);
                };

                return (
                    <div className="flex flex-col gap-2 w-full mt-2">
                        <div className="flex gap-2">
                            <button type="button" onClick={() => handleSetCustom(false)} className={`flex-1 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors ${!isCustom ? btnColor + ' text-white border' : 'bg-black/40 text-gray-400 border border-white/10 hover:bg-white/5'}`}>Momento Actual</button>
                            <button type="button" onClick={() => handleSetCustom(true)} className={`flex-1 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors ${isCustom ? btnColor + ' text-white border' : 'bg-black/40 text-gray-400 border border-white/10 hover:bg-white/5'}`}>Elegir Fecha Exacta</button>
                        </div>
                        {isCustom && (
                            <div className="flex flex-col gap-3 animate-in mt-1">
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="date" required value={fecha} onChange={e=>setFecha(e.target.value)} className={`p-3 bg-black/40 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} />
                                    <input type="time" required value={hora} onChange={e=>setHora(e.target.value)} className={`p-3 bg-black/40 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} />
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer bg-black/30 p-3 rounded-xl border border-white/5">
                                    <input type="checkbox" checked={isCapsula} onChange={e=>setIsCapsula(e.target.checked)} className={`w-4 h-4 accent-${colorTheme}-500 bg-black/50 border-white/20`} />
                                    <span className={`text-[10px] uppercase tracking-widest font-bold ${textColor} flex items-center gap-1`}><LockIcon size={12}/> Ocultar hasta esta fecha (Cápsula del Tiempo)</span>
                                </label>
                            </div>
                        )}
                    </div>
                );
            };

            const [stars] = useState(() => Array.from({ length: 60 }).map((_, i) => ({
                id: i, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
                animationDuration: `${2 + Math.random() * 4}s`, animationDelay: `${Math.random() * 5}s`
            })));

            const renderEditModal = () => {
                if (!editModal.show) return null;
                const isSoyinModal = user?.email === CORREO_SOYIN;
                const focusColor = isSoyinModal ? 'focus:border-purple-500' : 'focus:border-rose-500';
                const isRutina = editModal.coleccion === 'rutinas';
                const isCalendario = editModal.coleccion === 'calendario';

                return (
                    <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-md animate-in">
                        <div className={`border p-6 md:p-8 rounded-3xl w-full max-w-md shadow-2xl relative ${isSoyinModal ? 'bg-[#0f0a1c] border-purple-500/30 shadow-[0_0_40px_rgba(168,85,247,0.2)]' : 'bg-[#1a0a0f] border-rose-500/30 shadow-[0_0_40px_rgba(225,29,72,0.2)]'}`}>
                            <h3 className={`font-name text-3xl mb-4 ${isSoyinModal ? 'text-purple-300' : 'text-rose-400'}`}>Editar Recuerdo</h3>
                            
                            {isRutina || isCalendario ? (
                                <>
                                    <label className="text-[10px] text-gray-400 uppercase tracking-widest mb-1 block">Título</label>
                                    <input type="text" value={editModal.titulo} onChange={e=>setEditModal({...editModal, titulo: e.target.value})} className={`w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white mb-4 outline-none text-sm ${focusColor}`} />
                                </>
                            ) : null}

                            {!isRutina && !isCalendario ? (
                                <textarea value={editModal.texto} onChange={e=>setEditModal({...editModal, texto: e.target.value})} className={`w-full h-32 bg-black/50 border border-white/10 rounded-xl p-4 text-white mb-4 outline-none text-sm ${focusColor}`}></textarea>
                            ) : null}

                            {isCalendario ? (
                                <>
                                    <label className="text-[10px] text-gray-400 uppercase tracking-widest mb-1 block">Nota / Descripción</label>
                                    <textarea value={editModal.nota} onChange={e=>setEditModal({...editModal, nota: e.target.value})} className={`w-full h-20 bg-black/50 border border-white/10 rounded-xl p-3 text-white mb-4 outline-none text-sm ${focusColor}`}></textarea>
                                </>
                            ) : null}

                            <label className="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block">
                                {isRutina ? 'Editar Horario y Fecha' : 'Editar Fecha y Hora'}
                            </label>
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <input type="date" value={editModal.fecha} onChange={e=>setEditModal({...editModal, fecha: e.target.value})} className={`p-3 bg-black/50 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} required={!isRutina}/>
                                <div className="flex gap-2">
                                    <input type="time" value={editModal.hora} onChange={e=>setEditModal({...editModal, hora: e.target.value})} className={`w-full p-3 bg-black/50 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} required/>
                                    {(isRutina || isCalendario) && (
                                        <input type="time" value={editModal.horaFin} onChange={e=>setEditModal({...editModal, horaFin: e.target.value})} className={`w-full p-3 bg-black/50 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} placeholder="Fin" title="Hora de fin" />
                                    )}
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={guardarEdicion} className={`flex-1 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all shadow-lg ${isSoyinModal ? 'bg-purple-600 hover:bg-purple-700' : 'bg-rose-600 hover:bg-rose-700'}`}>Guardar</button>
                                <button onClick={()=>setEditModal({show:false, coleccion:'', id:'', texto:'', fecha:'', hora:'', titulo:'', horaFin:'', nota:''})} className="flex-1 bg-white/10 hover:bg-white/20 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all border border-white/10">Cancelar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderChangePassModal = () => {
                if (!showChangePassModal) return null;
                const isSoyinModal = user?.email === CORREO_SOYIN;
                const focusColor = isSoyinModal ? 'focus:border-purple-500' : 'focus:border-rose-500';
                const themeBtn = isSoyinModal ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20';
                const textColor = isSoyinModal ? 'text-purple-300' : 'text-rose-400';

                return (
                    <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-md animate-in">
                        <form onSubmit={cambiarPasswordModal} className={`border p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-2xl relative bg-[#0a0a0f] ${isSoyinModal ? 'border-purple-500/30 shadow-[0_0_40px_rgba(168,85,247,0.2)]' : 'border-rose-500/30 shadow-[0_0_40px_rgba(225,29,72,0.2)]'}`}>
                            <h3 className={`font-name text-3xl mb-2 text-center ${textColor}`}>Cambiar Contraseña</h3>
                            <p className="text-[10px] text-gray-400 text-center uppercase tracking-widest mb-6 border-b border-white/10 pb-4">Ingresa tu nueva clave de acceso</p>
                            
                            <div className="space-y-4 mb-6">
                                <div className="relative">
                                    <input type={showPassToggle ? "text" : "password"} placeholder="Nueva Contraseña" required className={`w-full p-3 bg-black/50 border border-white/10 rounded-xl text-sm text-white outline-none ${focusColor}`} value={nuevaPass} onChange={e=>setNuevaPass(e.target.value)} />
                                    <button type="button" onClick={()=>setShowPassToggle(!showPassToggle)} className="absolute right-3 top-3.5 text-gray-500 hover:text-white transition-colors">
                                        {showPassToggle ? <EyeOffIcon size={16}/> : <EyeIcon size={16}/>}
                                    </button>
                                </div>
                                <input type={showPassToggle ? "text" : "password"} placeholder="Confirmar Contraseña" required className={`w-full p-3 bg-black/50 border border-white/10 rounded-xl text-sm text-white outline-none ${focusColor}`} value={confPass} onChange={e=>setConfPass(e.target.value)} />
                            </div>

                            <div className="flex gap-3">
                                <button type="submit" className={`flex-1 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all shadow-lg ${themeBtn}`}>Actualizar</button>
                                <button type="button" onClick={() => {setShowChangePassModal(false); setNuevaPass(""); setConfPass("");}} className="flex-1 bg-white/10 hover:bg-white/20 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all border border-white/10">Cancelar</button>
                            </div>
                        </form>
                    </div>
                );
            };

            const renderUiAlert = () => {
                if (!uiAlert.show) return null;
                return (
                    <div className="fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4 backdrop-blur-md animate-in">
                        <div className="bg-[#1a0a0f] border border-rose-500/30 p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-[0_0_40px_rgba(225,29,72,0.2)] text-center flex flex-col items-center relative">
                            <h3 className="font-name text-3xl text-rose-400 mb-3">{uiAlert.title}</h3>
                            <p className="text-sm text-gray-300 mb-8 leading-relaxed font-body">{uiAlert.message}</p>
                            <div className="flex gap-4 w-full">
                                {uiAlert.isConfirm && (
                                    <button onClick={() => setUiAlert({ ...uiAlert, show: false })} className="flex-1 bg-white/5 hover:bg-white/10 text-gray-400 p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all border border-white/10">Cancelar</button>
                                )}
                                <button onClick={() => {
                                    if (uiAlert.isConfirm && uiAlert.onConfirm) uiAlert.onConfirm();
                                    setUiAlert({ ...uiAlert, show: false });
                                }} className={`flex-1 bg-rose-600 hover:bg-rose-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all shadow-lg ${!uiAlert.isConfirm ? 'w-full' : ''}`}>Aceptar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderRutinaAlarmaModal = () => {
                if (!rutinaActivaModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-xl animate-in">
                        <div className="border border-yellow-500/50 bg-[#1a160a] p-8 rounded-[3rem] w-full max-w-sm text-center shadow-[0_0_80px_rgba(234,179,8,0.3)] animate-alarm">
                            <div className="flex justify-center mb-6"><BellIcon size={60} className="text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]"/></div>
                            <h2 className="font-name text-4xl text-yellow-300 mb-2">¡Es Hora!</h2>
                            <p className="text-[10px] text-yellow-500/60 uppercase tracking-widest font-bold mb-6">Recordatorio de Rutina Privada</p>
                            <p className="text-xl md:text-2xl text-yellow-100 font-body mb-8">"{rutinaActivaModal.titulo}"</p>
                            <button onClick={cerrarAlarma} className="w-full bg-yellow-500 hover:bg-yellow-600 text-[#020205] p-4 rounded-2xl text-sm uppercase tracking-[0.2em] font-bold transition-all shadow-lg">Entendido</button>
                        </div>
                    </div>
                );
            };

            if (showLogin) {
                if (!user || (loginTarget === 'anthony' && !isAnthony) || (loginTarget === 'soyin' && !isSoyin)) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4 relative z-50 bg-[#020205]">
                            <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                                <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                            </div>
                            
                            <div className="glass-panel p-8 rounded-3xl w-full max-w-md min-h-[420px] flex flex-col justify-center relative z-10 shadow-[0_0_40px_rgba(0,0,0,0.5)] transition-all duration-500">
                                {isResettingPassword ? (
                                    <form key="reset" onSubmit={handleResetPassword} className="flex flex-col gap-5 animate-in">
                                        <h2 className={`font-name text-3xl text-center mb-2 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>Recuperar Contraseña</h2>
                                        <p className="text-[10px] text-gray-300 text-center uppercase tracking-widest mb-2">Ingresa tu correo para recibir el enlace seguro</p>
                                        <input type="email" placeholder="Correo electrónico" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={resetEmail} onChange={e => setResetEmail(e.target.value)} />
                                        <button type="submit" className={`mt-4 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Enviar enlace</button>
                                        <button type="button" onClick={() => setIsResettingPassword(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver atrás</button>
                                    </form>
                                ) : (
                                    <form key="login" onSubmit={handleLogin} className="flex flex-col gap-5 animate-in">
                                        <h2 className={`font-name text-4xl text-center mb-4 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>
                                            {loginTarget === 'soyin' ? 'Acceso Soyin' : 'Acceso Anthony'}
                                        </h2>
                                        
                                        {loginError && (
                                            <div className="bg-red-900/20 border border-red-500/30 p-4 rounded-xl text-center animate-in mb-2 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                                <p className="text-red-300 text-xs leading-relaxed">{loginError}</p>
                                                <button type="button" onClick={() => {setIsResettingPassword(true); setResetEmail(email); setLoginError("");}} className="text-white text-[10px] uppercase tracking-widest mt-3 underline hover:text-red-300 transition-colors font-bold">
                                                    Restablecer Contraseña Aquí
                                                </button>
                                            </div>
                                        )}

                                        <input type="email" placeholder="Correo" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={email} onChange={e => setEmail(e.target.value)} />
                                        <div className="flex flex-col">
                                            <div className="relative">
                                                <input type={showPass ? "text" : "password"} required placeholder="Contraseña" className={`w-full p-3 bg-black/50 border border-white/10 rounded-lg outline-none pr-10 ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={password} onChange={e => setPassword(e.target.value)} />
                                                <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute right-3 top-3.5 text-gray-400 hover:text-white transition-colors">
                                                    {showPass ? <EyeOffIcon size={18}/> : <EyeIcon size={18}/>}
                                                </button>
                                            </div>
                                            <button type="button" onClick={() => {setIsResettingPassword(true); setResetEmail(email);}} className="text-[10px] text-gray-400 hover:text-white uppercase tracking-widest transition-colors text-right mt-3">¿Olvidaste tu contraseña?</button>
                                        </div>
                                        <button type="submit" className={`mt-2 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Entrar</button>
                                        <button type="button" onClick={() => setShowLogin(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver al rincón</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    );
                }

                // PANEL ANTHONY MÁSTER
                if (isAnthony) {
                    return (
                        <div className="min-h-screen p-4 md:p-8 font-body bg-[#020205] relative z-50">
                            {renderUiAlert()}
                            {renderEditModal()}
                            {renderChangePassModal()}
                            {notaActiva && <ModalNotas coleccion={notaActiva.coleccion} docId={notaActiva.id} currentUser={currentUserName} onClose={() => setNotaActiva(null)} showAlert={showAlert} showConfirm={showConfirm} />}
                            
                            <div className="max-w-6xl mx-auto glass-panel p-6 md:p-8 rounded-3xl animate-in">
                                <div className="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-white/10 pb-6">
                                    <h2 className="font-name text-4xl text-rose-300">Panel Máster</h2>
                                    <div className="flex flex-wrap gap-3 items-center bg-black/20 p-2 px-4 rounded-2xl border border-white/5">
                                        <button onClick={() => setShowChangePassModal(true)} className="text-[10px] text-gray-300 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 uppercase tracking-widest transition-colors flex items-center gap-2">
                                            <LockIcon size={12}/> Cambiar Clave
                                        </button>
                                        <div className="w-[1px] h-6 bg-white/10 mx-1"></div>
                                        <button onClick={() => setShowLogin(false)} className="text-[10px] text-rose-300 border border-rose-500/30 px-4 py-2 rounded-full hover:bg-white/5 uppercase tracking-widest transition-colors">Cerrar Panel</button>
                                        <button onClick={cerrarSesion} className="text-[10px] text-gray-400 border border-white/10 hover:text-white px-4 py-2 rounded-full uppercase tracking-widest transition-colors">Salir</button>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-r from-rose-900/20 to-black/20 p-5 rounded-2xl border border-rose-500/30 flex items-center gap-5 shadow-[0_0_30px_rgba(225,29,72,0.1)] mb-8">
                                    <div className="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-white shadow-lg border-2 border-rose-400/50"><UserIcon size={32}/></div>
                                    <div>
                                        <h3 className="text-rose-100 font-bold font-name text-3xl mb-1">{datosPersonales.anthony.nombre}</h3>
                                        <p className="text-[10px] text-rose-300/60 tracking-widest uppercase font-bold flex items-center gap-2">
                                            28 de Octubre, 2003 <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span> {calcularEdad(datosPersonales.anthony.fechaNac)} Años de edad
                                        </p>
                                    </div>
                                </div>

                                <div className="flex gap-2 mb-6 border-b border-white/10 pb-4 overflow-x-auto hide-scrollbar">
                                    <button onClick={()=>setAdminTabAnth('publicar')} className={`px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all whitespace-nowrap ${adminTabAnth === 'publicar' ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}>✍️ Publicar al Mundo</button>
                                    <button onClick={()=>setAdminTabAnth('privado')} className={`px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all whitespace-nowrap flex items-center gap-2 ${adminTabAnth === 'privado' ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]' : 'bg-white/5 text-rose-300/70 border border-rose-500/20 hover:bg-rose-900/20'}`}><LockIcon size={14}/> Mi Espacio Secreto</button>
                                    <button onClick={()=>setAdminTabAnth('calendario')} className={`px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all whitespace-nowrap ${adminTabAnth === 'calendario' ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}>📅 Calendario Compartido</button>
                                    <button onClick={()=>setAdminTabAnth('rutinas')} className={`px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all whitespace-nowrap ${adminTabAnth === 'rutinas' ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}>⏰ Mis Rutinas</button>
                                    <button onClick={()=>setAdminTabAnth('ajustes')} className={`px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all whitespace-nowrap ${adminTabAnth === 'ajustes' ? 'bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}>⚙️ Ajustes Base</button>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="space-y-6">
                                        {adminTabAnth === 'publicar' && (
                                            <>
                                                <form onSubmit={publicarMensajeAnthony} className="bg-black/20 p-6 rounded-2xl border border-white/5 flex flex-col gap-4 shadow-lg">
                                                    <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center justify-between">
                                                        <span>Agregar Pensamiento Compartido</span>
                                                    </h3>
                                                    <select className="p-3 bg-black/30 border border-white/10 rounded-xl text-rose-300 outline-none text-sm focus:border-rose-500 cursor-pointer" value={tipoMensaje} onChange={e=>setTipoMensaje(e.target.value)}>
                                                        <option value="latidos">Latido (Mensaje Corto)</option>
                                                        <option value="diario">Entrada del Diario (Historia Larga)</option>
                                                    </select>
                                                    <textarea required placeholder="Escribe aquí tu pensamiento para ella..." className="p-4 bg-black/30 border border-white/10 rounded-xl h-24 outline-none focus:border-rose-500 text-sm" value={nuevoTexto} onChange={e => setNuevoTexto(e.target.value)}></textarea>
                                                    {renderDateSelectorExt(customDateAnth, setCustomDateAnth, nuevaFecha, setNuevaFecha, nuevaHora, setNuevaHora, isCapsulaAnth, setIsCapsulaAnth, "rose")}
                                                    <button type="submit" className="bg-rose-600 hover:bg-rose-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(225,29,72,0.3)] mt-2">Publicar Mágicamente</button>
                                                </form>
                                                <form onSubmit={guardarBienvenidaAnthony} className="bg-black/20 p-5 rounded-2xl border border-white/5 flex flex-col gap-3 shadow-lg">
                                                    <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-[0.2em]">Tu carta en la Entrada principal</h3>
                                                    <textarea required placeholder="Ej: Mi amada Flor Soyin. Eres la dueña de mis latidos..." className="p-3 bg-black/30 border border-white/10 rounded-xl text-sm outline-none focus:border-rose-500" value={formBienvenidaAnthony} onChange={e=>setFormBienvenidaAnthony(e.target.value)} rows="3"></textarea>
                                                    {renderDateSelectorExt(customCartaAnth, setCustomCartaAnth, fechaCartaAnth, setFechaCartaAnth, horaCartaAnth, setHoraCartaAnth, isCapsulaCartaAnth, setIsCapsulaCartaAnth, "rose")}
                                                    <div className="flex gap-2 mt-1">
                                                        <button type="submit" className="flex-1 bg-rose-900/50 hover:bg-rose-800 text-rose-200 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors border border-rose-500/30">Actualizar Carta</button>
                                                        <button type="button" onClick={borrarBienvenidaAnthony} className="bg-black/40 hover:bg-red-900/40 text-red-400 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors border border-red-500/30">Borrar Carta</button>
                                                    </div>
                                                </form>

                                                {/* Enlaces Rápidos (Nuevo) */}
                                                <div className="flex flex-col gap-3 pt-6 border-t border-white/5">
                                                    <button type="button" onClick={() => {setShowLogin(false); setVistaActual('historial_anthony');}} className="w-full bg-white/5 hover:bg-white/10 text-rose-300 p-3 rounded-xl text-[10px] uppercase tracking-widest font-bold transition-all border border-rose-500/20 shadow-lg text-left pl-6 relative">
                                                        <div className="absolute left-0 top-0 bottom-0 w-2 bg-rose-500 rounded-l-xl"></div>
                                                        Ir a Mi Historial de Latidos Público
                                                    </button>
                                                    <button type="button" onClick={() => {setShowLogin(false); setVistaActual('diario');}} className="w-full bg-white/5 hover:bg-white/10 text-rose-300 p-3 rounded-xl text-[10px] uppercase tracking-widest font-bold transition-all border border-rose-500/20 shadow-lg text-left pl-6 relative">
                                                        <div className="absolute left-0 top-0 bottom-0 w-2 bg-rose-500 rounded-l-xl"></div>
                                                        Ir a Nuestro Diario Compartido
                                                    </button>
                                                </div>
                                            </>
                                        )}

                                        {adminTabAnth === 'privado' && (
                                            <form onSubmit={publicarDiarioPrivado} className="bg-rose-950/10 p-6 rounded-2xl border border-rose-500/30 flex flex-col gap-4 shadow-[0_0_30px_rgba(225,29,72,0.05)]">
                                                <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><LockIcon size={14}/> Escribir en tu Diario Secreto</h3>
                                                <p className="text-[10px] text-gray-400 mb-2">Este espacio es 100% privado. Flor nunca podrá leer lo que escribas aquí.</p>
                                                <textarea required placeholder="¿Cómo te sientes hoy, en el fondo de tu corazón?" className="p-4 bg-black/40 border border-rose-500/20 rounded-xl h-40 outline-none focus:border-rose-500 text-sm text-rose-50" value={nuevoTextoPrivado} onChange={e => setNuevoTextoPrivado(e.target.value)}></textarea>
                                                <button type="submit" className="bg-rose-700 hover:bg-rose-600 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(225,29,72,0.4)] mt-2">Guardar Secreto</button>
                                            </form>
                                        )}

                                        {adminTabAnth === 'calendario' && (
                                            <form onSubmit={(e)=>agregarEvento(e, 'anthony')} className="bg-black/20 p-6 rounded-2xl border border-yellow-500/20 flex flex-col gap-4 shadow-lg">
                                                <h3 className="text-yellow-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><CalendarIcon size={14}/> Agendar Fecha Pública</h3>
                                                <p className="text-[10px] text-gray-400 mb-2">Aparecerá en el calendario compartido de la aplicación.</p>
                                                <input type="text" required placeholder="Título del evento (Ej. Nuestro Aniversario)" className="p-3 bg-black/30 border border-white/10 rounded-xl outline-none text-sm focus:border-yellow-500" value={nuevoEventoTitulo} onChange={e=>setNuevoEventoTitulo(e.target.value)} />
                                                <input type="date" required className="p-3 bg-black/30 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-white" value={nuevoEventoFecha} onChange={e=>setNuevoEventoFecha(e.target.value)} />
                                                
                                                <div className="flex gap-2">
                                                    <input type="time" className="flex-1 p-3 bg-black/30 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-white" value={nuevoEventoHoraInicio} onChange={e=>setNuevoEventoHoraInicio(e.target.value)} title="Hora Inicio (Opcional)" />
                                                    <span className="text-[10px] uppercase text-gray-500 flex items-center">hasta</span>
                                                    <input type="time" className="flex-1 p-3 bg-black/30 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-white" value={nuevoEventoHoraFin} onChange={e=>setNuevoEventoHoraFin(e.target.value)} title="Hora Fin (Opcional)" />
                                                </div>

                                                <textarea placeholder="Una nota especial para este día... (Opcional)" className="p-3 bg-black/30 border border-white/10 rounded-xl h-20 outline-none focus:border-yellow-500 text-sm" value={nuevoEventoNota} onChange={e=>setNuevoEventoNota(e.target.value)}></textarea>
                                                <button type="submit" className="bg-yellow-600 hover:bg-yellow-700 text-black p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(202,138,4,0.3)] mt-2">Guardar en Calendario</button>
                                            </form>
                                        )}

                                        {adminTabAnth === 'rutinas' && (
                                            <>
                                                <MiniCalendarioVisual eventos={misRutinasOrdenadas} selectedDate={nuevaRutinaFecha} onSelectDate={setNuevaRutinaFecha} theme="rose" />
                                                <form onSubmit={(e)=>agregarRutina(e, 'anthony')} className="bg-black/20 p-6 rounded-2xl border border-blue-500/20 flex flex-col gap-4 shadow-lg">
                                                    <h3 className="text-blue-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><BellIcon size={14}/> Programar Rutina Diaria Personal</h3>
                                                    <p className="text-[10px] text-gray-400 mb-2">Solo tú verás tus rutinas y solo te sonarán a ti.</p>
