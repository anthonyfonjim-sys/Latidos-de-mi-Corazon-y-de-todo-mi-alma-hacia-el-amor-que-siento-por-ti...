                                                        <VistaPreviaNotas item={ev} colorTheme="purple" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'preguntas' && (
                                            <div className="animate-in">
                                                <h3 className="text-purple-300 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><PuzzleIcon size={16}/> Preguntas Enviadas</h3>
                                                {preguntas.filter(p => p.autor === 'soyin').length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">No has creado preguntas.</p>}
                                                {preguntas.filter(p => p.autor === 'soyin').map(p => (
                                                    <div key={p.id} className="p-5 bg-black/50 mb-3 rounded-2xl border border-purple-500/20 relative group">
                                                        <p className="text-sm text-purple-100 font-bold mb-2">"{p.pregunta}"</p>
                                                        <div className="flex justify-between items-center text-[9px] text-purple-300/50 uppercase tracking-widest">
                                                            <span>Activación: {formatearFechaSimple(p.fecha)}</span>
                                                            <span className={p.revelado ? 'text-green-400' : 'text-amber-400'}>{p.revelado ? 'Revelada' : 'En proceso'}</span>
                                                        </div>
                                                        <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                                                            <button onClick={()=>abrirEditor('preguntas', p)} className="text-blue-500 hover:text-blue-400 p-1 bg-black/50 rounded"><EditIcon size={14}/></button>
                                                            <button onClick={()=>eliminarDocumento('preguntas', p.id, "¿Borrar esta pregunta?")} className="text-red-500 hover:text-red-400 p-1 bg-black/50 rounded"><TrashIcon size={14}/></button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'rutinas' && (
                                            <div className="animate-in">
                                                <h3 className="text-blue-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><BellIcon size={16}/> Mis Rutinas Programadas</h3>
                                                {misRutinasOrdenadas.length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">No hay rutinas programadas.</p>}
                                                {misRutinasOrdenadas.map(rut => (
                                                    <div key={rut.id} className={`p-5 mb-3 rounded-xl border flex items-center justify-between transition-colors ${rut.activa ? 'bg-blue-900/30 border-blue-500/40' : 'bg-white/5 border-white/10 opacity-60'}`}>
                                                        <div>
                                                            <h4 className={`font-name text-2xl mb-1 ${rut.activa ? 'text-blue-300' : 'text-gray-400'}`}>{rut.titulo}</h4>
                                                            <div className="flex gap-2 items-center">
                                                                <p className="text-xs tracking-widest font-timer text-purple-100 bg-black/50 inline-block px-3 py-1 rounded-full">{rut.hora}</p>
                                                                {rut.horaFin && <p className="text-[10px] text-purple-300/50 font-bold uppercase tracking-widest">hasta {rut.horaFin}</p>}
                                                            </div>
                                                            {rut.fecha && <p className="text-[9px] text-blue-400/50 mt-2 uppercase tracking-widest border border-blue-500/20 bg-blue-900/20 px-2 py-1 inline-block rounded">Solo para: {formatearFechaSimple(rut.fecha)}</p>}
                                                            
                                                            <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'rutinas', id: rut.id }); }} className="text-[10px] text-purple-300/60 hover:text-purple-200 uppercase tracking-widest flex items-center gap-1 transition-colors mt-3">
                                                                <MessageCircleIcon size={12} /> Notas / Diario de Rutina
                                                                <IndicadorNuevaNota ultimaNota={rut.ultimaNota} />
                                                            </button>
                                                        </div>
                                                        <div className="flex flex-col gap-3 items-end">
                                                            <button onClick={()=>toggleRutina(rut.id, rut.activa)} className={`px-4 py-2 rounded-full text-[9px] uppercase tracking-widest font-bold shadow-lg ${rut.activa ? 'bg-blue-600 text-white' : 'bg-gray-600 text-gray-300'}`}>
                                                                {rut.activa ? 'Activa' : 'Pausada'}
                                                            </button>
                                                            <div className="flex gap-2 mt-2">
                                                                <button onClick={()=>abrirEditor('rutinas', rut)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={14}/></button>
                                                                <button onClick={()=>eliminarDocumento('rutinas', rut.id, "¿Borrar esta rutina?")} className="text-purple-400 hover:text-red-400 p-2"><TrashIcon size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
            }

            // VISTA PÚBLICA (Navegación general)
            return (
                <div className="min-h-screen flex flex-col items-center justify-center relative w-full overflow-x-hidden">
                    {renderUiAlert()}
                    {renderEditModal()}
                    {renderRutinaAlarmaModal()}
                    
                    {notaActiva && <ModalNotas coleccion={notaActiva.coleccion} docId={notaActiva.id} currentUser={currentUserName} onClose={() => setNotaActiva(null)} showAlert={showAlert} showConfirm={showConfirm} />}

                    {selectedDatePublic && (
                        <div className="fixed inset-0 bg-black/80 z-[150] flex items-center justify-center p-4 backdrop-blur-md animate-in" onClick={() => setSelectedDatePublic("")}>
                            <div className="bg-[#1a1a2e] border border-yellow-500/30 p-6 md:p-8 rounded-3xl w-full max-w-md shadow-[0_0_40px_rgba(250,204,21,0.2)] relative flex flex-col max-h-[80vh]" onClick={e=>e.stopPropagation()}>
                                <button onClick={() => setSelectedDatePublic("")} className="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/5 p-2 rounded-full transition-colors"><TrashIcon size={16} className="hidden" />✕</button>
                                <h3 className="font-name text-4xl text-yellow-400 mb-6 flex items-center gap-3"><CalendarIcon size={24}/> {formatearFechaSimple(selectedDatePublic)}</h3>
                                
                                {(() => {
                                    const eventosDia = eventosConTiempo.filter(e => e.fecha === selectedDatePublic);
                                    if (eventosDia.length === 0) {
                                        return (
                                            <div className="text-center py-10 flex flex-col items-center gap-4">
                                                <SparklesIcon size={40} className="text-yellow-500/30"/>
                                                <p className="text-gray-400 text-sm font-body">No hay eventos ni recuerdos para este día.</p>
                                                {user ? (
                                                    <button onClick={() => {
                                                        if (isAnthony) {
                                                            setAdminTabAnth('calendario');
                                                            setNuevoEventoFecha(selectedDatePublic);
                                                            setLoginTarget('anthony');
                                                            setShowLogin(true);
                                                        } else if (isSoyin) {
                                                            setAdminTabSoyin('calendario');
                                                            setNuevoEventoFecha(selectedDatePublic);
                                                            setLoginTarget('soyin');
                                                            setShowLogin(true);
                                                        } else {
                                                            setLoginTarget('anthony');
                                                            setShowLogin(true);
                                                        }
                                                        setSelectedDatePublic("");
                                                    }} className="mt-2 text-xs bg-yellow-600 hover:bg-yellow-700 text-black px-6 py-3 rounded-xl uppercase tracking-widest font-bold transition-all shadow-lg">
                                                        Ir al Panel a Crear Evento
                                                    </button>
                                                ) : (
                                                    <div className="flex flex-col gap-2 mt-2">
                                                        <p className="text-[10px] text-yellow-500/50 uppercase tracking-widest">Inicia sesión para agregar algo especial aquí.</p>
                                                        <div className="flex gap-2 justify-center mt-2">
                                                            <button onClick={() => { setSelectedDatePublic(""); abrirPanelLogin('anthony'); }} className="text-[9px] bg-white/5 border border-white/10 px-3 py-1.5 rounded-full hover:bg-white/10 text-rose-400 uppercase tracking-widest">Soy Anthony</button>
                                                            <button onClick={() => { setSelectedDatePublic(""); abrirPanelLogin('soyin'); }} className="text-[9px] bg-white/5 border border-white/10 px-3 py-1.5 rounded-full hover:bg-white/10 text-purple-400 uppercase tracking-widest">Soy Soyin</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    }
                                    return (
                                        <div className="space-y-4 overflow-y-auto hide-scrollbar flex-1 pr-2">
                                            {eventosDia.map(ev => (
                                                <div key={ev.id} className="bg-black/40 border border-yellow-500/20 p-5 rounded-2xl relative">
                                                    {ev.isDefault && <div className="absolute top-2 right-2 text-[8px] bg-yellow-600/20 text-yellow-500 px-2 py-1 rounded uppercase tracking-widest">Especial</div>}
                                                    <h4 className="font-name text-2xl text-yellow-200 mb-1">{ev.titulo}</h4>
                                                    {(ev.hora || ev.horaFin) && <p className="text-[10px] text-yellow-500/80 font-timer tracking-widest uppercase mb-3 bg-white/5 inline-block px-2 py-1 rounded">{ev.hora} {ev.horaFin ? `- ${ev.horaFin}` : ''}</p>}
                                                    {ev.nota && <p className="text-sm text-gray-300 italic border-l-2 border-yellow-500/30 pl-3 py-1">"{ev.nota}"</p>}
                                                    <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'calendario', id: ev.id }); setSelectedDatePublic(""); }} className="mt-4 text-[10px] text-gray-400 hover:text-white uppercase tracking-widest flex items-center gap-1 transition-colors bg-white/5 px-3 py-1.5 rounded-full w-max">
                                                        <MessageCircleIcon size={14} /> Abrir Notas del Evento
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* MODAL DE CARTA ABIERTA (DISEÑO ANTIGUO) */}
                    {cartaAbierta && (
                        <div className="fixed inset-0 bg-black/90 z-[300] flex items-center justify-center p-4 md:p-8 backdrop-blur-xl animate-in" onClick={() => setCartaAbierta(null)}>
                            <div className="parchment-sheet p-8 md:p-14 rounded-md shadow-[0_0_80px_rgba(255,255,255,0.1),inset_0_0_50px_rgba(139,69,19,0.2)] border border-[#d6c7b5] w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar relative" onClick={e=>e.stopPropagation()}>
                                <button onClick={() => setCartaAbierta(null)} className="absolute top-4 right-4 text-stone-500 hover:text-stone-800 transition-colors">✕</button>
                                
                                <div className="text-center mb-8 border-b border-[#d6c7b5] pb-6">
                                    <p className="text-[10px] text-stone-500 uppercase tracking-widest font-bold mb-2">Carta Abierta</p>
                                    <h2 className="font-name text-3xl md:text-5xl text-stone-800">Para cuando {cartaAbierta.emocion}</h2>
                                    <p className="text-xs text-stone-500 font-timer mt-3">{formatearFechaSimple(cartaAbierta.fecha)}</p>
                                </div>
                                
                                <div className="font-name text-2xl md:text-3xl text-stone-800 leading-relaxed whitespace-pre-wrap px-2 md:px-8">
                                    {cartaAbierta.texto}
                                </div>
                                
                                <div className="mt-12 pt-8 text-right px-2 md:px-8">
                                    <p className="text-sm text-stone-500 italic mb-2">Con todo mi amor,</p>
                                    <p className={`font-name text-4xl md:text-5xl ${cartaAbierta.autor === 'anthony' ? 'text-rose-900' : 'text-purple-900'}`}>
                                        {cartaAbierta.autor === 'anthony' ? 'Anthony' : 'Soyin'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    <audio ref={alarmAudioRef} src={alarmUrl || "https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"} loop />

                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(star => <div key={star.id} className="absolute bg-white rounded-full w-1 h-1 animate-twinkle" style={star} />)}
                    </div>
                    
                    {/* MENU DE NAVEGACIÓN SUPERIOR */}
                    {vistaActual !== 'portada' && (
                        <div className="fixed top-4 right-4 md:right-8 z-40 flex flex-col gap-2 items-end">
                            {vistaActual !== 'principal' ? (
                                <button onClick={() => setVistaActual('principal')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.08] hover:bg-white/[0.15] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-white backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                    <ArrowLeftIcon size={14}/> Volver al inicio
                                </button>
                            ) : (
                                <>
                                    <button onClick={() => setVistaActual('cartas')} className="flex items-center gap-2 px-5 py-2.5 bg-rose-900/30 hover:bg-rose-900/50 border border-rose-500/30 rounded-full text-[10px] font-timer tracking-widest uppercase text-rose-200 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <MailIcon size={14}/> Buzón de Cartas
                                    </button>
                                    <button onClick={() => setVistaActual('diario')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.08] hover:bg-white/[0.15] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-white backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <BookIcon size={14}/> Leer el diario
                                    </button>
                                    <button onClick={() => setVistaActual('preguntas')} className="flex items-center gap-2 px-5 py-2.5 bg-cyan-900/30 hover:bg-cyan-900/50 border border-cyan-500/30 rounded-full text-[10px] font-timer tracking-widest uppercase text-cyan-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <PuzzleIcon size={14}/> Conexión Diaria
                                    </button>
                                    <button onClick={() => setVistaActual('calendario')} className="flex items-center gap-2 px-5 py-2.5 bg-yellow-900/30 hover:bg-yellow-900/50 border border-yellow-500/30 rounded-full text-[10px] font-timer tracking-widest uppercase text-yellow-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <CalendarIcon size={14}/> Calendario Especial
                                    </button>
                                    <button onClick={() => setVistaActual('nuestro_mundo')} className="flex items-center gap-2 px-5 py-2.5 bg-emerald-900/30 hover:bg-emerald-900/50 border border-emerald-500/30 rounded-full text-[10px] font-timer tracking-widest uppercase text-emerald-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <GlobeIcon size={14}/> Nuestro Mundo
                                    </button>
                                    <button onClick={() => setVistaActual('portada')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.05] hover:bg-white/[0.1] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-gray-400 backdrop-blur-md transition-all shadow-lg hover:scale-105 mt-2">
                                        <ArrowLeftIcon size={14}/> Ver Portada
                                    </button>
                                </>
                            )}
                        </div>
                    )}

                    {/* VISTA 0: ENTRADA PRINCIPAL (PORTADA) */}
                    {vistaActual === 'portada' && (
                        <div className="z-20 flex flex-col items-center animate-in max-w-5xl px-4 py-12 text-center min-h-screen justify-center w-full relative">
                            {/* Brillos decorativos de fondo */}
                            <div className="absolute top-1/4 left-1/4 w-64 h-64 bg-rose-500/10 rounded-full blur-[100px] pointer-events-none"></div>
                            <div className="absolute bottom-1/4 right-1/4 w-64 h-64 bg-purple-500/10 rounded-full blur-[100px] pointer-events-none"></div>
                            
                            <div className="mb-16 mt-4 flex flex-col items-center">
                                <h2 className="font-name text-6xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-white to-purple-300 drop-shadow-[0_0_20px_rgba(255,255,255,0.5)] mb-2 flex items-center gap-3">
                                    Anthony <span className="font-cormorant italic text-amber-300 text-5xl md:text-6xl drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]">&</span> Soyin
                                </h2>
                                <p className="text-rose-200/80 tracking-[0.4em] uppercase text-xs md:text-sm font-bold border-b border-rose-500/30 pb-3 inline-block mt-2">Un amor sin tiempo</p>
                            </div>
                            
                            <div className="flex flex-col gap-12 font-body w-full">
                                {bienvenidaAnthony?.texto && (
                                    <ContenedorMagico color="text-rose-500">
                                        <div className={`relative glass-panel p-8 md:p-12 rounded-3xl w-full md:w-[90%] mx-auto transform rotate-[-1deg] group ${!esVisibleAlPublico(bienvenidaAnthony) && isAnthony ? 'opacity-70' : ''}`}>
                                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-[#020205] rounded-full p-2 border border-rose-500/30">
                                                <HeartIcon size={32} className="text-rose-500 drop-shadow-[0_0_15px_rgba(225,29,72,0.8)]" fill="currentColor"/>
                                            </div>
                                            
                                            {esVisibleAlPublico(bienvenidaAnthony) || isAnthony ? (
                                                <>
                                                    <SelectorReacciones coleccion="bienvenida" docId="anthony" reaccionesActuales={bienvenidaAnthony.reacciones} currentUser={currentUserName} showAlert={showAlert} />
                                                    {bienvenidaAnthony.esCapsula && <div className="absolute top-6 right-6 text-white/30" title="Cápsula del Tiempo"><LockIcon size={16}/></div>}
                                                    
                                                    <h3 className="font-name text-4xl text-rose-400 mb-6 text-left drop-shadow-md">Para mi amada Soyin...</h3>
                                                    <p className="font-body text-rose-50/90 text-lg md:text-2xl leading-relaxed italic text-left">"{bienvenidaAnthony.texto}"</p>
                                                    
                                                    <div className="mt-10 pt-6 border-t border-rose-500/20 flex flex-col md:flex-row justify-between items-end md:items-center gap-4 relative z-20">
                                                        <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'bienvenida', id: 'anthony' }); }} className="text-[10px] text-rose-300/70 hover:text-rose-200 uppercase tracking-widest flex items-center gap-2 transition-colors bg-rose-900/20 px-4 py-2 rounded-full border border-rose-500/20 shadow-lg">
                                                            <MessageCircleIcon size={14} /> Notas Compartidas
                                                            <IndicadorNuevaNota ultimaNota={bienvenidaAnthony.ultimaNota} />
                                                        </button>
                                                        <div className="text-right flex items-center gap-4">
                                                            <div className="flex gap-1">
                                                                {bienvenidaAnthony.reacciones && Object.values(bienvenidaAnthony.reacciones).map((emoji, i) => (
                                                                    <span key={i} className="text-xl drop-shadow-md">{emoji}</span>
                                                                ))}
                                                            </div>
                                                            <div className="text-right border-l border-white/10 pl-4">
                                                                <p className="font-name text-3xl text-rose-300">Anthony</p>
                                                                <span className="text-[9px] text-rose-200/50 font-timer tracking-widest uppercase block mt-1">
                                                                    {bienvenidaAnthony.fecha ? formatearFechaHora(bienvenidaAnthony.fecha, bienvenidaAnthony.hora) : formatearFechaHoraBaseDatos(bienvenidaAnthony.timestamp)}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="flex flex-col items-center justify-center p-12 text-center gap-5 opacity-80">
                                                    <LockIcon size={48} className="text-rose-500/50 drop-shadow-[0_0_15px_rgba(225,29,72,0.5)]" />
                                                    <h3 className="font-name text-4xl text-rose-300">Un mensaje secreto te aguarda...</h3>
                                                    <p className="text-xs text-rose-200/60 font-timer tracking-widest uppercase mt-2 bg-rose-900/20 px-4 py-2 rounded-full border border-rose-500/20">
                                                        Se revelará el {formatearFechaHora(bienvenidaAnthony.fecha, bienvenidaAnthony.hora)}
                                                    </p>
                                                </div>
                                            )}
                                        </div>
                                    </ContenedorMagico>
                                )}

                                {bienvenidaSoyin?.texto && (
                                    <ContenedorMagico color="text-purple-400">
                                        <div className={`relative glass-panel p-8 md:p-12 rounded-3xl w-full md:w-[90%] mx-auto transform rotate-[1deg] group ${!esVisibleAlPublico(bienvenidaSoyin) && isSoyin ? 'opacity-70' : ''}`}>
                                            <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-[#020205] rounded-full p-2 border border-purple-500/30">
                                                <HeartIcon size={32} className="text-purple-500 drop-shadow-[0_0_15px_rgba(168,85,247,0.8)]" fill="currentColor"/>
                                            </div>
                                            
                                            {esVisibleAlPublico(bienvenidaSoyin) || isSoyin ? (
                                                <>
                                                    <SelectorReacciones coleccion="bienvenida" docId="soyin" reaccionesActuales={bienvenidaSoyin.reacciones} currentUser={currentUserName} showAlert={showAlert} />
                                                    {bienvenidaSoyin.esCapsula && <div className="absolute top-6 right-6 text-white/30" title="Cápsula del Tiempo"><LockIcon size={16}/></div>}
                                                    
                                                    <h3 className="font-name text-4xl text-purple-300 mb-6 text-left drop-shadow-md">Para ti, mi amor...</h3>
                                                    <p className="font-body text-purple-50/90 text-lg md:text-2xl leading-relaxed italic text-left">"{bienvenidaSoyin.texto}"</p>
                                                    
                                                    <div className="mt-10 pt-6 border-t border-purple-500/20 flex flex-col md:flex-row justify-between items-end md:items-center gap-4 relative z-20">
                                                        <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'bienvenida', id: 'soyin' }); }} className="text-[10px] text-purple-300/70 hover:text-purple-200 uppercase tracking-widest flex items-center gap-2 transition-colors bg-purple-900/20 px-4 py-2 rounded-full border border-purple-500/20 shadow-lg">
                                                            <MessageCircleIcon size={14} /> Notas Compartidas
                                                            <IndicadorNuevaNota ultimaNota={bienvenidaSoyin.ultimaNota} />
                                                        </button>
                                                        <div className="text-right flex items-center gap-4">
                                                            <div className="flex gap-1">
                                                                {bienvenidaSoyin.reacciones && Object.values(bienvenidaSoyin.reacciones).map((emoji, i) => (
                                                                    <span key={i} className="text-xl drop-shadow-md">{emoji}</span>
                                                                ))}
                                                            </div>
                                                            <div className="text-right border-l border-white/10 pl-4">
                                                                <p className="font-name text-3xl text-purple-300">Soyin</p>
                                                                <span className="text-[9px] text-purple-200/50 font-timer tracking-widest uppercase block mt-1">
                                                                    {bienvenidaSoyin.fecha ? formatearFechaHora(bienvenidaSoyin.fecha, bienvenidaSoyin.hora) : formatearFechaHoraBaseDatos(bienvenidaSoyin.timestamp)}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="flex flex-col items-center justify-center p-12 text-center gap-5 opacity-80">
                                                    <LockIcon size={48} className="text-purple-500/50 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]" />
                                                    <h3 className="font-name text-4xl text-purple-300">Un mensaje secreto te aguarda...</h3>
                                                    <p className="text-xs text-purple-200/60 font-timer tracking-widest uppercase mt-2 bg-purple-900/20 px-4 py-2 rounded-full border border-purple-500/20">

                                                                    {currentUserKey === 'soyin' ? (
                                                                        <>
                                                                            <input type="text" value={cp.respuesta || ''} onChange={e=>guardarCustomCuidame(cp.id, e.target.value, cuidameSoyin.customPrompts)} className="w-full bg-black/40 border border-purple-500/20 p-4 rounded-xl mt-2 text-sm text-purple-100 outline-none focus:border-purple-400 transition-colors" placeholder="Escribe tu respuesta..." />
                                                                            <button onClick={() => eliminarCustomCuidame(cp.id, cuidameSoyin.customPrompts)} className="absolute right-3 top-9 text-red-500/50 hover:text-red-400 transition-colors opacity-0 group-hover:opacity-100"><TrashIcon size={14}/></button>
                                                                        </>
                                                                    ) : (
                                                                        <p className="bg-black/30 p-4 rounded-xl mt-2 text-sm text-purple-50 border border-purple-500/10">{cp.respuesta || <span className="italic text-gray-500">Aún no ha escrito nada.</span>}</p>
                                                                    )}
                                                                </div>
                                                            ))}
                                                            
                                                            {currentUserKey === 'soyin' && (
                                                                <form onSubmit={agregarPreguntaCuidame} className="mt-4 bg-purple-950/30 p-4 rounded-xl border border-purple-500/30">
                                                                    <label className="text-[9px] uppercase tracking-widest text-purple-400 font-bold mb-2 block"><SparklesIcon size={12} className="inline mr-1"/> Añadir mi propia pregunta</label>
                                                                    <div className="flex gap-2">
                                                                        <input type="text" value={nuevoCuidamePrompt} onChange={e=>setNuevoCuidamePrompt(e.target.value)} placeholder="Ej. Cuando estoy cansada..." className="flex-1 bg-black/50 border border-purple-500/20 p-2 rounded-lg text-xs text-purple-100 outline-none focus:border-purple-400" />
                                                                        <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white px-3 rounded-lg text-[9px] uppercase font-bold shadow-md">Añadir</button>
                                                                    </div>
                                                                </form>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {tabMundo === 'diccionario' && (
                                            <div className="animate-in max-w-3xl mx-auto">
                                                <p className="text-center text-yellow-100/70 text-base md:text-lg italic font-cormorant mb-10">"El idioma que solo nosotros dos entendemos."</p>
                                                
                                                <div className="grid md:grid-cols-2 gap-6 mb-10">
                                                    {diccionario.map(d => (
                                                        <div key={d.id} className="bg-black/40 border border-yellow-500/20 p-6 rounded-3xl relative group hover:border-yellow-500/40 transition-colors shadow-lg">
                                                            <h4 className="font-name text-3xl text-yellow-300 mb-3">"{d.palabra}"</h4>
                                                            <p className="text-base text-yellow-50/90 leading-relaxed">Significa: <br/><span className="italic font-body">"{d.significado}"</span></p>
                                                            <span className="text-[9px] text-gray-500 uppercase tracking-widest mt-5 block border-t border-white/5 pt-3">Añadido por {d.autor === 'anthony' ? 'Anthony' : 'Soyin'}</span>
                                                            {currentUserKey && (
                                                                <button onClick={() => eliminarDocumento('diccionario', d.id)} className="absolute top-5 right-5 text-red-500/0 group-hover:text-red-500/50 hover:!text-red-400 transition-colors"><TrashIcon size={16}/></button>
                                                            )}
                                                        </div>
                                                    ))}
                                                    {diccionario.length === 0 && <p className="text-gray-500 italic text-center col-span-2 py-8">Añadan sus apodos y palabras secretas aquí.</p>}
                                                </div>

                                                {currentUserKey && (
                                                    <form onSubmit={agregarDiccionario} className="bg-yellow-900/10 border border-yellow-500/30 p-8 rounded-3xl flex flex-col gap-4 shadow-xl">
                                                        <h4 className="text-[10px] font-bold uppercase tracking-widest text-yellow-500/80 mb-2 flex items-center gap-2"><SparklesIcon size={14}/> Añadir nueva palabra al diccionario</h4>
                                                        <input type="text" required value={nuevaPalabra} onChange={e=>setNuevaPalabra(e.target.value)} placeholder="Palabra o Apodo (Ej. Mi niña, Nexus...)" className="bg-black/60 border border-yellow-500/30 p-4 rounded-xl outline-none text-yellow-50 text-sm focus:border-yellow-400" />
                                                        <textarea required value={nuevoSignificado} onChange={e=>setNuevoSignificado(e.target.value)} placeholder="¿Qué significa exactamente para nosotros?" className="bg-black/60 border border-yellow-500/30 p-4 rounded-xl outline-none text-yellow-50 text-sm focus:border-yellow-400 h-24"></textarea>
                                                        <button type="submit" className="bg-yellow-600 hover:bg-yellow-700 text-black px-6 py-4 rounded-xl text-xs uppercase tracking-widest font-bold shadow-lg transition-colors mt-2">Guardar en el Diccionario</button>
                                                    </form>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* REPRODUCTOR CENTRAL INFERIOR */}
                            <div className="mt-20 mb-10 flex flex-col items-center pb-8 z-20 w-full relative">
                                <div className="absolute w-[200vw] h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent top-10"></div>
                                <div className="flex items-center gap-6 z-10 bg-black/40 backdrop-blur-xl p-4 rounded-[3rem] border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                                    <button onClick={prevTrack} className="p-3 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="Canción anterior">
                                        <SkipBackIcon size={20} />
                                    </button>
                                    <button onClick={toggleMusic} className={`w-20 h-20 rounded-full flex items-center justify-center transition-all duration-500 border-2 ${isPlaying ? 'bg-gradient-to-tr from-rose-600 to-purple-600 border-white/50 scale-110 shadow-[0_0_30px_rgba(255,255,255,0.4)]' : 'bg-white/5 border-white/20 hover:border-white/40 hover:scale-105'}`}>
                                        {isPlaying ? <PauseIcon size={28} className="text-white drop-shadow-md"/> : <PlayIcon size={28} className="ml-1 text-white drop-shadow-md" />}
                                    </button>
                                    <button onClick={nextTrack} className="p-3 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="Siguiente canción">
                                        <SkipForwardIcon size={20} />
                                    </button>
                                </div>
                                <div className="mt-6 flex flex-col items-center text-center max-w-sm px-4">
                                    <p className="text-[9px] uppercase tracking-[0.4em] text-gray-400 font-bold mb-1 flex items-center gap-2">
                                        <MusicIcon size={10} /> {isPlaying ? "Reproduciendo ahora" : "Nuestra Playlist"}
                                    </p>
                                    <p className="text-sm text-white/90 font-body truncate w-full">
                                        {currentSong ? currentSong.nombre : "Sin canciones en la playlist"}
                                    </p>
                                </div>
                            </div>

                            <footer className="mt-4 mb-16 text-center z-20 flex flex-col items-center gap-6">
                                <p className="font-name text-2xl md:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-rose-300 to-purple-300 drop-shadow-sm">"En este infinito, tú eres mi estrella más brillante"</p>
                                <div className="flex items-center gap-6 opacity-70 hover:opacity-100 transition-opacity glass-panel px-10 py-4 rounded-full">
                                    <button onClick={() => abrirPanelLogin('anthony')} className="text-xs font-bold uppercase tracking-[0.4em] text-rose-300 hover:text-white transition-colors cursor-pointer drop-shadow-md">Anthony</button>
                                    <span className="text-2xl text-white animate-infinity font-bold mx-2">∞</span>
                                    <button onClick={() => abrirPanelLogin('soyin')} className="text-xs font-bold uppercase tracking-[0.4em] text-purple-300 hover:text-white transition-colors cursor-pointer drop-shadow-md">Soyin</button>
                                </div>
                            </footer>

                            {currentSong && <audio ref={audioRef} src={currentSong.url} onEnded={nextTrack} />}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
