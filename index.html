<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de Soyin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap');
        
        body { margin: 0; background-color: #020205; color: white; }
        
        .font-name { font-family: 'Dancing Script', cursive; }
        .font-timer { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        @keyframes heartbeat-large {
          0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          15% { transform: scale(1.25); filter: drop-shadow(0 0 30px rgba(225, 29, 72, 0.8)); }
          30% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
          45% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(225, 29, 72, 0.6)); }
          100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4)); }
        }
        .heart-beat { animation: heartbeat-large 1.5s infinite ease-in-out; }

        @keyframes float-up {
          0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
          100% { transform: translateY(-100px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .animate-float-up { animation: float-up 1s ease-out forwards; }

        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
        }
        .animate-twinkle { animation: twinkle infinite ease-in-out; }

        @keyframes pulse-slow {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 4s infinite ease-in-out; }

        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(244,63,94,0.3), 0 0 40px rgba(244,63,94,0.1); }
            50% { text-shadow: 0 0 30px rgba(244,63,94,0.7), 0 0 60px rgba(244,63,94,0.3); }
        }
        .animate-text-glow { animation: text-glow 4s infinite ease-in-out; }
        
        @keyframes alarm-shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        .animate-alarm { animation: alarm-shake 0.5s ease-in-out infinite; }

        .moon-glow { box-shadow: 0 0 60px rgba(255, 255, 255, 0.1), inset -10px -10px 20px rgba(0,0,0,0.5); }
        .event-glow { box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); border: 1px solid rgba(251, 191, 36, 0.4); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS ---

        const TrashIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const EditIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        const ListIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
        const SparklesIcon = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const EyeIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
        const EyeOffIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>;
        const CalendarIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const BellIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
        const UserIcon = ({ size=24, className="" }) => <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;

        // ==========================================
        // CONFIGURACIÓN FIREBASE
        // ==========================================
        const CORREO_ANTHONY = "anthonyfonjim@gmail.com"; 
        const CORREO_SOYIN = "florsoyincastillo@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyC1s7lLrsC_bRgnCKg2ckBvvykiMvMLC5Q",
            authDomain: "los-latidos-de-mi-corazon.firebaseapp.com",
            projectId: "los-latidos-de-mi-corazon",
            storageBucket: "los-latidos-de-mi-corazon.firebasestorage.app",
            messagingSenderId: "850451293804",
            appId: "1:850451293804:web:9c662b62ad10e68a241a49"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==========================================
        // COMPONENTES AUXILIARES
        // ==========================================
        const ContenedorMagico = ({ children, color = "text-rose-500" }) => {
            const [particulas, setParticulas] = useState([]);
            
            const manejarClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const id = Date.now();
                setParticulas(prev => [...prev, {id, x, y}]);
                setTimeout(() => setParticulas(prev => prev.filter(p => p.id !== id)), 1000);
            };

            return (
                <div onClick={manejarClick} className="relative cursor-pointer transition-transform hover:scale-[1.01] w-full">
                    {children}
                    {particulas.map(p => (
                        <div key={p.id} className="absolute pointer-events-none z-50" style={{ left: p.x, top: p.y }}>
                            {Array.from({length: 6}).map((_, i) => (
                                <HeartIcon key={i} size={10 + Math.random()*15} className={`absolute animate-float-up ${color}`} fill="currentColor" 
                                    style={{ 
                                        left: `${(Math.random() - 0.5) * 60}px`, top: `${(Math.random() - 0.5) * 60}px`, animationDelay: `${Math.random() * 0.1}s`
                                    }} 
                                />
                            ))}
                        </div>
                    ))}
                </div>
            );
        };

        const calcularEdad = (fechaNacimiento) => {
            const hoy = new Date();
            const cumple = new Date(fechaNacimiento);
            let edad = hoy.getFullYear() - cumple.getFullYear();
            const m = hoy.getMonth() - cumple.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < cumple.getDate())) {
                edad--;
            }
            return edad;
        };

        // ==========================================
        // APLICACIÓN PRINCIPAL
        // ==========================================
        const App = () => {
            // DB States
            const [diario, setDiario] = useState([]);
            const [latidos, setLatidos] = useState([]);
            const [mensajesSoyin, setMensajesSoyin] = useState([]);
            const [eventos, setEventos] = useState([]);
            const [rutinas, setRutinas] = useState([]);
            const [musicUrl, setMusicUrl] = useState("");
            const [alarmUrl, setAlarmUrl] = useState("");
            const [fechaInicioRelacion, setFechaInicioRelacion] = useState("2025-12-17");
            const [bienvenidaAnthony, setBienvenidaAnthony] = useState({});
            const [bienvenidaSoyin, setBienvenidaSoyin] = useState({});
            
            // Navegación
            const [vistaActual, setVistaActual] = useState('portada'); 
            
            // Interfaz
            const [isPlaying, setIsPlaying] = useState(false);
            const [idxLatidoHoy, setIdxLatidoHoy] = useState(0);
            const [idxSoyinHoy, setIdxSoyinHoy] = useState(0);
            const [timeElapsed, setTimeElapsed] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });
            
            // Estado Mágico de Eventos con Tiempo Calculado
            const [eventosConTiempo, setEventosConTiempo] = useState([]);

            const audioRef = useRef(null);
            const alarmAudioRef = useRef(null);
            
            // Estado para Alarma de Rutina
            const [rutinaActivaModal, setRutinaActivaModal] = useState(null);
            const [lastTriggeredTime, setLastTriggeredTime] = useState("");

            // Login & Reset
            const [showLogin, setShowLogin] = useState(false);
            const [loginTarget, setLoginTarget] = useState(""); 
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPass, setShowPass] = useState(false); 
            const [isResettingPassword, setIsResettingPassword] = useState(false);
            const [resetEmail, setResetEmail] = useState("");
            
            // Forms Compartidos (Calendario / Rutina)
            const [nuevoEventoTitulo, setNuevoEventoTitulo] = useState("");
            const [nuevoEventoFecha, setNuevoEventoFecha] = useState("");
            const [nuevoEventoNota, setNuevoEventoNota] = useState("");
            
            const [nuevaRutinaTitulo, setNuevaRutinaTitulo] = useState("");
            const [nuevaRutinaHora, setNuevaRutinaHora] = useState("");

            // Forms Anthony
            const [nuevoTexto, setNuevoTexto] = useState("");
            const [nuevaFecha, setNuevaFecha] = useState("");
            const [nuevaHora, setNuevaHora] = useState("");
            const [tipoMensaje, setTipoMensaje] = useState("latidos"); 
            const [customDateAnth, setCustomDateAnth] = useState(false);

            const [nuevaMusica, setNuevaMusica] = useState("");
            const [nuevaAlarmaLink, setNuevaAlarmaLink] = useState("");
            const [nuevaFechaRelacion, setNuevaFechaRelacion] = useState("");
            
            const [formBienvenidaAnthony, setFormBienvenidaAnthony] = useState("");
            const [customCartaAnth, setCustomCartaAnth] = useState(false);
            const [fechaCartaAnth, setFechaCartaAnth] = useState("");
            const [horaCartaAnth, setHoraCartaAnth] = useState("");

            const [nuevaPassAnthony, setNuevaPassAnthony] = useState("");
            const [confPassAnthony, setConfPassAnthony] = useState("");
            const [showPassAnth, setShowPassAnth] = useState(false);

            // Forms Soyin
            const [nuevoTextoSoyin, setNuevoTextoSoyin] = useState("");
            const [fechaMensajeSoyin, setFechaMensajeSoyin] = useState("");
            const [horaMensajeSoyin, setHoraMensajeSoyin] = useState("");
            const [customDateSoyinLatido, setCustomDateSoyinLatido] = useState(false);

            const [nuevoDiarioSoyin, setNuevoDiarioSoyin] = useState("");
            const [fechaDiarioSoyin, setFechaDiarioSoyin] = useState("");
            const [horaDiarioSoyin, setHoraDiarioSoyin] = useState("");
            const [customDateSoyinDiario, setCustomDateSoyinDiario] = useState(false);

            const [formBienvenidaSoyin, setFormBienvenidaSoyin] = useState("");
            const [customCartaSoyin, setCustomCartaSoyin] = useState(false);
            const [fechaCartaSoyin, setFechaCartaSoyin] = useState("");
            const [horaCartaSoyin, setHoraCartaSoyin] = useState("");

            const [nuevaPassSoyin, setNuevaPassSoyin] = useState("");
            const [confPassSoyin, setConfPassSoyin] = useState("");
            const [showPassSoyin, setShowPassSoyin] = useState(false);

            // TABS de Administración
            const [adminTabAnth, setAdminTabAnth] = useState("publicar"); // publicar, calendario, rutinas
            const [adminTabSoyin, setAdminTabSoyin] = useState("publicar"); // publicar, calendario, rutinas

            // Edit Modal State
            const [editModal, setEditModal] = useState({ show: false, coleccion: '', id: '', texto: '', fecha: '', hora: '' });

            const isAnthony = user?.email === CORREO_ANTHONY;
            const isSoyin = user?.email === CORREO_SOYIN;

            const datosPersonales = {
                anthony: { nombre: "Anthony Enrique Fonseca Jiménez", fechaNac: "2003-10-28" },
                soyin: { nombre: "Flor Soyin Castillo Ibañez", fechaNac: "2006-11-17" }
            };

            // Funciones Mágicas de Fechas y Segundos
            const obtenerFechaHoyLocal = () => {
                const hoy = new Date();
                const year = hoy.getFullYear();
                const month = String(hoy.getMonth() + 1).padStart(2, '0');
                const day = String(hoy.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const obtenerHoraExacta = () => {
                const hoy = new Date();
                return hoy.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
            };

            const formatearFechaHora = (fecha, hora) => {
                if(!fecha) return "Fecha no registrada";
                try {
                    const d = new Date(`${fecha}T00:00:00`);
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return `${d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} a las ${hora || '12:00'}`;
                } catch(e) { return "Fecha inválida"; }
            };

            const formatearFechaSimple = (fechaString) => {
                if(!fechaString) return "Fecha no registrada";
                try {
                    const d = new Date(fechaString + "T00:00:00");
                    if(isNaN(d.getTime())) return "Fecha inválida";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                } catch(e) { return "Fecha inválida"; }
            };

            const formatearFechaHoraBaseDatos = (ts) => {
                if(!ts) return "Publicado hoy";
                try {
                    const d = ts.toDate ? ts.toDate() : new Date(ts);
                    if(isNaN(d.getTime())) return "Publicado hoy";
                    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                } catch(e) { return "Publicado hoy"; }
            };

            // Ordena un array cronológicamente
            const ordenarCronologicamente = (arr, ascendente = false) => {
                return [...arr].sort((a, b) => {
                    const dateA = new Date(`${a.fecha}T${a.hora || '00:00'}`).getTime();
                    const dateB = new Date(`${b.fecha}T${b.hora || '00:00'}`).getTime();
                    if (isNaN(dateA) || isNaN(dateB)) return 0;
                    return ascendente ? dateA - dateB : dateB - dateA;
                });
            };

            const getNextBirthday = (month, day) => {
                const currentYear = new Date().getFullYear();
                let bday = new Date(currentYear, month - 1, day);
                const today = new Date();
                today.setHours(0,0,0,0);
                if (bday < today) bday.setFullYear(currentYear + 1);
                return `${bday.getFullYear()}-${String(bday.getMonth()+1).padStart(2,'0')}-${String(bday.getDate()).padStart(2,'0')}`;
            };

            // Cronómetro Relación y Eventos Próximos (Con Tiempos Calculados)
            useEffect(() => {
                const startDate = new Date(fechaInicioRelacion + 'T00:00:00');
                const timer = setInterval(() => {
                    const now = new Date();
                    
                    // Cronómetro Relación
                    const diffRel = now - startDate;
                    if (diffRel > 0) {
                        setTimeElapsed({
                            days: Math.floor(diffRel / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diffRel / (1000 * 60 * 60)) % 24),
                            mins: Math.floor((diffRel / 1000 / 60) % 60),
                            secs: Math.floor((diffRel / 1000) % 60)
                        });
                    }

                    // Contador General de Eventos
                    const eventosPorDefecto = [
                        { id: 'bday-anthony', titulo: '🎂 Cumpleaños de Anthony', fecha: getNextBirthday(10, 28), nota: '¡Un día muy especial para celebrar la vida de Anthony Enrique!', autor: 'Sistema', isDefault: true },
                        { id: 'bday-soyin', titulo: '🎂 Cumpleaños de Soyin', fecha: getNextBirthday(11, 17), nota: '¡Un día mágico para celebrar a mi amada Flor Soyin!', autor: 'Sistema', isDefault: true }
                    ];
                    const eventosCombinados = [...eventos, ...eventosPorDefecto];

                    const calculados = eventosCombinados.map(ev => {
                        const evDate = new Date(`${ev.fecha}T00:00:00`);
                        const diffTime = evDate - now;
                        if (diffTime > 0) {
                            return {
                                ...ev,
                                isPast: false,
                                timeLeft: {
                                    days: Math.floor(diffTime / (1000 * 60 * 60 * 24)),
                                    hours: Math.floor((diffTime / (1000 * 60 * 60)) % 24),
                                    mins: Math.floor((diffTime / 1000 / 60) % 60),
                                    secs: Math.floor((diffTime / 1000) % 60)
                                }
                            };
                        } else {
                            return { ...ev, isPast: true };
                        }
                    });
                    
                    setEventosConTiempo(calculados);
                }, 1000);
                return () => clearInterval(timer);
            }, [fechaInicioRelacion, eventos]);

            // Rutinas Alarma Listener
            useEffect(() => {
                const checkAlarms = setInterval(() => {
                    const now = new Date();
                    const currentHourMinute = now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});
                    
                    const triggeredRoutine = rutinas.find(r => r.hora === currentHourMinute && r.activa);
                    
                    if (triggeredRoutine && lastTriggeredTime !== currentHourMinute) {
                        setLastTriggeredTime(currentHourMinute);
                        setRutinaActivaModal(triggeredRoutine);
                        if(alarmAudioRef.current) {
                            alarmAudioRef.current.currentTime = 0;
                            alarmAudioRef.current.play().catch(e => console.log("Audio play blocked by browser. User needs to interact first.", e));
                        }
                    }
                }, 5000); 
                return () => clearInterval(checkAlarms);
            }, [rutinas, lastTriggeredTime]);

            // Base de Datos Listener
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                
                const unsubLatidos = db.collection("latidos").orderBy("timestamp", "desc").onSnapshot(snap => setLatidos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubDiario = db.collection("diario").orderBy("timestamp", "desc").onSnapshot(snap => setDiario(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSoyinMsgs = db.collection("mensajes_soyin").orderBy("timestamp", "desc").onSnapshot(snap => setMensajesSoyin(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubEventos = db.collection("calendario").orderBy("timestamp", "desc").onSnapshot(snap => setEventos(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubRutinas = db.collection("rutinas").orderBy("timestamp", "desc").onSnapshot(snap => setRutinas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

                const unsubConfig = db.collection("configuracion").doc("general").onSnapshot(doc => {
                    if (doc.exists) { 
                        setMusicUrl(doc.data().musicUrl); setNuevaMusica(doc.data().musicUrl); 
                        setAlarmUrl(doc.data().alarmUrl); setNuevaAlarmaLink(doc.data().alarmUrl || "");
                        if(doc.data().fechaInicioRelacion) {
                            setFechaInicioRelacion(doc.data().fechaInicioRelacion);
                            setNuevaFechaRelacion(doc.data().fechaInicioRelacion);
                        }
                    }
                });

                const unsubBienvenidaAnth = db.collection("bienvenida").doc("anthony").onSnapshot(doc => {
                    if (doc.exists) { 
                        const data = doc.data();
                        setBienvenidaAnthony(data); setFormBienvenidaAnthony(data.texto || ""); 
                        if(data.fecha) { setCustomCartaAnth(true); setFechaCartaAnth(data.fecha); setHoraCartaAnth(data.hora || ""); }
                    }
                });

                const unsubBienvenidaSoy = db.collection("bienvenida").doc("soyin").onSnapshot(doc => {
                    if (doc.exists) { 
                        const data = doc.data();
                        setBienvenidaSoyin(data); setFormBienvenidaSoyin(data.texto || ""); 
                        if(data.fecha) { setCustomCartaSoyin(true); setFechaCartaSoyin(data.fecha); setHoraCartaSoyin(data.hora || ""); }
                    }
                });

                return () => { unsubAuth(); unsubLatidos(); unsubDiario(); unsubSoyinMsgs(); unsubEventos(); unsubRutinas(); unsubConfig(); unsubBienvenidaAnth(); unsubBienvenidaSoy(); };
            }, []);

            // Filtros Estrictos de HOY
            const hoyStr = obtenerFechaHoyLocal();
            const latidosHoy = latidos.filter(l => l.fecha === hoyStr);
            const mensajesSoyinHoy = mensajesSoyin.filter(m => m.fecha === hoyStr);

            // Historiales Ordenados Cronológicamente
            const diarioOrdenado = ordenarCronologicamente(diario);
            const latidosOrdenados = ordenarCronologicamente(latidos);
            const mensajesSoyinOrdenados = ordenarCronologicamente(mensajesSoyin);

            const eventosOrdenados = ordenarCronologicamente(eventosConTiempo, true); // Ascendente para eventos
            const eventosCercanos = eventosConTiempo.filter(ev => !ev.isPast && ev.timeLeft && ev.timeLeft.days <= 3);
            const rutinasOrdenadas = rutinas.sort((a, b) => a.hora.localeCompare(b.hora)); 

            const toggleMusic = () => {
                if (isPlaying) audioRef.current.pause();
                else audioRef.current.play().catch(e => console.log(e));
                setIsPlaying(!isPlaying);
            };

            const cerrarAlarma = () => {
                setRutinaActivaModal(null);
                if(alarmAudioRef.current) alarmAudioRef.current.pause();
            };

            const abrirPanelLogin = (quien) => {
                setLoginTarget(quien);
                setIsResettingPassword(false);
                if (user) {
                    if ((quien === 'anthony' && !isAnthony) || (quien === 'soyin' && !isSoyin)) {
                        auth.signOut();
                    }
                }
                setShowLogin(true);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try { await auth.signInWithEmailAndPassword(email, password); } 
                catch (error) { alert("Error: Verifica tus credenciales. (" + error.message + ")"); }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                if(!resetEmail) return alert("Por favor ingresa tu correo.");
                try {
                    await auth.sendPasswordResetEmail(resetEmail);
                    alert("✅ Te hemos enviado un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada o la carpeta de Spam.");
                    setIsResettingPassword(false);
                } catch (error) { alert("❌ Error: " + error.message); }
            };

            const cerrarSesion = () => { auth.signOut(); setShowLogin(false); };

            const cambiarPassword = async (e, nuevaPass, confPass, setNuevaPass, setConfPass) => {
                e.preventDefault();
                if(!auth.currentUser) return alert("Sesión expirada");
                if(nuevaPass !== confPass) return alert("❌ Error: Las contraseñas no coinciden.");
                if(nuevaPass.length < 6) return alert("❌ Error: La contraseña debe tener al menos 6 caracteres.");
                try {
                    await auth.currentUser.updatePassword(nuevaPass);
                    alert("✅ ¡Contraseña actualizada con éxito!");
                    setNuevaPass(""); setConfPass("");
                } catch (error) {
                    if (error.code === 'auth/requires-recent-login') alert("⚠️ Por seguridad, necesitas volver a Iniciar Sesión para cambiar la contraseña. Cierra sesión y vuelve a entrar.");
                    else alert("Error: " + error.message);
                }
            };

            const abrirEditor = (coleccion, id, texto, fecha, hora) => {
                setEditModal({ show: true, coleccion, id, texto, fecha: fecha || obtenerFechaHoyLocal(), hora: hora || obtenerHoraExacta() });
            };

            const guardarEdicion = async () => {
                if (!editModal.texto) return alert("El texto no puede estar vacío");
                try {
                    await db.collection(editModal.coleccion).doc(editModal.id).update({ texto: editModal.texto, fecha: editModal.fecha, hora: editModal.hora });
                    setEditModal({ show: false, coleccion: '', id: '', texto: '', fecha: '', hora: '' });
                    alert("¡Recuerdo editado y guardado con éxito!");
                } catch (error) { alert("Hubo un error al editar: " + error.message); }
            };

            const eliminarDocumento = async (coleccion, id, mensaje = "¿Seguro que quieres borrar este recuerdo?") => {
                if(window.confirm(mensaje)) await db.collection(coleccion).doc(id).delete();
            };

            const toggleRutina = async (id, estadoActual) => {
                await db.collection("rutinas").doc(id).update({ activa: !estadoActual });
            };

            const agregarEvento = async (e, autor) => {
                e.preventDefault();
                if(!nuevoEventoTitulo || !nuevoEventoFecha) return alert("Faltan datos.");
                await db.collection("calendario").add({
                    titulo: nuevoEventoTitulo,
                    fecha: nuevoEventoFecha,
                    nota: nuevoEventoNota,
                    autor: autor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNuevoEventoTitulo(""); setNuevoEventoFecha(""); setNuevoEventoNota("");
                alert("¡Fecha importante guardada en el calendario!");
            };

            const agregarRutina = async (e, autor) => {
                e.preventDefault();
                if(!nuevaRutinaTitulo || !nuevaRutinaHora) return alert("Faltan datos.");
                await db.collection("rutinas").add({
                    titulo: nuevaRutinaTitulo,
                    hora: nuevaRutinaHora,
                    activa: true,
                    autor: autor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                setNuevaRutinaTitulo(""); setNuevaRutinaHora("");
                alert("¡Rutina programada!");
            };

            // FUNCIONES AUTOMÁTICAS DE GUARDADO (Anthony)
            const publicarMensajeAnthony = async(e) => {
                e.preventDefault(); 
                if(!nuevoTexto) return alert("Escribe un mensaje, por favor."); 
                const fechaFinal = customDateAnth && nuevaFecha ? nuevaFecha : obtenerFechaHoyLocal();
                const horaFinal = customDateAnth && nuevaHora ? nuevaHora : obtenerHoraExacta();

                try {
                    await db.collection(tipoMensaje).add({ texto: nuevoTexto, fecha: fechaFinal, hora: horaFinal, autor: 'anthony', timestamp: firebase.firestore.FieldValue.serverTimestamp() }); 
                    setNuevoTexto(""); setNuevaFecha(""); setNuevaHora(""); setCustomDateAnth(false);
                    alert("¡Publicado mágicamente!"); 
                } catch(error) { alert("Hubo un error al guardar: " + error.message); }
            };

            const guardarBienvenidaAnthony = async (e) => {
                e.preventDefault();
                const fechaFinal = customCartaAnth && fechaCartaAnth ? fechaCartaAnth : obtenerFechaHoyLocal();
                const horaFinal = customCartaAnth && horaCartaAnth ? horaCartaAnth : obtenerHoraExacta();

                await db.collection("bienvenida").doc("anthony").set({ texto: formBienvenidaAnthony, fecha: fechaFinal, hora: horaFinal, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("diario").add({ texto: `[Carta de Entrada]: ${formBienvenidaAnthony}`, fecha: fechaFinal, hora: horaFinal, autor: 'anthony', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                alert("Mensaje de entrada actualizado y guardado en tu historia");
            };

            // FUNCIONES AUTOMÁTICAS DE GUARDADO (Soyin)
            const publicarDiarioSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoDiarioSoyin) return; 
                const fechaFinal = customDateSoyinDiario && fechaDiarioSoyin ? fechaDiarioSoyin : obtenerFechaHoyLocal();
                const horaFinal = customDateSoyinDiario && horaDiarioSoyin ? horaDiarioSoyin : obtenerHoraExacta();

                await db.collection("diario").add({texto: nuevoDiarioSoyin, fecha: fechaFinal, hora: horaFinal, autor: 'soyin', timestamp: firebase.firestore.FieldValue.serverTimestamp()}); 
                setNuevoDiarioSoyin(""); setFechaDiarioSoyin(""); setHoraDiarioSoyin(""); setCustomDateSoyinDiario(false);
                alert("¡Historia guardada en el Diario!"); 
            };

            const publicarMensajeCortoSoyin = async(e) => {
                e.preventDefault(); 
                if(!nuevoTextoSoyin) return; 
                const fechaFinal = customDateSoyinLatido && fechaMensajeSoyin ? fechaMensajeSoyin : obtenerFechaHoyLocal();
                const horaFinal = customDateSoyinLatido && horaMensajeSoyin ? horaMensajeSoyin : obtenerHoraExacta();

                await db.collection("mensajes_soyin").add({texto: nuevoTextoSoyin, fecha: fechaFinal, hora: horaFinal, timestamp: firebase.firestore.FieldValue.serverTimestamp()}); 
                setNuevoTextoSoyin(""); setFechaMensajeSoyin(""); setHoraMensajeSoyin(""); setCustomDateSoyinLatido(false);
                alert("¡Latido guardado en tu historial (y en portada si es de hoy)!"); 
            };

            const guardarBienvenidaSoyin = async (e) => {
                e.preventDefault();
                const fechaFinal = customCartaSoyin && fechaCartaSoyin ? fechaCartaSoyin : obtenerFechaHoyLocal();
                const horaFinal = customCartaSoyin && horaCartaSoyin ? horaCartaSoyin : obtenerHoraExacta();

                await db.collection("bienvenida").doc("soyin").set({ texto: formBienvenidaSoyin, fecha: fechaFinal, hora: horaFinal, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("diario").add({ texto: `[Carta de Entrada]: ${formBienvenidaSoyin}`, fecha: fechaFinal, hora: horaFinal, autor: 'soyin', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                alert("Mensaje de entrada actualizado y guardado en tu historia");
            };

            // COMPONENTE: SELECTOR DE FECHA (DOBLE BOTÓN)
            const DateSelector = ({ isCustom, setIsCustom, fecha, setFecha, hora, setHora, colorTheme = "rose" }) => {
                const btnColor = colorTheme === "purple" ? "bg-purple-600/50 border-purple-500" : "bg-rose-600/50 border-rose-500";
                const focusColor = colorTheme === "purple" ? "focus:border-purple-500" : "focus:border-rose-500";

                const handleSetCustom = (val) => {
                    setIsCustom(val);
                    if(val && !fecha) setFecha(obtenerFechaHoyLocal());
                    if(val && !hora) setHora(obtenerHoraExacta());
                };

                return (
                    <div className="flex flex-col gap-2 w-full mt-2">
                        <div className="flex gap-2">
                            <button type="button" onClick={() => handleSetCustom(false)} className={`flex-1 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors ${!isCustom ? btnColor + ' text-white border' : 'bg-black/40 text-gray-400 border border-white/10 hover:bg-white/5'}`}>Momento Actual</button>
                            <button type="button" onClick={() => handleSetCustom(true)} className={`flex-1 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors ${isCustom ? btnColor + ' text-white border' : 'bg-black/40 text-gray-400 border border-white/10 hover:bg-white/5'}`}>Elegir Fecha Exacta</button>
                        </div>
                        {isCustom && (
                            <div className="grid grid-cols-2 gap-4 animate-in mt-1">
                                <input type="date" required value={fecha} onChange={e=>setFecha(e.target.value)} className={`p-3 bg-black/40 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} />
                                <input type="time" required value={hora} onChange={e=>setHora(e.target.value)} className={`p-3 bg-black/40 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${focusColor}`} />
                            </div>
                        )}
                    </div>
                );
            };

            const [stars] = useState(() => Array.from({ length: 60 }).map((_, i) => ({
                id: i, left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
                animationDuration: `${2 + Math.random() * 4}s`, animationDelay: `${Math.random() * 5}s`
            })));

            // ==========================================
            // MODAL GLOBAL DE EDICIÓN
            // ==========================================
            const EditModalComponent = () => {
                if (!editModal.show) return null;
                const isSoyinModal = user?.email === CORREO_SOYIN;

                return (
                    <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-md animate-in">
                        <div className={`border p-6 md:p-8 rounded-3xl w-full max-w-md shadow-2xl relative ${isSoyinModal ? 'bg-[#0f0a1c] border-purple-500/30 shadow-[0_0_40px_rgba(168,85,247,0.2)]' : 'bg-[#1a0a0f] border-rose-500/30 shadow-[0_0_40px_rgba(225,29,72,0.2)]'}`}>
                            <h3 className={`font-name text-3xl mb-4 ${isSoyinModal ? 'text-purple-300' : 'text-rose-400'}`}>Editar Recuerdo</h3>
                            <textarea value={editModal.texto} onChange={e=>setEditModal({...editModal, texto: e.target.value})} className={`w-full h-32 bg-black/50 border border-white/10 rounded-xl p-4 text-white mb-4 outline-none text-sm ${isSoyinModal ? 'focus:border-purple-500' : 'focus:border-rose-500'}`}></textarea>
                            <label className="text-[10px] text-gray-400 uppercase tracking-widest mb-2 block">Editar Fecha y Hora de Publicación</label>
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <input type="date" value={editModal.fecha} onChange={e=>setEditModal({...editModal, fecha: e.target.value})} className={`p-3 bg-black/50 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${isSoyinModal ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} required/>
                                <input type="time" value={editModal.hora} onChange={e=>setEditModal({...editModal, hora: e.target.value})} className={`p-3 bg-black/50 border border-white/10 rounded-xl outline-none [color-scheme:dark] text-sm text-white ${isSoyinModal ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} required/>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={guardarEdicion} className={`flex-1 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all shadow-lg ${isSoyinModal ? 'bg-purple-600 hover:bg-purple-700' : 'bg-rose-600 hover:bg-rose-700'}`}>Guardar</button>
                                <button onClick={()=>setEditModal({show:false, coleccion:'', id:'', texto:'', fecha:'', hora:''})} className="flex-1 bg-white/10 hover:bg-white/20 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-all border border-white/10">Cancelar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // MODAL DE ALARMA DE RUTINA
            // ==========================================
            const RutinaAlarmaModal = () => {
                if (!rutinaActivaModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 backdrop-blur-xl animate-in">
                        <div className="border border-yellow-500/50 bg-[#1a160a] p-8 rounded-[3rem] w-full max-w-sm text-center shadow-[0_0_80px_rgba(234,179,8,0.3)] animate-alarm">
                            <div className="flex justify-center mb-6"><BellIcon size={60} className="text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]"/></div>
                            <h2 className="font-name text-4xl text-yellow-300 mb-2">¡Es Hora!</h2>
                            <p className="text-[10px] text-yellow-500/60 uppercase tracking-widest font-bold mb-6">Recordatorio de Rutina</p>
                            <p className="text-xl md:text-2xl text-yellow-100 font-body mb-8">"{rutinaActivaModal.titulo}"</p>
                            <button onClick={cerrarAlarma} className="w-full bg-yellow-500 hover:bg-yellow-600 text-[#020205] p-4 rounded-2xl text-sm uppercase tracking-[0.2em] font-bold transition-all shadow-lg">Entendido</button>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // VISTA: LOGIN Y PANELES ADMINISTRATIVOS
            // ==========================================
            if (showLogin) {
                if (!user || (loginTarget === 'anthony' && !isAnthony) || (loginTarget === 'soyin' && !isSoyin)) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4 relative z-50 bg-[#020205]">
                            <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                                <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                            </div>
                            
                            {isResettingPassword ? (
                                <form onSubmit={handleResetPassword} className="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-5 relative z-10 shadow-[0_0_40px_rgba(0,0,0,0.5)] animate-in">
                                    <h2 className={`font-name text-3xl text-center mb-2 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>Recuperar Contraseña</h2>
                                    <p className="text-[10px] text-gray-300 text-center uppercase tracking-widest mb-2">Ingresa tu correo para recibir el enlace seguro</p>
                                    <input type="email" placeholder="Correo electrónico" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={resetEmail} onChange={e => setResetEmail(e.target.value)} />
                                    <button type="submit" className={`mt-2 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Enviar enlace</button>
                                    <button type="button" onClick={() => setIsResettingPassword(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver atrás</button>
                                </form>
                            ) : (
                                <form onSubmit={handleLogin} className="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-5 relative z-10 shadow-[0_0_40px_rgba(0,0,0,0.5)] animate-in">
                                    <h2 className={`font-name text-4xl text-center mb-2 ${loginTarget === 'soyin' ? 'text-purple-400' : 'text-rose-400'}`}>
                                        {loginTarget === 'soyin' ? 'Acceso Soyin' : 'Acceso Anthony'}
                                    </h2>
                                    <input type="email" placeholder="Correo" required className={`p-3 bg-black/50 border border-white/10 rounded-lg outline-none ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={email} onChange={e => setEmail(e.target.value)} />
                                    <div className="flex flex-col">
                                        <div className="relative">
                                            <input type={showPass ? "text" : "password"} required placeholder="Contraseña" className={`w-full p-3 bg-black/50 border border-white/10 rounded-lg outline-none pr-10 ${loginTarget === 'soyin' ? 'focus:border-purple-500' : 'focus:border-rose-500'}`} value={password} onChange={e => setPassword(e.target.value)} />
                                            <button type="button" onClick={()=>setShowPass(!showPass)} className="absolute right-3 top-3.5 text-gray-400 hover:text-white transition-colors">
                                                {showPass ? <EyeOffIcon size={18}/> : <EyeIcon size={18}/>}
                                            </button>
                                        </div>
                                        <button type="button" onClick={() => {setIsResettingPassword(true); setResetEmail(email);}} className="text-[10px] text-gray-400 hover:text-white uppercase tracking-widest transition-colors text-right mt-2">¿Olvidaste tu contraseña?</button>
                                    </div>
                                    <button type="submit" className={`mt-2 text-white p-3 rounded-lg text-sm tracking-[0.2em] uppercase font-bold transition-all hover:scale-[1.02] shadow-lg ${loginTarget === 'soyin' ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/20' : 'bg-rose-600 hover:bg-rose-700 shadow-rose-500/20'}`}>Entrar</button>
                                    <button type="button" onClick={() => setShowLogin(false)} className="text-xs text-gray-400 hover:text-white mt-2 uppercase tracking-widest transition-colors text-center">Volver al rincón</button>
                                </form>
                            )}
                        </div>
                    );
                }

                // PANEL ANTHONY MÁSTER
                if (isAnthony) {
                    return (
                        <div className="min-h-screen p-4 md:p-8 font-body bg-[#020205] relative z-50">
                            <div className="max-w-6xl mx-auto glass-panel p-6 md:p-8 rounded-3xl animate-in">
                                <div className="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-white/10 pb-6">
                                    <h2 className="font-name text-4xl text-rose-300">Panel Máster</h2>
                                    <div className="flex flex-wrap gap-4 items-center bg-black/20 p-2 px-4 rounded-2xl border border-white/5">
                                        <form onSubmit={(e) => cambiarPassword(e, nuevaPassAnthony, confPassAnthony, setNuevaPassAnthony, setConfPassAnthony)} className="flex items-center gap-2 mr-2 border-r border-white/10 pr-4">
                                            <div className="relative">
                                                <input type={showPassAnth ? "text" : "password"} placeholder="Nueva Contraseña" required className="p-2 pr-8 bg-black/40 border border-white/10 rounded text-[10px] outline-none focus:border-rose-500" value={nuevaPassAnthony} onChange={e=>setNuevaPassAnthony(e.target.value)} />
                                                <button type="button" onClick={()=>setShowPassAnth(!showPassAnth)} className="absolute right-2 top-2 text-gray-500 hover:text-white"><EyeIcon size={12}/></button>
                                            </div>
                                            <input type={showPassAnth ? "text" : "password"} placeholder="Confirmar..." required className="p-2 bg-black/40 border border-white/10 rounded text-[10px] outline-none focus:border-rose-500" value={confPassAnthony} onChange={e=>setConfPassAnthony(e.target.value)} />
                                            <button type="submit" className="text-[9px] bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded uppercase tracking-widest font-bold shadow-lg">Actualizar</button>
