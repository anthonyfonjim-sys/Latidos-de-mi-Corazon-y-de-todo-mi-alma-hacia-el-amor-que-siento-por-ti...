                                                <form onSubmit={guardarBienvenidaSoyin} className="bg-purple-900/10 p-5 rounded-2xl border border-purple-500/20 flex flex-col gap-3 shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                                    <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em]">Tus palabras en la Entrada principal</h3>
                                                    <textarea required placeholder="Ej: Mi príncipe Anthony, cada segundo a tu lado es magia..." className="p-3 bg-black/40 border border-purple-500/30 rounded-xl text-sm outline-none text-purple-100 focus:border-purple-400" value={formBienvenidaSoyin} onChange={e=>setFormBienvenidaSoyin(e.target.value)} rows="3"></textarea>
                                                    <DateSelector isCustom={customCartaSoyin} setIsCustom={setCustomCartaSoyin} fecha={fechaCartaSoyin} setFecha={setFechaCartaSoyin} hora={horaCartaSoyin} setHora={setHoraCartaSoyin} colorTheme="purple" />
                                                    <button type="submit" className="bg-purple-900/50 hover:bg-purple-800 text-purple-200 p-2 rounded-lg text-[10px] uppercase tracking-widest transition-colors mt-1 border border-purple-500/30">Actualizar Carta</button>
                                                </form>

                                                <form onSubmit={publicarDiarioSoyin} className="bg-purple-900/10 p-6 rounded-2xl border border-purple-500/20 flex flex-col gap-4 shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                                    <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em] flex justify-between">
                                                        <span>Escribir en nuestro Diario</span>
                                                    </h3>
                                                    <textarea required placeholder="Cuenta una historia, un recuerdo, lo que sientes..." className="p-4 bg-black/40 border border-purple-500/30 rounded-xl h-20 outline-none focus:border-purple-400 text-purple-50 text-sm" value={nuevoDiarioSoyin} onChange={e => setNuevoDiarioSoyin(e.target.value)}></textarea>
                                                    <DateSelector isCustom={customDateSoyinDiario} setIsCustom={setCustomDateSoyinDiario} fecha={fechaDiarioSoyin} setFecha={setFechaDiarioSoyin} hora={horaDiarioSoyin} setHora={setHoraDiarioSoyin} colorTheme="purple" />
                                                    <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold shadow-[0_0_15px_rgba(147,51,234,0.3)] transition-colors mt-2">Guardar Mágicamente</button>
                                                </form>

                                                <form onSubmit={publicarMensajeCortoSoyin} className="flex flex-col gap-4 mt-8 bg-purple-900/10 p-6 rounded-2xl border border-purple-500/20">
                                                    <h3 className="text-purple-300 font-bold text-[10px] uppercase tracking-[0.2em] flex justify-between items-center">
                                                        <span className="flex items-center gap-2"><SparklesIcon size={14}/> Un latido corto para él</span>
                                                    </h3>
                                                    <textarea required placeholder="De ti, para él..." className="p-4 bg-black/40 border border-purple-500/40 rounded-xl h-24 outline-none focus:border-purple-400 text-purple-50 text-sm shadow-[inset_0_0_20px_rgba(147,51,234,0.1)]" value={nuevoTextoSoyin} onChange={e => setNuevoTextoSoyin(e.target.value)}></textarea>
                                                    <DateSelector isCustom={customDateSoyinLatido} setIsCustom={setCustomDateSoyinLatido} fecha={fechaMensajeSoyin} setFecha={setFechaMensajeSoyin} hora={horaMensajeSoyin} setHora={setHoraMensajeSoyin} colorTheme="purple" />
                                                    <button type="submit" className="bg-fuchsia-600 hover:bg-fuchsia-700 text-white p-3 rounded-xl text-xs uppercase tracking-[0.2em] font-bold shadow-[0_0_20px_rgba(192,38,211,0.5)] transition-colors transform hover:scale-[1.02] mt-2">Dejar Latido</button>
                                                </form>
                                            </>
                                        )}

                                        {adminTabSoyin === 'calendario' && (
                                            <form onSubmit={(e)=>agregarEvento(e, 'soyin')} className="bg-black/20 p-6 rounded-2xl border border-yellow-500/20 flex flex-col gap-4 shadow-lg">
                                                <h3 className="text-yellow-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><CalendarIcon size={14}/> Agendar Fecha Importante</h3>
                                                <input type="text" required placeholder="Título del evento (Ej. Nuestro Aniversario)" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoTitulo} onChange={e=>setNuevoEventoTitulo(e.target.value)} />
                                                <input type="date" required className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoFecha} onChange={e=>setNuevoEventoFecha(e.target.value)} />
                                                <textarea placeholder="Una nota especial para este día... (Opcional)" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl h-20 outline-none focus:border-yellow-500 text-sm text-purple-50" value={nuevoEventoNota} onChange={e=>setNuevoEventoNota(e.target.value)}></textarea>
                                                <button type="submit" className="bg-yellow-600 hover:bg-yellow-700 text-black p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(202,138,4,0.3)] mt-2">Guardar en Calendario</button>
                                            </form>
                                        )}

                                        {adminTabSoyin === 'rutinas' && (
                                            <form onSubmit={(e)=>agregarRutina(e, 'soyin')} className="bg-black/20 p-6 rounded-2xl border border-blue-500/20 flex flex-col gap-4 shadow-lg">
                                                <h3 className="text-blue-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><BellIcon size={14}/> Programar Nueva Rutina</h3>
                                                <p className="text-[10px] text-purple-300/50 mb-2">Añade rutinas para que suenen automáticamente todos los días.</p>
                                                <input type="text" required placeholder="Nombre de la rutina" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none text-sm focus:border-blue-500 text-purple-50" value={nuevaRutinaTitulo} onChange={e=>setNuevaRutinaTitulo(e.target.value)} />
                                                <input type="time" required className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-blue-500 text-purple-50" value={nuevaRutinaHora} onChange={e=>setNuevaRutinaHora(e.target.value)} />
                                                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(37,99,235,0.3)] mt-2">Activar Rutina</button>
                                            </form>
                                        )}
                                    </div>

                                    {/* COLUMNA DERECHA: HISTORIALES */}
                                    <div className="bg-purple-900/5 p-6 rounded-2xl border border-purple-500/20 h-[800px] overflow-y-auto shadow-[0_0_20px_rgba(147,51,234,0.05)]">
                                        
                                        {adminTabSoyin === 'publicar' && (
                                            <div className="animate-in">
                                                <h3 className="text-purple-300 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><ListIcon size={16}/> Tus Memorias Escritas</h3>
                                                
                                                <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-4 text-center border-b border-purple-500/20 pb-2">En el Diario Compartido:</p>
                                                {diarioOrdenado.filter(d => d.autor === 'soyin').map(d => (
                                                    <div key={d.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex flex-col group hover:bg-purple-900/40 transition-colors">
                                                        <div className="flex justify-between items-center w-full">
                                                            <div className="truncate w-3/4 text-sm text-purple-100">{d.texto}</div>
                                                            <div className="flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                                <button onClick={()=>abrirEditor('diario', d.id, d.texto, d.fecha, d.hora)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={16}/></button>
                                                                <button onClick={()=>eliminarDocumento('diario', d.id)} className="text-red-400 hover:text-red-300 p-2"><TrashIcon size={16}/></button>
                                                            </div>
                                                        </div>
                                                        <span className="text-[9px] text-purple-300/60 mt-2 tracking-widest uppercase">{formatearFechaHora(d.fecha, d.hora)}</span>
                                                    </div>
                                                ))}

                                                <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-8 text-center border-b border-purple-500/20 pb-2">Tus Latidos Cortos:</p>
                                                {mensajesSoyinOrdenados.map(msg => (
                                                    <div key={msg.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex flex-col group hover:bg-purple-900/40 transition-colors">
                                                        <div className="flex justify-between items-center w-full">
                                                            <div className="truncate w-3/4 text-sm text-purple-100">{msg.texto}</div>
                                                            <div className="flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                                <button onClick={()=>abrirEditor('mensajes_soyin', msg.id, msg.texto, msg.fecha, msg.hora)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={16}/></button>
                                                                <button onClick={()=>eliminarDocumento('mensajes_soyin', msg.id)} className="text-red-400 hover:text-red-300 p-2"><TrashIcon size={16}/></button>
                                                            </div>
                                                        </div>
                                                        <span className="text-[8px] text-purple-300/50 mt-2 tracking-widest uppercase">{formatearFechaHora(msg.fecha, msg.hora)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'calendario' && (
                                            <div className="animate-in">
                                                <h3 className="text-yellow-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><CalendarIcon size={16}/> Eventos del Calendario</h3>
                                                {eventosOrdenados.length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">No hay fechas importantes anotadas.</p>}
                                                {eventosOrdenados.map(ev => (
                                                    <div key={ev.id} className={`p-5 mb-3 rounded-xl border ${ev.isDefault ? 'bg-fuchsia-900/10 border-fuchsia-500/40' : 'bg-purple-900/20 border-yellow-500/30'} flex flex-col group relative`}>
                                                        {!ev.isDefault && <button onClick={()=>eliminarDocumento('calendario', ev.id, "¿Borrar este evento?")} className="absolute top-4 right-4 text-purple-400 hover:text-red-400 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity p-2"><TrashIcon size={16}/></button>}
                                                        <h4 className={`font-name text-2xl mb-1 ${ev.isDefault ? 'text-fuchsia-300' : 'text-yellow-300'}`}>{ev.titulo}</h4>
                                                        
                                                        <div className="flex flex-col gap-1 mb-3">
                                                            <p className={`text-[10px] uppercase tracking-widest font-bold ${ev.isDefault ? 'text-fuchsia-400/70' : 'text-yellow-500/70'}`}>{formatearFechaSimple(ev.fecha)}</p>
                                                            {!ev.isPast && ev.timeLeft ? (
                                                                <span className={`text-[9px] font-bold tracking-widest uppercase inline-block w-fit px-2 py-1 rounded-md ${ev.isDefault ? 'bg-fuchsia-900/30 text-fuchsia-400' : 'bg-green-900/30 text-green-400'}`}>
                                                                    Faltan {ev.timeLeft.days}d {ev.timeLeft.hours}h {ev.timeLeft.mins}m
                                                                </span>
                                                            ) : (
                                                                <span className="text-[9px] font-bold tracking-widest uppercase inline-block w-fit px-2 py-1 rounded-md bg-white/5 text-gray-500">
                                                                    Ya pasó
                                                                </span>
                                                            )}
                                                        </div>

                                                        {ev.nota && <p className="text-sm text-purple-100 italic border-t border-purple-500/20 pt-3">"{ev.nota}"</p>}
                                                        <span className="text-[8px] text-purple-300/40 mt-3 uppercase">{ev.isDefault ? 'Evento Fijo del Sistema' : `Por ${ev.autor}`}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'rutinas' && (
                                            <div className="animate-in">
                                                <h3 className="text-blue-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><BellIcon size={16}/> Todas las Rutinas</h3>
                                                {rutinasOrdenadas.length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">No hay rutinas programadas.</p>}
                                                {rutinasOrdenadas.map(rut => (
                                                    <div key={rut.id} className={`p-5 mb-3 rounded-xl border flex items-center justify-between transition-colors ${rut.activa ? 'bg-blue-900/20 border-blue-500/30' : 'bg-white/5 border-white/10 opacity-60'}`}>
                                                        <div>
                                                            <h4 className={`font-name text-2xl mb-1 ${rut.activa ? 'text-blue-300' : 'text-gray-400'}`}>{rut.titulo}</h4>
                                                            <p className="text-xs tracking-widest font-timer text-purple-100 bg-black/40 inline-block px-3 py-1 rounded-full">{rut.hora}</p>
                                                            <p className="text-[8px] text-purple-300/40 mt-2 uppercase tracking-widest">Creado por {rut.autor}</p>
                                                        </div>
                                                        <div className="flex flex-col gap-3 items-end">
                                                            <button onClick={()=>toggleRutina(rut.id, rut.activa)} className={`px-4 py-2 rounded-full text-[9px] uppercase tracking-widest font-bold shadow-lg ${rut.activa ? 'bg-blue-600 text-white' : 'bg-gray-600 text-gray-300'}`}>
                                                                {rut.activa ? 'Activa' : 'Pausada'}
                                                            </button>
                                                            <button onClick={()=>eliminarDocumento('rutinas', rut.id, "¿Borrar esta rutina?")} className="text-purple-400 hover:text-red-400 p-2"><TrashIcon size={14}/></button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
            }

            // ==========================================
            // VISTA PÚBLICA: NAVEGACIÓN Y PANTALLAS
            // ==========================================
            return (
                <div className="min-h-screen flex flex-col items-center justify-center relative w-full overflow-x-hidden">
                    <EditModalComponent />
                    <RutinaAlarmaModal />

                    {/* Alarma de Audio oculta */}
                    <audio ref={alarmAudioRef} src={alarmUrl || "https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"} loop />

                    {/* Estrellas y Sol Fijos */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(star => <div key={star.id} className="absolute bg-white rounded-full w-1 h-1 animate-twinkle" style={star} />)}
                    </div>
                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                        <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                        <div className="absolute top-8 left-8 md:top-16 md:left-16 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-tr from-amber-200 to-yellow-50 rounded-full shadow-[0_0_80px_rgba(251,191,36,0.4)] animate-pulse-slow flex items-center justify-center opacity-80">
                            <div className="w-full h-full bg-white rounded-full blur-[8px] absolute opacity-40"></div>
                        </div>
                    </div>

                    {/* VISTA 0: ENTRADA PRINCIPAL (PORTADA) */}
                    {vistaActual === 'portada' && (
                        <div className="z-20 flex flex-col items-center animate-in max-w-4xl px-4 py-12 text-center min-h-screen justify-center w-full">
                            <h2 className="font-name text-4xl md:text-5xl text-rose-200 mb-12 drop-shadow-md border-b border-white/10 pb-4">Nuestra Historia</h2>
                            
                            <div className="flex flex-col gap-10 font-body w-full">
                                {bienvenidaAnthony?.texto && (
                                    <ContenedorMagico color="text-rose-500">
                                        <div className="relative bg-gradient-to-br from-[#1a1a2e]/80 to-black/40 backdrop-blur-md border border-rose-900/50 p-8 md:p-10 rounded-sm shadow-[0_0_40px_rgba(225,29,72,0.1)] w-full md:w-[85%] mx-auto transform rotate-[-1deg]">
                                            <div className="absolute -top-4 left-1/2 transform -translate-x-1/2">
                                                <HeartIcon size={28} className="text-rose-600 drop-shadow-md" fill="currentColor"/>
                                            </div>
                                            <h3 className="font-name text-3xl text-rose-400 mb-4 text-left">Para mi amada Soyin...</h3>
                                            <p className="font-body text-rose-100/90 text-lg md:text-xl leading-relaxed italic text-left">"{bienvenidaAnthony.texto}"</p>
                                            <div className="mt-6 text-right">
                                                <p className="font-name text-2xl text-rose-300">Anthony</p>
                                                <span className="text-[8px] text-rose-400/50 font-timer tracking-widest uppercase">
                                                    {bienvenidaAnthony.fecha ? formatearFechaHora(bienvenidaAnthony.fecha, bienvenidaAnthony.hora) : formatearFechaHoraBaseDatos(bienvenidaAnthony.timestamp)}
                                                </span>
                                            </div>
                                        </div>
                                    </ContenedorMagico>
                                )}
                                {bienvenidaSoyin?.texto && (
                                    <ContenedorMagico color="text-purple-400">
                                        <div className="relative bg-gradient-to-br from-purple-900/20 to-black/40 backdrop-blur-md border border-purple-500/30 p-8 md:p-10 rounded-sm shadow-[0_0_40px_rgba(168,85,247,0.1)] w-full md:w-[85%] mx-auto transform rotate-[1deg]">
                                            <div className="absolute -top-4 left-1/2 transform -translate-x-1/2">
                                                <HeartIcon size={28} className="text-purple-500 drop-shadow-md" fill="currentColor"/>
                                            </div>
                                            <h3 className="font-name text-3xl text-purple-300 mb-4 text-left">Para ti, mi amor...</h3>
                                            <p className="font-body text-purple-100/90 text-lg md:text-xl leading-relaxed italic text-left">"{bienvenidaSoyin.texto}"</p>
                                            <div className="mt-6 text-right">
                                                <p className="font-name text-2xl text-purple-300">Soyin</p>
                                                <span className="text-[8px] text-purple-400/50 font-timer tracking-widest uppercase">
                                                    {bienvenidaSoyin.fecha ? formatearFechaHora(bienvenidaSoyin.fecha, bienvenidaSoyin.hora) : formatearFechaHoraBaseDatos(bienvenidaSoyin.timestamp)}
                                                </span>
                                            </div>
                                        </div>
                                    </ContenedorMagico>
                                )}
                                {!bienvenidaAnthony?.texto && !bienvenidaSoyin?.texto && (
                                    <p className="text-white/30 italic text-sm">Esperando nuestras primeras palabras...</p>
                                )}
                            </div>

                            <div onClick={() => {
                                setVistaActual('principal'); 
                                // Esto permite que el audio de la alarma se desbloquee en los navegadores si se activa
                                if(alarmAudioRef.current) { alarmAudioRef.current.load(); }
                            }} className="relative w-64 md:w-72 h-40 md:h-48 bg-[#1a1a2e] rounded-xl shadow-2xl cursor-pointer group hover:scale-[1.03] transition-transform mt-12">
                                <div className="absolute inset-0 border-2 border-rose-900/30 rounded-xl m-1"></div>
                                <div className="absolute inset-0 m-auto w-14 h-14 bg-rose-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(225,29,72,0.5)] z-10 heart-beat">
                                    <HeartIcon fill="white" size={28} className="text-white" />
                                </div>
                                <div className="absolute bottom-5 w-full text-center">
                                    <p className="text-[10px] tracking-[0.4em] uppercase text-rose-300/80 font-bold">Entrar al Refugio</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VISTAS INTERNAS PÚBLICAS */}
                    {vistaActual !== 'portada' && (
                        <div className="z-10 w-full max-w-4xl px-4 flex flex-col items-center relative animate-in py-10 min-h-screen">
                            
                            {/* MENU DE NAVEGACIÓN SUPERIOR */}
                            <div className="absolute top-4 right-4 z-30 flex flex-col gap-2 items-end">
                                {vistaActual !== 'principal' ? (
                                    <button onClick={() => setVistaActual('principal')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.05] hover:bg-white/[0.2] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-rose-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                        <ArrowLeftIcon size={14}/> Volver al inicio
                                    </button>
                                ) : (
                                    <>
                                        <button onClick={() => setVistaActual('diario')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.05] hover:bg-white/[0.2] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-rose-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                            <BookIcon size={14}/> Leer el diario
                                        </button>
                                        <button onClick={() => setVistaActual('calendario')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.05] hover:bg-white/[0.2] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-yellow-300 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                            <CalendarIcon size={14}/> Calendario Especial
                                        </button>
                                        <button onClick={() => setVistaActual('portada')} className="flex items-center gap-2 px-5 py-2.5 bg-white/[0.05] hover:bg-white/[0.2] border border-white/10 rounded-full text-[10px] font-timer tracking-widest uppercase text-gray-400 backdrop-blur-md transition-all shadow-lg hover:scale-105">
                                            <ArrowLeftIcon size={14}/> Ver Portada
                                        </button>
                                    </>
                                )}
                            </div>

                            <h1 className={`text-7xl md:text-[10rem] font-name text-rose-100 mb-6 mt-10 drop-shadow-[0_0_20px_rgba(244,63,94,0.6)] animate-text-glow text-center transition-all duration-500 ${vistaActual === 'principal' ? 'block' : 'hidden'}`}>Soyin</h1>

                            {/* VISTA: DIARIO COMPARTIDO */}
                            {vistaActual === 'diario' && (
                                <div className="w-full max-w-2xl bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-[3rem] p-6 md:p-12 shadow-[0_0_50px_rgba(0,0,0,0.5)] animate-in mx-auto mt-16">
                                    <h2 className="font-name text-4xl text-rose-300 text-center mb-10">Nuestro Diario</h2>
                                    <div className="relative border-l-2 border-white/10 ml-2 md:ml-4 space-y-12 pb-6">
                                        {diarioOrdenado.map((entrada) => {
                                            const esDeSoyin = entrada.autor === 'soyin';
                                            return (
                                                <ContenedorMagico key={entrada.id} color={esDeSoyin ? "text-purple-400" : "text-rose-500"}>
                                                    <div className="relative pl-6 md:pl-8 w-full">
                                                        <div className={`absolute -left-[9px] top-1 w-4 h-4 rounded-full ring-4 ring-[#020205] ${esDeSoyin ? 'bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.8)]' : 'bg-rose-600 shadow-[0_0_10px_rgba(225,29,72,0.8)]'}`}></div>
                                                        <p className={`text-[10px] font-timer tracking-widest uppercase mb-1 flex items-center gap-2 ${esDeSoyin ? 'text-purple-400' : 'text-rose-400'}`}>
                                                            {formatearFechaSimple(entrada.fecha)} 
                                                            <span className="text-[8px] opacity-60 bg-white/10 px-2 py-[2px] rounded-full font-sans tracking-normal">{esDeSoyin ? 'Escrito por Flor' : 'Escrito por Anthony'}</span>
                                                        </p>
                                                        <p className="text-[8px] text-gray-500 mb-3 uppercase tracking-widest">
                                                            {entrada.hora ? `A las ${entrada.hora}` : formatearFechaHoraBaseDatos(entrada.timestamp)}
                                                        </p>
                                                        <div className={`bg-black/20 border p-5 mt-3 rounded-2xl font-body text-sm md:text-base leading-relaxed whitespace-pre-wrap shadow-lg ${esDeSoyin ? 'border-purple-500/20 text-purple-50' : 'border-rose-500/20 text-rose-50/90'}`}>
                                                            {entrada.texto}
                                                        </div>
                                                    </div>
                                                </ContenedorMagico>
                                            );
                                        })}
                                        {diarioOrdenado.length === 0 && <p className="text-center text-white/40 italic">Aún no hay historias escritas.</p>}
                                    </div>
                                </div>
                            )}

                            {/* VISTA: CALENDARIO COMPARTIDO (EVENTOS PÚBLICOS) */}
                            {vistaActual === 'calendario' && (
                                <div className="w-full max-w-2xl bg-white/[0.02] backdrop-blur-xl border border-yellow-500/30 rounded-[3rem] p-6 md:p-12 shadow-[0_0_50px_rgba(250,204,21,0.1)] animate-in mx-auto mt-16">
                                    <h2 className="font-name text-4xl text-yellow-400 text-center mb-10 flex justify-center items-center gap-3"><CalendarIcon size={32}/> Fechas Importantes</h2>
                                    <div className="space-y-6">
                                        {eventosOrdenados.length === 0 && <p className="text-center text-white/40 italic">El calendario está vacío.</p>}
                                        {eventosOrdenados.map((ev) => (
                                            <div key={ev.id} className={`relative bg-black/40 p-6 rounded-2xl border ${ev.isDefault ? 'border-fuchsia-500/30 shadow-[0_0_20px_rgba(217,70,239,0.1)]' : 'border-yellow-500/20'} shadow-lg hover:scale-[1.02] transition-transform`}>
                                                <div className={`absolute top-0 right-0 ${ev.isDefault ? 'bg-fuchsia-600 text-white' : 'bg-yellow-600 text-black'} font-bold text-[9px] uppercase tracking-widest px-3 py-1 rounded-bl-xl rounded-tr-xl`}>
                                                    {ev.isDefault ? 'Fecha Fija' : `Agendado por ${ev.autor}`}
                                                </div>
                                                <h3 className={`font-name text-3xl mb-1 ${ev.isDefault ? 'text-fuchsia-300' : 'text-yellow-300'}`}>{ev.titulo}</h3>
                                                
                                                <div className="flex flex-col gap-1 mb-4">
                                                    <p className={`text-xs tracking-widest font-timer ${ev.isDefault ? 'text-fuchsia-100/70' : 'text-yellow-100/70'}`}>{formatearFechaSimple(ev.fecha)}</p>
                                                    {!ev.isPast && ev.timeLeft ? (
                                                        <span className={`text-[9px] font-bold tracking-widest uppercase inline-block w-fit px-2 py-1 rounded-md ${ev.isDefault ? 'bg-fuchsia-900/30 text-fuchsia-400' : 'bg-green-900/30 text-green-400'}`}>
                                                            Faltan {ev.timeLeft.days}d {ev.timeLeft.hours}h {ev.timeLeft.mins}m
                                                        </span>
                                                    ) : (
                                                        <span className="text-[9px] font-bold tracking-widest uppercase inline-block w-fit px-2 py-1 rounded-md bg-white/5 text-gray-500">
                                                            Ya pasó
                                                        </span>
                                                    )}
                                                </div>

                                                {ev.nota && (
                                                    <p className="font-body text-sm text-gray-300 bg-white/5 p-4 rounded-xl italic">"{ev.nota}"</p>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* VISTA: HISTORIAL EXPANDIDO DE ANTHONY (LATIDOS) */}
                            {vistaActual === 'historial_anthony' && (
                                <div className="w-full max-w-2xl bg-white/[0.02] backdrop-blur-xl border border-rose-900/30 rounded-[3rem] p-6 md:p-12 shadow-[0_0_50px_rgba(225,29,72,0.1)] animate-in mx-auto mt-16">
                                    <h2 className="font-name text-4xl text-rose-300 text-center mb-10 flex items-center justify-center gap-3"><HeartIcon size={28} className="text-rose-500 heart-beat" fill="currentColor"/> Historial de Latidos de Anthony</h2>
                                    <div className="relative border-l-2 border-rose-900/30 ml-2 md:ml-4 space-y-12 pb-6">
                                        {latidosOrdenados.length === 0 && <p className="text-center text-white/40 italic">Aún no hay latidos guardados.</p>}
                                        {latidosOrdenados.map((l) => (
                                            <ContenedorMagico key={l.id} color="text-rose-500">
                                                <div className="relative pl-6 md:pl-8 w-full">
                                                    <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-rose-600 ring-4 ring-[#020205] shadow-[0_0_10px_rgba(225,29,72,0.8)]"></div>
                                                    <p className="text-[10px] font-timer tracking-widest uppercase mb-1 text-rose-400">
                                                        {formatearFechaHora(l.fecha, l.hora)}
                                                    </p>
                                                    <div className="bg-black/30 border border-rose-500/20 p-5 mt-3 rounded-2xl font-body text-sm md:text-base leading-relaxed whitespace-pre-wrap shadow-lg text-rose-100">
                                                        "{l.texto}"
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* VISTA: HISTORIAL EXPANDIDO DE SOYIN */}
                            {vistaActual === 'historial_soyin' && (
                                <div className="w-full max-w-2xl bg-purple-900/10 backdrop-blur-xl border border-purple-500/30 rounded-[3rem] p-6 md:p-12 shadow-[0_0_50px_rgba(168,85,247,0.15)] animate-in mx-auto mt-16">
                                    <h2 className="font-name text-4xl text-purple-300 text-center mb-10 flex items-center justify-center gap-3"><HeartIcon size={28} className="text-purple-500 heart-beat" fill="currentColor"/> Historial de Latidos de Soyin</h2>
                                    <div className="relative border-l-2 border-purple-500/30 ml-2 md:ml-4 space-y-12 pb-6">
                                        {mensajesSoyinOrdenados.length === 0 && <p className="text-center text-white/40 italic">Aún no hay latidos guardados.</p>}
                                        {mensajesSoyinOrdenados.map((msg) => (
                                            <ContenedorMagico key={msg.id} color="text-purple-400">
                                                <div className="relative pl-6 md:pl-8 w-full">
                                                    <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-purple-500 ring-4 ring-[#020205] shadow-[0_0_10px_rgba(168,85,247,0.8)]"></div>
                                                    <p className="text-[10px] font-timer tracking-widest uppercase mb-1 text-purple-400">
                                                        {formatearFechaHora(msg.fecha, msg.hora)}
                                                    </p>
                                                    <div className="bg-black/30 border border-purple-500/20 p-5 mt-3 rounded-2xl font-body text-sm md:text-base leading-relaxed whitespace-pre-wrap shadow-lg text-purple-100 italic">
                                                        "{msg.texto}"
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* VISTA: PANTALLA PRINCIPAL */}
                            {vistaActual === 'principal' && (
                                <div className="w-full max-w-2xl mx-auto flex flex-col items-center gap-8 relative z-10">
                                    
                                    {/* SECCIÓN LATIDOS (ANTHONY - SOLO HOY) */}
                                    <div className="bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-[3.5rem] p-8 md:p-12 shadow-2xl text-center animate-in relative w-full">
                                        <div className="absolute top-0 right-0 m-4">
                                            <button onClick={() => setVistaActual('historial_anthony')} className="flex items-center gap-1.5 text-[9px] uppercase tracking-[0.2em] text-rose-300/60 hover:text-rose-300 transition-colors bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full shadow-lg">
                                                <ListIcon size={12} /> Ver historial de latidos de Anthony
                                            </button>
                                        </div>
                                        
                                        <div className="mb-8 flex justify-center mt-6 heart-beat"><HeartIcon size={80} className="text-rose-500" fill="currentColor" /></div>
                                        <p className="text-rose-400/40 text-[10px] font-bold tracking-[0.6em] mb-4 uppercase">De mí para ti, cariño</p>
                                        
                                        {latidosHoy.length > 0 ? (
                                            <ContenedorMagico color="text-rose-500">
                                                <div className="min-h-[100px] flex flex-col justify-center">
                                                    <p className="text-2xl md:text-3xl font-body font-light text-rose-50/90 tracking-wide leading-relaxed">"{latidosHoy[idxLatidoHoy]?.texto}"</p>
                                                    <div className="flex flex-col items-center mt-6 gap-1 border-t border-white/5 pt-4">
                                                        <p className="text-[8px] font-timer text-rose-300/30 tracking-widest uppercase">A las {latidosHoy[idxLatidoHoy]?.hora}</p>
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ) : (
                                            <p className="text-white/30 italic font-body text-sm min-h-[100px] flex items-center justify-center bg-black/20 rounded-2xl mt-4 border border-white/5">Esperando un latido para el día de hoy...</p>
                                        )}

                                        {latidosHoy.length > 1 && (
                                            <button onClick={() => setIdxLatidoHoy((idxLatidoHoy + 1) % latidosHoy.length)} className="mt-8 mx-auto text-rose-300 hover:text-white border border-rose-600/40 bg-rose-600/20 px-6 py-2 rounded-full text-[10px] uppercase tracking-[0.2em] font-bold transition-colors flex items-center gap-2">Ver otro latido de hoy <ArrowLeftIcon size={12} className="rotate-180"/></button>
                                        )}
                                    </div>

                                    {/* LA LUNA MÁGICA CONECTORA */}
                                    <div className="relative flex flex-col items-center my-6 w-full">
                                        <div className="absolute h-full w-[2px] bg-gradient-to-b from-rose-500/30 via-white/10 to-purple-500/30 -z-10"></div>
                                        
                                        {/* CONTADOR DE EVENTOS PRÓXIMOS (3 DÍAS) */}
                                        {eventosCercanos.length > 0 && (
                                            <div className="mb-10 w-full flex flex-col gap-4 items-center z-20">
                                                {eventosCercanos.map(ev => (
                                                    <div key={ev.id} className="bg-[#1a160a] border border-yellow-500/50 p-6 rounded-3xl event-glow animate-pulse-slow text-center max-w-sm w-full">
                                                        <div className="flex justify-center mb-2"><SparklesIcon size={20} className="text-yellow-400"/></div>
                                                        <p className="text-[10px] text-yellow-500 uppercase tracking-widest font-bold mb-1">Se acerca una fecha especial</p>
                                                        <h4 className="font-name text-2xl text-yellow-200 mb-4">{ev.titulo}</h4>
                                                        <div className="flex justify-center gap-3 text-yellow-100 font-timer">
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{ev.timeLeft.days}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Días</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.hours).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Horas</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.mins).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Min</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.secs).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Seg</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        <div className="w-44 h-44 md:w-56 md:h-56 bg-neutral-100 rounded-full moon-glow flex flex-col items-center justify-center text-neutral-900 overflow-hidden border border-white/20 z-10 shadow-[0_0_60px_rgba(255,255,255,0.15)] relative">
                                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-black to-transparent"></div>
                                            
                                            <div className="flex items-center gap-3 mb-3">
                                                <HeartIcon size={16} className="text-rose-500 heart-beat" fill="currentColor"/>
                                                <HeartIcon size={16} className="text-purple-500 heart-beat" fill="currentColor" style={{animationDelay: "0.4s"}}/>
                                            </div>
                                            <p className="text-[11px] font-bold tracking-widest text-gray-800 mb-1 z-10">AMÁNDOTE</p>
                                            <div className="flex flex-col items-center font-timer z-10">
                                                <span className="text-3xl md:text-4xl font-bold">{timeElapsed.days}d</span>
                                                <span className="text-xs md:text-sm font-medium">{String(timeElapsed.hours).padStart(2,'0')}h : {String(timeElapsed.mins).padStart(2,'0')}m : {String(timeElapsed.secs).padStart(2,'0')}s</span>
                                            </div>
                                            <p className="text-[8px] md:text-[9px] mt-3 opacity-70 font-bold z-10">Desde {formatearFechaSimple(fechaInicioRelacion)}</p>
                                        </div>
                                    </div>

                                    {/* SECCIÓN SOYIN (SOLO HOY) */}
                                    <div className="bg-purple-900/10 border border-purple-500/20 rounded-[3.5rem] p-8 md:p-12 shadow-[0_0_40px_rgba(147,51,234,0.1)] text-center animate-in backdrop-blur-sm relative w-full">
                                        <div className="absolute top-0 right-0 m-4">
                                            <button onClick={() => setVistaActual('historial_soyin')} className="flex items-center gap-1.5 text-[9px] uppercase tracking-[0.2em] text-purple-300/60 hover:text-purple-300 transition-colors bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full shadow-lg">
                                                <ListIcon size={12} /> Ver historial de latidos de Soyin
                                            </button>
                                        </div>
                                        
                                        <div className="mb-8 flex justify-center mt-6 heart-beat"><HeartIcon size={80} className="text-purple-500" fill="currentColor" /></div>
                                        <p className="text-purple-300/60 text-[10px] font-bold tracking-[0.5em] mb-4 uppercase flex items-center justify-center gap-2">
                                            <SparklesIcon size={14} className="text-purple-400" /> Un latido de Soyin para ti <SparklesIcon size={14} className="text-purple-400" />
                                        </p>

                                        {mensajesSoyinHoy.length > 0 ? (
                                            <ContenedorMagico color="text-purple-400">
                                                <div className="min-h-[100px] flex flex-col justify-center">
                                                    <div className="text-center bg-black/20 p-5 rounded-3xl border border-purple-500/20 shadow-[inset_0_0_20px_rgba(147,51,234,0.1)]">
                                                        <p className="font-body text-purple-100/90 italic text-xl md:text-2xl leading-relaxed">"{mensajesSoyinHoy[idxSoyinHoy]?.texto}"</p>
                                                        <p className="text-[8px] text-purple-300/40 mt-5 font-timer tracking-widest uppercase border-t border-purple-500/20 pt-3">A las {mensajesSoyinHoy[idxSoyinHoy]?.hora}</p>
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ) : (
                                            <p className="text-white/30 italic font-body text-sm min-h-[100px] flex items-center justify-center bg-black/20 rounded-2xl mt-4 border border-purple-500/10">Esperando el latido de Flor de hoy...</p>
                                        )}

                                        {mensajesSoyinHoy.length > 1 && (
                                            <button onClick={() => setIdxSoyinHoy((idxSoyinHoy + 1) % mensajesSoyinHoy.length)} className="mt-8 mx-auto text-purple-300 hover:text-white border border-purple-600/40 bg-purple-600/20 px-6 py-2 rounded-full text-[10px] uppercase tracking-[0.2em] font-bold transition-colors flex items-center gap-2">Ver otro latido de hoy <ArrowLeftIcon size={12} className="rotate-180"/></button>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* REPRODUCTOR */}
                            <div className="mt-14 flex flex-col items-center pb-8 z-20">
                                <button onClick={toggleMusic} className={`w-20 h-20 rounded-full flex items-center justify-center transition-all border-2 ${isPlaying ? 'bg-rose-600/20 border-rose-500 scale-110 shadow-[0_0_30px_rgba(244,63,94,0.4)]' : 'bg-black/50 border-white/20 hover:border-rose-400 hover:bg-rose-900/20'}`}>
                                    {isPlaying ? <PauseIcon size={32} className="text-white"/> : <PlayIcon size={32} className="ml-1 text-white" />}
                                </button>
                                <p className="mt-5 text-[9px] uppercase tracking-[0.6em] text-white/40 font-bold bg-black/30 px-4 py-1.5 rounded-full border border-white/5">
                                    {isPlaying ? "Nuestra melodía suena..." : "Dale play"}
                                </p>
                            </div>

                            <footer className="mt-8 mb-16 text-center z-20 flex flex-col items-center gap-4">
                                <p className="font-body text-xs italic tracking-widest text-white/30">"En este infinito, tú eres mi estrella más brillante"</p>
                                <div className="flex gap-4 opacity-40 hover:opacity-100 transition-opacity bg-black/40 px-6 py-2.5 rounded-full border border-white/10 backdrop-blur-md">
                                    <button onClick={() => abrirPanelLogin('anthony')} className="text-[10px] font-bold uppercase tracking-[0.3em] text-rose-400 hover:text-rose-300 transition-colors cursor-pointer">Anthony</button>
                                    <span className="text-white/20">|</span>
                                    <button onClick={() => abrirPanelLogin('soyin')} className="text-[10px] font-bold uppercase tracking-[0.3em] text-purple-400 hover:text-purple-300 transition-colors cursor-pointer">Soyin</button>
                                </div>
                            </footer>

                            {musicUrl && <audio ref={audioRef} src={musicUrl} loop />}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
