                                                <h3 className="text-purple-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><LockIcon size={14}/> Escribir en tu Diario Secreto</h3>
                                                <p className="text-[10px] text-purple-200/50 mb-2">Este espacio es 100% privado. Anthony nunca podrá leer lo que escribas aquí.</p>
                                                <textarea required placeholder="¿Qué sientes hoy? Desahógate, este rincón es solo tuyo..." className="p-4 bg-black/40 border border-purple-500/20 rounded-xl h-40 outline-none focus:border-purple-500 text-sm text-purple-50" value={nuevoTextoPrivado} onChange={e => setNuevoTextoPrivado(e.target.value)}></textarea>
                                                <button type="submit" className="bg-purple-700 hover:bg-purple-600 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(168,85,247,0.4)] mt-2">Guardar Secreto</button>
                                            </form>
                                        )}

                                        {adminTabSoyin === 'calendario' && (
                                            <form onSubmit={(e)=>agregarEvento(e, 'soyin')} className="bg-black/20 p-6 rounded-2xl border border-yellow-500/20 flex flex-col gap-4 shadow-lg">
                                                <h3 className="text-yellow-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><CalendarIcon size={14}/> Agendar Fecha Pública</h3>
                                                <p className="text-[10px] text-purple-300/50 mb-2">Aparecerá en el calendario compartido de la aplicación.</p>
                                                <input type="text" required placeholder="Título del evento (Ej. Nuestro Aniversario)" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoTitulo} onChange={e=>setNuevoEventoTitulo(e.target.value)} />
                                                <input type="date" required className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoFecha} onChange={e=>setNuevoEventoFecha(e.target.value)} />
                                                
                                                <div className="flex gap-2">
                                                    <input type="time" className="flex-1 p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoHoraInicio} onChange={e=>setNuevoEventoHoraInicio(e.target.value)} title="Hora Inicio (Opcional)" />
                                                    <span className="text-[10px] uppercase text-gray-500 flex items-center">hasta</span>
                                                    <input type="time" className="flex-1 p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-yellow-500 text-purple-50" value={nuevoEventoHoraFin} onChange={e=>setNuevoEventoHoraFin(e.target.value)} title="Hora Fin (Opcional)" />
                                                </div>

                                                <textarea placeholder="Una nota especial para este día... (Opcional)" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl h-20 outline-none focus:border-yellow-500 text-sm text-purple-50" value={nuevoEventoNota} onChange={e=>setNuevoEventoNota(e.target.value)}></textarea>
                                                <button type="submit" className="bg-yellow-600 hover:bg-yellow-700 text-black p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(202,138,4,0.3)] mt-2">Guardar en Calendario</button>
                                            </form>
                                        )}

                                        {adminTabSoyin === 'rutinas' && (
                                            <>
                                                <MiniCalendarioVisual eventos={misRutinasOrdenadas} selectedDate={nuevaRutinaFecha} onSelectDate={setNuevaRutinaFecha} theme="purple" />
                                                <form onSubmit={(e)=>agregarRutina(e, 'soyin')} className="bg-black/20 p-6 rounded-2xl border border-blue-500/20 flex flex-col gap-4 shadow-lg">
                                                    <h3 className="text-blue-400 font-bold text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><BellIcon size={14}/> Programar Rutina Diaria Personal</h3>
                                                    <p className="text-[10px] text-purple-300/50 mb-2">Solo tú verás tus rutinas y solo te sonarán a ti.</p>
                                                    <input type="text" required placeholder="Nombre de la rutina" className="p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none text-sm focus:border-blue-500 text-purple-50" value={nuevaRutinaTitulo} onChange={e=>setNuevaRutinaTitulo(e.target.value)} />
                                                    
                                                    <div className="flex gap-2 items-center">
                                                        <input type="time" required className="flex-1 p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-blue-500 text-purple-50" value={nuevaRutinaHora} onChange={e=>setNuevaRutinaHora(e.target.value)} title="Hora de Inicio" />
                                                        <span className="text-[10px] uppercase text-gray-500">hasta</span>
                                                        <input type="time" className="flex-1 p-3 bg-black/30 border border-purple-500/30 rounded-xl outline-none [color-scheme:dark] text-sm focus:border-blue-500 text-purple-50" value={nuevaRutinaHoraFin} onChange={e=>setNuevaRutinaHoraFin(e.target.value)} title="Hora Límite (Opcional)" />
                                                    </div>

                                                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl text-xs uppercase tracking-widest font-bold transition-colors shadow-[0_0_15px_rgba(37,99,235,0.3)] mt-2">Activar Rutina</button>
                                                </form>
                                            </>
                                        )}
                                    </div>

                                    {/* COLUMNA DERECHA: HISTORIALES */}
                                    <div className="bg-purple-900/5 p-6 rounded-2xl border border-purple-500/20 h-[800px] overflow-y-auto shadow-[0_0_20px_rgba(147,51,234,0.05)] relative hide-scrollbar">
                                        
                                        {adminTabSoyin === 'publicar' && (
                                            <div className="animate-in">
                                                <h3 className="text-purple-300 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><ListIcon size={16}/> Tus Memorias Compartidas (Todo)</h3>
                                                
                                                <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-4 text-center border-b border-purple-500/20 pb-2">Diario Público</p>
                                                {diarioMaster.filter(d => d.autor === 'soyin').map(d => (
                                                    <div key={d.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex flex-col group hover:bg-purple-900/40 transition-colors relative">
                                                        {d.esCapsula && <div className="absolute top-2 right-2 text-purple-500/50" title="Cápsula del Tiempo"><LockIcon size={14}/></div>}
                                                        <div className="flex justify-between items-center w-full mt-2">
                                                            <div className="truncate w-3/4 text-sm text-purple-100">{d.texto}</div>
                                                            <div className="flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                                <button onClick={()=>abrirEditor('diario', d)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={16}/></button>
                                                                <button onClick={()=>eliminarDocumento('diario', d.id)} className="text-red-400 hover:text-red-300 p-2"><TrashIcon size={16}/></button>
                                                            </div>
                                                        </div>
                                                        <span className="text-[9px] text-purple-300/60 mt-2 tracking-widest uppercase">{formatearFechaHora(d.fecha, d.hora)} {d.esCapsula && "- Programado"}</span>
                                                        <VistaPreviaNotas item={d} colorTheme="purple" />
                                                    </div>
                                                ))}

                                                <p className="text-purple-400/60 text-[9px] uppercase tracking-widest mb-3 mt-8 text-center border-b border-purple-500/20 pb-2">Latidos Públicos</p>
                                                {msgsSoyinMaster.filter(msg => msg.autor !== 'anthony').map(msg => (
                                                    <div key={msg.id} className="p-4 bg-purple-900/20 mb-3 rounded-xl border border-purple-500/20 flex flex-col group hover:bg-purple-900/40 transition-colors relative">
                                                        {msg.esCapsula && <div className="absolute top-2 right-2 text-purple-500/50" title="Cápsula del Tiempo"><LockIcon size={14}/></div>}
                                                        <div className="flex justify-between items-center w-full mt-2">
                                                            <div className="truncate w-3/4 text-sm text-purple-100">{msg.texto}</div>
                                                            <div className="flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg">
                                                                <button onClick={()=>abrirEditor('mensajes_soyin', msg)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={16}/></button>
                                                                <button onClick={()=>eliminarDocumento('mensajes_soyin', msg.id)} className="text-red-400 hover:text-red-300 p-2"><TrashIcon size={16}/></button>
                                                            </div>
                                                        </div>
                                                        <span className="text-[8px] text-purple-300/50 mt-2 tracking-widest uppercase">{formatearFechaHora(msg.fecha, msg.hora)} {msg.esCapsula && "- Programado"}</span>
                                                        <VistaPreviaNotas item={msg} colorTheme="purple" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'privado' && (
                                            <div className="animate-in">
                                                <h3 className="text-purple-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><LockIcon size={16}/> Tu Diario Secreto</h3>
                                                {miDiarioPrivado.length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">Tu diario privado está vacío.</p>}
                                                {miDiarioPrivado.map(dp => (
                                                    <div key={dp.id} className="p-5 bg-black/40 mb-3 rounded-2xl border border-purple-500/10 shadow-[inset_0_0_20px_rgba(168,85,247,0.05)] relative group">
                                                        <p className="text-sm text-purple-100/90 whitespace-pre-wrap">{dp.texto}</p>
                                                        <div className="mt-4 border-t border-purple-500/10 pt-3 flex justify-between items-center">
                                                            <span className="text-[9px] text-purple-300/50 tracking-widest uppercase">{formatearFechaHora(dp.fecha, dp.hora)}</span>
                                                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={()=>abrirEditor('diario_privado', dp)} className="text-blue-500 hover:text-blue-400 p-1"><EditIcon size={14}/></button>
                                                                <button onClick={()=>eliminarDocumento('diario_privado', dp.id, "¿Borrar este secreto?")} className="text-red-500 hover:text-red-400 p-1"><TrashIcon size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'calendario' && (
                                            <div className="animate-in">
                                                <h3 className="text-yellow-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><CalendarIcon size={16}/> Eventos del Calendario Público</h3>
                                                {eventosOrdenados.map(ev => (
                                                    <div key={ev.id} className={`p-5 mb-3 rounded-xl border ${ev.isDefault ? 'bg-fuchsia-900/10 border-fuchsia-500/40' : 'bg-purple-900/20 border-yellow-500/30'} flex flex-col group relative`}>
                                                        <div className="absolute top-4 right-4 flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity p-2 z-20">
                                                            <button onClick={()=>abrirEditor('calendario', ev)} className="text-blue-400 hover:text-blue-300"><EditIcon size={16}/></button>
                                                            {!ev.isDefault && <button onClick={()=>eliminarDocumento('calendario', ev.id, "¿Borrar este evento?")} className="text-purple-400 hover:text-red-400"><TrashIcon size={16}/></button>}
                                                        </div>
                                                        <h4 className={`font-name text-2xl mb-1 ${ev.isDefault ? 'text-fuchsia-300' : 'text-yellow-300'}`}>{ev.titulo}</h4>
                                                        <p className={`text-[10px] uppercase tracking-widest font-bold mb-3 ${ev.isDefault ? 'text-fuchsia-400/70' : 'text-yellow-500/70'}`}>
                                                            {formatearFechaSimple(ev.fecha)}
                                                            {(ev.hora || ev.horaFin) && ` | ${ev.hora} ${ev.horaFin ? `- ${ev.horaFin}` : ''}`}
                                                        </p>
                                                        {ev.nota && <p className="text-sm text-purple-100 italic border-t border-purple-500/20 pt-3">"{ev.nota}"</p>}
                                                        <span className="text-[8px] text-purple-300/40 mt-3 uppercase">{ev.isDefault ? 'Evento Fijo del Sistema' : `Por ${ev.autor}`}</span>
                                                        <VistaPreviaNotas item={ev} colorTheme="purple" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTabSoyin === 'rutinas' && (
                                            <div className="animate-in">
                                                <h3 className="text-blue-400 font-bold text-xs mb-4 uppercase tracking-widest flex items-center gap-2"><BellIcon size={16}/> Mis Rutinas Programadas</h3>
                                                {misRutinasOrdenadas.length === 0 && <p className="text-purple-300/50 italic text-sm text-center mt-10">No hay rutinas programadas.</p>}
                                                {misRutinasOrdenadas.map(rut => (
                                                    <div key={rut.id} className={`p-5 mb-3 rounded-xl border flex items-center justify-between transition-colors ${rut.activa ? 'bg-blue-900/20 border-blue-500/30' : 'bg-white/5 border-white/10 opacity-60'}`}>
                                                        <div>
                                                            <h4 className={`font-name text-2xl mb-1 ${rut.activa ? 'text-blue-300' : 'text-gray-400'}`}>{rut.titulo}</h4>
                                                            <div className="flex gap-2 items-center">
                                                                <p className="text-xs tracking-widest font-timer text-purple-100 bg-black/40 inline-block px-3 py-1 rounded-full">{rut.hora}</p>
                                                                {rut.horaFin && <p className="text-[10px] text-purple-300/50 font-bold uppercase tracking-widest">hasta {rut.horaFin}</p>}
                                                            </div>
                                                            {rut.fecha && <p className="text-[9px] text-blue-400/50 mt-2 uppercase tracking-widest border border-blue-500/20 bg-blue-900/10 px-2 py-1 inline-block rounded">Solo para: {formatearFechaSimple(rut.fecha)}</p>}
                                                            
                                                            <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'rutinas', id: rut.id }); }} className="text-[10px] text-purple-300/60 hover:text-purple-200 uppercase tracking-widest flex items-center gap-1 transition-colors mt-3">
                                                                <MessageCircleIcon size={12} /> Notas / Diario de Rutina
                                                                <IndicadorNuevaNota ultimaNota={rut.ultimaNota} />
                                                            </button>
                                                        </div>
                                                        <div className="flex flex-col gap-3 items-end">
                                                            <button onClick={()=>toggleRutina(rut.id, rut.activa)} className={`px-4 py-2 rounded-full text-[9px] uppercase tracking-widest font-bold shadow-lg ${rut.activa ? 'bg-blue-600 text-white' : 'bg-gray-600 text-gray-300'}`}>
                                                                {rut.activa ? 'Activa' : 'Pausada'}
                                                            </button>
                                                            <div className="flex gap-2 mt-2">
                                                                <button onClick={()=>abrirEditor('rutinas', rut)} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={14}/></button>
                                                                <button onClick={()=>eliminarDocumento('rutinas', rut.id, "¿Borrar esta rutina?")} className="text-purple-400 hover:text-red-400 p-2"><TrashIcon size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
            }

            // ==========================================
            // VISTA PÚBLICA: NAVEGACIÓN Y PANTALLAS
            // ==========================================
            return (
                <div className="min-h-screen flex flex-col items-center justify-center relative w-full overflow-x-hidden">
                    {renderUiAlert()}
                    {renderEditModal()}
                    {renderRutinaAlarmaModal()}
                    
                    {/* MODAL DE NOTAS AL ESTAR ACTIVO */}
                    {notaActiva && <ModalNotas coleccion={notaActiva.coleccion} docId={notaActiva.id} currentUser={currentUserName} onClose={() => setNotaActiva(null)} showAlert={showAlert} showConfirm={showConfirm} />}

                    {/* MODAL DEL CALENDARIO PUBLICO (DIA SELECCIONADO) */}
                    {selectedDatePublic && (
                        <div className="fixed inset-0 bg-black/80 z-[150] flex items-center justify-center p-4 backdrop-blur-md animate-in" onClick={() => setSelectedDatePublic("")}>
                            <div className="bg-[#1a1a2e] border border-yellow-500/30 p-6 md:p-8 rounded-3xl w-full max-w-md shadow-[0_0_40px_rgba(250,204,21,0.2)] relative flex flex-col max-h-[80vh]" onClick={e=>e.stopPropagation()}>
                                <button onClick={() => setSelectedDatePublic("")} className="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/5 p-2 rounded-full transition-colors"><TrashIcon size={16} className="hidden" />✕</button>
                                <h3 className="font-name text-4xl text-yellow-400 mb-6 flex items-center gap-3"><CalendarIcon size={24}/> {formatearFechaSimple(selectedDatePublic)}</h3>
                                
                                {(() => {
                                    const eventosDia = eventosConTiempo.filter(e => e.fecha === selectedDatePublic);
                                    if (eventosDia.length === 0) {
                                        return (
                                            <div className="text-center py-10 flex flex-col items-center gap-4">
                                                <SparklesIcon size={40} className="text-yellow-500/30"/>
                                                <p className="text-gray-400 text-sm font-body">No hay eventos ni recuerdos para este día.</p>
                                                {user ? (
                                                    <button onClick={() => {
                                                        if (isAnthony) {
                                                            setAdminTabAnth('calendario');
                                                            setNuevoEventoFecha(selectedDatePublic);
                                                            setLoginTarget('anthony');
                                                            setShowLogin(true);
                                                        } else if (isSoyin) {
                                                            setAdminTabSoyin('calendario');
                                                            setNuevoEventoFecha(selectedDatePublic);
                                                            setLoginTarget('soyin');
                                                            setShowLogin(true);
                                                        } else {
                                                            setLoginTarget('anthony');
                                                            setShowLogin(true);
                                                        }
                                                        setSelectedDatePublic("");
                                                    }} className="mt-2 text-xs bg-yellow-600 hover:bg-yellow-700 text-black px-6 py-3 rounded-xl uppercase tracking-widest font-bold transition-all shadow-lg">
                                                        Ir al Panel a Crear Evento
                                                    </button>
                                                ) : (
                                                    <div className="flex flex-col gap-2 mt-2">
                                                        <p className="text-[10px] text-yellow-500/50 uppercase tracking-widest">Inicia sesión para agregar algo especial aquí.</p>
                                                        <div className="flex gap-2 justify-center mt-2">
                                                            <button onClick={() => { setSelectedDatePublic(""); abrirPanelLogin('anthony'); }} className="text-[9px] bg-white/5 border border-white/10 px-3 py-1.5 rounded-full hover:bg-white/10 text-rose-400 uppercase tracking-widest">Soy Anthony</button>
                                                            <button onClick={() => { setSelectedDatePublic(""); abrirPanelLogin('soyin'); }} className="text-[9px] bg-white/5 border border-white/10 px-3 py-1.5 rounded-full hover:bg-white/10 text-purple-400 uppercase tracking-widest">Soy Soyin</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    }
                                    return (
                                        <div className="space-y-4 overflow-y-auto hide-scrollbar flex-1 pr-2">
                                            {eventosDia.map(ev => (
                                                <div key={ev.id} className="bg-black/40 border border-yellow-500/20 p-5 rounded-2xl relative">
                                                    {ev.isDefault && <div className="absolute top-2 right-2 text-[8px] bg-yellow-600/20 text-yellow-500 px-2 py-1 rounded uppercase tracking-widest">Especial</div>}
                                                    <h4 className="font-name text-2xl text-yellow-200 mb-1">{ev.titulo}</h4>
                                                    {(ev.hora || ev.horaFin) && <p className="text-[10px] text-yellow-500/80 font-timer tracking-widest uppercase mb-3 bg-white/5 inline-block px-2 py-1 rounded">{ev.hora} {ev.horaFin ? `- ${ev.horaFin}` : ''}</p>}
                                                    {ev.nota && <p className="text-sm text-gray-300 italic border-l-2 border-yellow-500/30 pl-3 py-1">"{ev.nota}"</p>}
                                                    <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'calendario', id: ev.id }); setSelectedDatePublic(""); }} className="mt-4 text-[10px] text-gray-400 hover:text-white uppercase tracking-widest flex items-center gap-1 transition-colors bg-white/5 px-3 py-1.5 rounded-full w-max">
                                                        <MessageCircleIcon size={14} /> Abrir Notas del Evento
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* Alarma de Audio oculta */}
                    <audio ref={alarmAudioRef} src={alarmUrl || "https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"} loop />

                    {/* Estrellas y Sol Fijos */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(star => <div key={star.id} className="absolute bg-white rounded-full w-1 h-1 animate-twinkle" style={star} />)}
                    </div>
                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                        <div className="absolute -top-20 -left-20 w-80 h-80 bg-amber-500/10 rounded-full blur-[100px]"></div>
                        <div className="absolute top-8 left-8 md:top-16 md:left-16 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-tr from-amber-200 to-yellow-50 rounded-full shadow-[0_0_80px_rgba(251,191,36,0.4)] animate-pulse-slow flex items-center justify-center opacity-80">
                            <div className="w-full h-full bg-white rounded-full blur-[8px] absolute opacity-40"></div>
                        </div>
                    </div>

                    {/* VISTA 0: ENTRADA PRINCIPAL (PORTADA) */}
                    {vistaActual === 'portada' && (
                        <div className="z-20 flex flex-col items-center animate-in max-w-4xl px-4 py-12 text-center min-h-screen justify-center w-full">
                            <h2 className="font-name text-4xl md:text-5xl text-rose-200 mb-12 drop-shadow-md border-b border-white/10 pb-4">Nuestra Historia</h2>
                            
                            <div className="flex flex-col gap-10 font-body w-full">
                                {bienvenidaAnthony?.texto && (
                                    <ContenedorMagico color="text-rose-500">
                                        <div className={`relative bg-gradient-to-br from-[#1a1a2e]/80 to-black/40 backdrop-blur-md border border-rose-900/50 p-8 md:p-10 rounded-sm shadow-[0_0_40px_rgba(225,29,72,0.1)] w-full md:w-[85%] mx-auto transform rotate-[-1deg] group ${!esVisibleAlPublico(bienvenidaAnthony) && isAnthony ? 'opacity-70' : ''}`}>
                                            <div className="absolute -top-4 left-1/2 transform -translate-x-1/2">
                                                <HeartIcon size={28} className="text-rose-600 drop-shadow-md" fill="currentColor"/>
                                            </div>
                                            
                                            {esVisibleAlPublico(bienvenidaAnthony) || isAnthony ? (
                                                <>
                                                    <SelectorReacciones coleccion="bienvenida" docId="anthony" reaccionesActuales={bienvenidaAnthony.reacciones} currentUser={currentUserName} showAlert={showAlert} />
                                                    {bienvenidaAnthony.esCapsula && <div className="absolute top-4 right-4 text-white/30" title="Cápsula del Tiempo"><LockIcon size={16}/></div>}
                                                    
                                                    <h3 className="font-name text-3xl text-rose-400 mb-4 text-left">Para mi amada Soyin...</h3>
                                                    <p className="font-body text-rose-100/90 text-lg md:text-xl leading-relaxed italic text-left">"{bienvenidaAnthony.texto}"</p>
                                                    
                                                    <div className="mt-8 pt-4 border-t border-rose-900/30 flex flex-col md:flex-row justify-between items-end md:items-center gap-4 relative z-20">

                                                        <div className="absolute top-0 right-0 flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded-lg z-20">
                                                            <button onClick={(e)=>{e.stopPropagation(); abrirEditor('mensajes_soyin', msg);}} className="text-blue-400 hover:text-blue-300 p-2"><EditIcon size={16}/></button>
                                                            <button onClick={(e)=>{e.stopPropagation(); eliminarDocumento('mensajes_soyin', msg.id);}} className="text-red-500 hover:text-red-400 p-2"><TrashIcon size={16}/></button>
                                                        </div>
                                                    )}
                                                </div>
                                            </ContenedorMagico>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* VISTA: PANTALLA PRINCIPAL */}
                            {vistaActual === 'principal' && (
                                <div className="w-full max-w-2xl mx-auto flex flex-col items-center gap-8 relative z-10">
                                    
                                    {/* SECCIÓN LATIDOS (ANTHONY - SOLO HOY) */}
                                    <div className="bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-[3.5rem] p-8 md:p-12 shadow-2xl text-center animate-in relative w-full">
                                        <div className="absolute top-0 right-0 m-4">
                                            <button onClick={() => setVistaActual('historial_anthony')} className="flex items-center gap-1.5 text-[9px] uppercase tracking-[0.2em] text-rose-300/60 hover:text-rose-300 transition-colors bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full shadow-lg">
                                                <ListIcon size={12} /> Ver historial de latidos de Anthony
                                            </button>
                                        </div>
                                        
                                        <div className="mb-8 flex justify-center mt-6 heart-beat"><HeartIcon size={80} className="text-rose-500" fill="currentColor" /></div>
                                        <p className="text-rose-400/40 text-[10px] font-bold tracking-[0.6em] mb-4 uppercase">De mí para ti, cariño</p>
                                        
                                        {latidosHoy.length > 0 ? (
                                            <ContenedorMagico color="text-rose-500">
                                                <div className="min-h-[100px] flex flex-col justify-center relative group p-4 border border-transparent hover:border-white/5 rounded-3xl transition-all">
                                                    <SelectorReacciones coleccion="latidos" docId={latidosHoy[idxLatidoHoy].id} reaccionesActuales={latidosHoy[idxLatidoHoy].reacciones} currentUser={currentUserName} showAlert={showAlert} />
                                                    
                                                    <p className="text-2xl md:text-3xl font-body font-light text-rose-50/90 tracking-wide leading-relaxed relative z-10">"{latidosHoy[idxLatidoHoy]?.texto}"</p>
                                                    
                                                    <div className="mt-6 flex flex-col md:flex-row items-center justify-between border-t border-white/5 pt-4 w-full gap-4 relative z-20">
                                                        <div className="flex items-center gap-4">
                                                            <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'latidos', id: latidosHoy[idxLatidoHoy].id }); }} className="text-[10px] text-gray-400 hover:text-white uppercase tracking-widest flex items-center gap-1 transition-colors bg-white/5 px-3 py-1.5 rounded-full">
                                                                <MessageCircleIcon size={14} /> Notas
                                                                <IndicadorNuevaNota ultimaNota={latidosHoy[idxLatidoHoy].ultimaNota} />
                                                            </button>
                                                            <div className="flex gap-1">
                                                                {latidosHoy[idxLatidoHoy].reacciones && Object.values(latidosHoy[idxLatidoHoy].reacciones).map((emoji, i) => (
                                                                    <span key={i} className="text-sm drop-shadow-md">{emoji}</span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <p className="text-[8px] font-timer text-rose-300/30 tracking-widest uppercase">A las {latidosHoy[idxLatidoHoy]?.hora}</p>
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ) : (
                                            <p className="text-white/30 italic font-body text-sm min-h-[100px] flex items-center justify-center bg-black/20 rounded-2xl mt-4 border border-white/5">Esperando un latido para el día de hoy...</p>
                                        )}

                                        {latidosHoy.length > 1 && (
                                            <button onClick={() => setIdxLatidoHoy((idxLatidoHoy + 1) % latidosHoy.length)} className="mt-8 mx-auto text-rose-300 hover:text-white border border-rose-600/40 bg-rose-600/20 px-6 py-2 rounded-full text-[10px] uppercase tracking-[0.2em] font-bold transition-colors flex items-center gap-2">Ver otro latido de hoy <ArrowLeftIcon size={12} className="rotate-180"/></button>
                                        )}
                                    </div>

                                    {/* LA LUNA MÁGICA CONECTORA */}
                                    <div className="relative flex flex-col items-center my-6 w-full">
                                        <div className="absolute h-full w-[2px] bg-gradient-to-b from-rose-500/30 via-white/10 to-purple-500/30 -z-10"></div>
                                        
                                        {/* CONTADOR DE EVENTOS PRÓXIMOS (3 DÍAS) */}
                                        {eventosCercanos.length > 0 && (
                                            <div className="mb-10 w-full flex flex-col gap-4 items-center z-20">
                                                {eventosCercanos.map(ev => (
                                                    <div key={ev.id} className="bg-[#1a160a] border border-yellow-500/50 p-6 rounded-3xl event-glow animate-pulse-slow text-center max-w-sm w-full">
                                                        <div className="flex justify-center mb-2"><SparklesIcon size={20} className="text-yellow-400"/></div>
                                                        <p className="text-[10px] text-yellow-500 uppercase tracking-widest font-bold mb-1">Se acerca una fecha especial</p>
                                                        <h4 className="font-name text-2xl text-yellow-200 mb-4">{ev.titulo}</h4>
                                                        <div className="flex justify-center gap-3 text-yellow-100 font-timer">
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{ev.timeLeft.days}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Días</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.hours).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Horas</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.mins).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Min</span>
                                                            </div>
                                                            <div className="bg-yellow-600/20 rounded-xl px-3 py-2 border border-yellow-500/30 flex flex-col">
                                                                <span className="text-xl md:text-2xl font-bold">{String(ev.timeLeft.secs).padStart(2,'0')}</span>
                                                                <span className="text-[8px] uppercase tracking-wider">Seg</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        <div className="w-44 h-44 md:w-56 md:h-56 bg-neutral-100 rounded-full moon-glow flex flex-col items-center justify-center text-neutral-900 overflow-hidden border border-white/20 z-10 shadow-[0_0_60px_rgba(255,255,255,0.15)] relative">
                                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-black to-transparent"></div>
                                            
                                            <div className="flex items-center gap-3 mb-3">
                                                <HeartIcon size={16} className="text-rose-500 heart-beat" fill="currentColor"/>
                                                <HeartIcon size={16} className="text-purple-500 heart-beat" fill="currentColor" style={{animationDelay: "0.4s"}}/>
                                            </div>
                                            <p className="text-[11px] font-bold tracking-widest text-gray-800 mb-1 z-10">AMÁNDOTE</p>
                                            <div className="flex flex-col items-center font-timer z-10">
                                                <span className="text-3xl md:text-4xl font-bold">{timeElapsed.days}d</span>
                                                <span className="text-xs md:text-sm font-medium">{String(timeElapsed.hours).padStart(2,'0')}h : {String(timeElapsed.mins).padStart(2,'0')}m : {String(timeElapsed.secs).padStart(2,'0')}s</span>
                                            </div>
                                            <p className="text-[8px] md:text-[9px] mt-3 opacity-70 font-bold z-10">Desde {formatearFechaSimple(fechaInicioRelacion)}</p>
                                        </div>
                                    </div>

                                    {/* SECCIÓN SOYIN (SOLO HOY) */}
                                    <div className="bg-purple-900/10 border border-purple-500/20 rounded-[3.5rem] p-8 md:p-12 shadow-[0_0_40px_rgba(147,51,234,0.1)] text-center animate-in backdrop-blur-sm relative w-full">
                                        <div className="absolute top-0 right-0 m-4">
                                            <button onClick={() => setVistaActual('historial_soyin')} className="flex items-center gap-1.5 text-[9px] uppercase tracking-[0.2em] text-purple-300/60 hover:text-purple-300 transition-colors bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full shadow-lg">
                                                <ListIcon size={12} /> Ver historial de latidos de Soyin
                                            </button>
                                        </div>
                                        
                                        <div className="mb-8 flex justify-center mt-6 heart-beat"><HeartIcon size={80} className="text-purple-500" fill="currentColor" /></div>
                                        <p className="text-purple-300/60 text-[10px] font-bold tracking-[0.5em] mb-4 uppercase flex items-center justify-center gap-2">
                                            <SparklesIcon size={14} className="text-purple-400" /> Un latido de Soyin para ti <SparklesIcon size={14} className="text-purple-400" />
                                        </p>

                                        {mensajesSoyinHoy.length > 0 ? (
                                            <ContenedorMagico color="text-purple-400">
                                                <div className="min-h-[100px] flex flex-col justify-center relative group p-4 border border-transparent hover:border-purple-500/10 rounded-3xl transition-all">
                                                    <SelectorReacciones coleccion="mensajes_soyin" docId={mensajesSoyinHoy[idxSoyinHoy].id} reaccionesActuales={mensajesSoyinHoy[idxSoyinHoy].reacciones} currentUser={currentUserName} showAlert={showAlert} />
                                                    
                                                    <div className="text-center bg-black/20 p-6 rounded-3xl border border-purple-500/20 shadow-[inset_0_0_20px_rgba(147,51,234,0.1)] relative z-10 w-full">
                                                        <p className="font-body text-purple-100/90 italic text-xl md:text-2xl leading-relaxed">"{mensajesSoyinHoy[idxSoyinHoy]?.texto}"</p>
                                                    </div>
                                                    
                                                    <div className="mt-4 flex flex-col md:flex-row items-center justify-between pt-2 w-full gap-4 relative z-20">
                                                        <div className="flex items-center gap-4">
                                                            <button onClick={(e) => { e.stopPropagation(); setNotaActiva({ coleccion: 'mensajes_soyin', id: mensajesSoyinHoy[idxSoyinHoy].id }); }} className="text-[10px] text-gray-400 hover:text-white uppercase tracking-widest flex items-center gap-1 transition-colors bg-white/5 px-3 py-1.5 rounded-full">
                                                                <MessageCircleIcon size={14} /> Notas
                                                                <IndicadorNuevaNota ultimaNota={mensajesSoyinHoy[idxSoyinHoy].ultimaNota} />
                                                            </button>
                                                            <div className="flex gap-1">
                                                                {mensajesSoyinHoy[idxSoyinHoy].reacciones && Object.values(mensajesSoyinHoy[idxSoyinHoy].reacciones).map((emoji, i) => (
                                                                    <span key={i} className="text-sm drop-shadow-md">{emoji}</span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <p className="text-[8px] text-purple-300/40 font-timer tracking-widest uppercase">A las {mensajesSoyinHoy[idxSoyinHoy]?.hora}</p>
                                                    </div>
                                                </div>
                                            </ContenedorMagico>
                                        ) : (
                                            <p className="text-white/30 italic font-body text-sm min-h-[100px] flex items-center justify-center bg-black/20 rounded-2xl mt-4 border border-purple-500/10">Esperando el latido de Flor de hoy...</p>
                                        )}

                                        {mensajesSoyinHoy.length > 1 && (
                                            <button onClick={() => setIdxSoyinHoy((idxSoyinHoy + 1) % mensajesSoyinHoy.length)} className="mt-8 mx-auto text-purple-300 hover:text-white border border-purple-600/40 bg-purple-600/20 px-6 py-2 rounded-full text-[10px] uppercase tracking-[0.2em] font-bold transition-colors flex items-center gap-2">Ver otro latido de hoy <ArrowLeftIcon size={12} className="rotate-180"/></button>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* REPRODUCTOR */}
                            <div className="mt-14 flex flex-col items-center pb-8 z-20">
                                <button onClick={toggleMusic} className={`w-20 h-20 rounded-full flex items-center justify-center transition-all border-2 ${isPlaying ? 'bg-rose-600/20 border-rose-500 scale-110 shadow-[0_0_30px_rgba(244,63,94,0.4)]' : 'bg-black/50 border-white/20 hover:border-rose-400 hover:bg-rose-900/20'}`}>
                                    {isPlaying ? <PauseIcon size={32} className="text-white"/> : <PlayIcon size={32} className="ml-1 text-white" />}
                                </button>
                                <p className="mt-5 text-[9px] uppercase tracking-[0.6em] text-white/40 font-bold bg-black/30 px-4 py-1.5 rounded-full border border-white/5">
                                    {isPlaying ? "Nuestra melodía suena..." : "Dale play"}
                                </p>
                            </div>

                            <footer className="mt-8 mb-16 text-center z-20 flex flex-col items-center gap-4">
                                <p className="font-body text-xs italic tracking-widest text-white/30">"En este infinito, tú eres mi estrella más brillante"</p>
                                <div className="flex items-center gap-4 opacity-60 hover:opacity-100 transition-opacity bg-black/40 px-8 py-3 rounded-full border border-white/10 backdrop-blur-md">
                                    <button onClick={() => abrirPanelLogin('anthony')} className="text-xs font-bold uppercase tracking-[0.3em] text-rose-400 hover:text-rose-300 transition-colors cursor-pointer drop-shadow-md hover:scale-105">Anthony</button>
                                    <span className="text-2xl bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-purple-400 animate-infinity font-bold mx-2">∞</span>
                                    <button onClick={() => abrirPanelLogin('soyin')} className="text-xs font-bold uppercase tracking-[0.3em] text-purple-400 hover:text-purple-300 transition-colors cursor-pointer drop-shadow-md hover:scale-105">Soyin</button>
                                </div>
                            </footer>

                            {musicUrl && <audio ref={audioRef} src={musicUrl} loop />}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
